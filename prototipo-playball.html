    </div>
  </div>`;
}

/* Mientras se escribe el nombre: actualiza la vista previa y el botón sin redibujar los campos. */
function refreshBrand(){
  const f = brandForm;
  if (!f) return;
  const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
  set("bp-name", normName(f.name) || "Nombre de la liga");
  set("bp-sub", [normName(f.sport), `Temporada ${LEAGUE.season}`].filter(Boolean).join(" · "));
  set("bp-full", [normName(f.name), normName(f.sport)].filter(Boolean).join(" ") || "Nombre de la liga");
  const st = brandState(f);
  set("bf-hint", st.hint);
  const save = document.getElementById("bf-save"), reset = document.querySelector("[data-bfreset]");
  if (save) save.disabled = !st.changed || st.errors.length > 0;
  if (reset) reset.disabled = !st.changed;
}

function saveBrand(){
  const f = brandForm;
  if (!f || brandState(f).errors.length) return;
  LEAGUE.name = normName(f.name);
  LEAGUE.sport = normName(f.sport);
  LEAGUE.logo = f.logo || "";
  applyAccent(f.accent);
  brandForm = null;
  render();
  toast(`Personalización guardada: ${leagueFull()} ya se ve así en todo el sitio`);
}
applyAccent("vino");

/* Claro por defecto: solo se arranca en oscuro si el usuario ya lo eligió antes. */
function initTheme(){
  let saved = null;
  try { saved = localStorage.getItem("strikeout-theme"); } catch (e) { /* sin storage */ }
  applyTheme(saved === "dark" ? "dark" : "light");
}

let toastTimer;
function toast(msg){
  const el = document.getElementById("toast");
  el.innerHTML = `<b>✓</b> ${esc(msg)}`;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 3400);
}

/* ---------------- eventos ---------------- */
document.addEventListener("click", e => {
  const routeBtn = e.target.closest("[data-route]");
  if (routeBtn) return openRoute(routeBtn.dataset.route);
  const viewAsBtn = e.target.closest("[data-viewas]");
  if (viewAsBtn){
    if (viewer === viewAsBtn.dataset.viewas) return;
    viewer = viewAsBtn.dataset.viewas;
    render();
    window.scrollTo({ top: 0 });
    return toast(viewer === "visitante"
      ? "Vista de visitante: así ven la liga los equipos y el público"
      : "Vista de administrador: con las pantallas del administrador");
  }
  if (e.target.closest("#to-landing")) return openRoute("inicio");
  const statSortBtn = e.target.closest("[data-statsort]");
  if (statSortBtn){
    const k = statSortBtn.dataset.statsort;
    statSort = statSort.key === k ? { key: k, dir: -statSort.dir } : { key: k, dir: k === "name" ? 1 : -1 };
    return render();
  }

  const poCatBtn = e.target.closest("[data-pocat]");
  if (poCatBtn){ poCat = poCatBtn.dataset.pocat; return render(); }
  const poSched = e.target.closest("[data-poschedule]");
  if (poSched){
    const [sid, n] = poSched.dataset.poschedule.split("|");
    const p = pendingPlayoffGames().find(x => x.key === poRegistry[+sid] && x.n === +n);
    if (p) schedForm = playoffSchedForm(p);
    return go("programar");
  }
  if (e.target.closest("[data-poclose]")){
    const cats = CATEGORIES.filter(c => seedsOf(c.id).length >= 2);
    if (!cats.length) return toast("Ninguna categoría tiene equipos suficientes para playoffs");
    const pendingP = calGames().filter(g => g.st === "P" && !g.po).length;
    return askConfirm({
      title: "¿Cerrar la temporada regular?",
      body: `La tabla de hoy queda como final y se publican los playoffs: ${cats.map(c => `${c.name} con ${seedsOf(c.id).length} equipos`).join(", ")}. ${pendingP ? `${plural(pendingP, "juego programado", "juegos programados")} sin resultado de temporada regular ${pendingP === 1 ? "se quita" : "se quitan"} del calendario. ` : ""}Desde ahí, Programar juegos solo ofrece los juegos pendientes de playoffs.`,
      ok: "Cerrar y publicar playoffs",
      onConfirm: () => { closeRegularSeason(); go("playoffs"); toast("Temporada regular cerrada: programa los juegos de playoffs en Programar juegos"); },
    });
  }
  if (e.target.closest("[data-poreopen]")){
    return askConfirm({
      title: "¿Reabrir la temporada regular?",
      body: "Se despublican los playoffs y la llave vuelve a proyectarse con el standing. Los juegos de temporada regular que se quitaron al cerrar no regresan.",
      ok: "Reabrir",
      onConfirm: () => { Object.assign(PLAYOFFS, emptyPlayoffs()); schedForm = defaultSchedForm(); render(); toast("Temporada regular reabierta"); },
    });
  }

  const seasonBtn = e.target.closest("[data-viewseason]");
  if (seasonBtn) return viewSeason(seasonBtn.dataset.viewseason);

  const sdBtn = e.target.closest("[data-sdall], [data-sdshow], [data-sdgames], [data-sdplayoffs], [data-sdadd], [data-sddel], [data-sdcancel], [data-sdcreate]");
  if (sdBtn && seasonDraft) return seasonAction(sdBtn);

  const bfAccent = e.target.closest("[data-bfaccent]");
  if (bfAccent && brandForm){ brandForm.accent = bfAccent.dataset.bfaccent; return render(); }
  if (e.target.closest("[data-bflogoremove]") && brandForm){ brandForm.logo = ""; return render(); }
  if (e.target.closest("[data-bfreset]")){ brandForm = null; return render(); }
  if (e.target.closest("#bf-save")) return saveBrand();

  const menuBtn = e.target.closest("#menu-toggle");
  if (menuBtn){
    const bar = document.querySelector(".topbar");
    const open = !bar.classList.contains("open");
    bar.classList.toggle("open", open);
    menuBtn.setAttribute("aria-expanded", String(open));
    return;
  }

  const paidBtn = e.target.closest("[data-paidleague]");
  if (paidBtn){
    const a = accounts.find(x => x.id === paidBtn.dataset.paidleague);
    a.paidUntil = addMonths(a.paidUntil > TODAY ? a.paidUntil : TODAY, a.plan === "Anual" ? 12 : 1);
    render();
    return toast(`${a.name}: pago registrado hasta el ${fmtDay(a.paidUntil)}${a.blocked ? ". La edición sigue bloqueada hasta que la desbloquees" : ""}`);
  }

  if (e.target.closest("[data-teamnew]")){ openTeamForm(null); return render(); }
  const teamEdit = e.target.closest("[data-teamedit]");
  if (teamEdit){ openTeamForm(teamEdit.dataset.teamedit); return render(); }
  const teamAdminTab = e.target.closest("[data-teamadmincat]");
  if (teamAdminTab){
    teamAdminCat = teamAdminTab.dataset.teamadmincat;
    if (teamForm && !teamForm.original) teamForm.cat = teamAdminCat;
    return render();
  }
  const mgrKind = e.target.closest("[data-mgrkind]");
  if (mgrKind){ teamForm.mgrKind = mgrKind.dataset.mgrkind; return render(); }
  if (e.target.closest("[data-teamaddplayer]")) return addPlayerFromInput();
  const delPlayer = e.target.closest("[data-teamdelplayer]");
  if (delPlayer){
    const i = +delPlayer.dataset.teamdelplayer, name = teamForm.roster[i];
    const isManager = teamForm.mgrKind === "jugador" && teamForm.mgrPlayer === name;
    return askConfirm({
      title: `¿Quitar a ${name}?`,
      body: `Sale del roster de ${normName(teamForm.name) || "este equipo"}${isManager ? " y deja de ser su manager" : ""}. El cambio se aplica al guardar el equipo.`,
      onConfirm: () => {
        teamForm.roster.splice(i, 1);
        if (teamForm.mgrPlayer === name) teamForm.mgrPlayer = "";
        render();
      },
    });
  }
  if (e.target.closest("[data-teamlogoremove]")){ teamForm.logo = null; return render(); }
  if (e.target.closest("[data-teamsave]")) return saveTeam();
  if (e.target.closest("[data-teamcancel]")){ teamForm = null; return render(); }
  if (e.target.closest("[data-teambajaask]")){ teamForm.confirmBaja = true; return render(); }
  if (e.target.closest("[data-teambajacancel]")){ teamForm.confirmBaja = false; return render(); }
  if (e.target.closest("[data-teambaja]")) return withdrawTeam(teamForm.original);

  const cw = e.target.closest("[data-calweek]");
  if (cw){
    calWeek = +cw.dataset.calweek; calCat = cw.dataset.calcatgo || mainCat().id; openGame = null;
    screen = "calendario"; render(); return window.scrollTo({ top:0 });
  }
  const wkBtn = e.target.closest("[data-week]");
  if (wkBtn){ calWeek = +wkBtn.dataset.week; openGame = null; return render(); }
  const step = e.target.closest("[data-weekstep]");
  if (step){
    calWeek = Math.min(calWeeks(), Math.max(1, (calWeek ?? TODAY_WEEK) + +step.dataset.weekstep));
    openGame = null; return render();
  }
  const ccat = e.target.closest("[data-calcat]");
  if (ccat){ calCat = ccat.dataset.calcat; calWeek = null; openGame = null; return render(); }
  const gm = e.target.closest("[data-game]");
  if (gm){ openGame = openGame === gm.dataset.game ? null : gm.dataset.game; return render(); }

  const viewGameBtn = e.target.closest("[data-viewgame]");
  if (viewGameBtn) return openGamePage(viewGameBtn.dataset.viewgame);
  if (e.target.closest("[data-teamback]")){
    screen = isVisitor() && ADMIN_SCREENS.includes(teamBack) ? "inicio" : teamBack === "equipo" ? "equipos" : teamBack;
    render();
    return window.scrollTo({ top: 0 });
  }
  if (e.target.closest("[data-gameback]")){
    screen = isVisitor() && ADMIN_SCREENS.includes(gameBack) ? "inicio" : gameBack;
    render();
    return window.scrollTo({ top: 0 });
  }

  const jump = e.target.closest("[data-jump]");
  if (jump){
    const target = document.getElementById(jump.dataset.jump);
    if (target) target.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }

  const fixGameBtn = e.target.closest("[data-fixgame]");
  if (fixGameBtn){
    const g = calGames().find(x => x.id === fixGameBtn.dataset.fixgame);
    if (!g) return;
    fixForm = fixFormFor(g);
    return go("corregir");
  }

  const capBtn = e.target.closest("[data-capture]");
  if (capBtn){
    capMode = "nuevo";
    setCaptureGame(calGames().find(x => x.id === capBtn.dataset.capture) || null);
    return go("capturar");
  }

  const capModeBtn = e.target.closest("[data-capmode]");
  if (capModeBtn){
    capMode = capModeBtn.dataset.capmode;
    if (capMode === "corregir" && !fixForm) fixForm = defaultFixForm();
    return render();
  }

  if (e.target.closest("#fix-save, [data-fixsave]")){
    const g = fixGame();
    if (!g || fixChecks(g, fixForm).errors.length) return;
    const cur = boxOf(g);
    let box = null, boxResult = { registered: [], improper: [] };
    if (fixForm.st === "F" && fixForm.box && boxChanged(g, fixForm.box)){
      boxResult = finalizeBox(fixForm.box);
      const total = arr => arr.reduce((t, v) => t + (+v || 0), 0);
      const keepInnings = cur && cur.innings && total(cur.innings.a) === fixForm.as && total(cur.innings.h) === fixForm.bs;
      box = { sides: cloneBox(fixForm.box.sides), pitch: cloneBox(fixForm.box.pitch), innings: keepInnings ? cur.innings : null, kind: cur ? "corregido" : "capturado" };
    }
    corrections.push({ id: g.id, w: g.w, cat: g.c, a: g.a, b: g.b, before: snapshot(g), after: afterOf(fixForm), box, reason: fixForm.reason.trim(), at: TODAY });
    changedTeams = [g.a, g.b];
    fixForm = fixFormFor(calGames().find(x => x.id === g.id));
    render();
    return toast(`Corrección guardada · la tabla de ${catName(g.c)} ya se recalculó${box ? ` · box score ${box.kind}` : ""}${boxToast(boxResult)}`);
  }

  const fixBoxBtn = e.target.closest("[data-fixbox]");
  if (fixBoxBtn){
    const g = fixGame();
    if (!g || !fixForm) return;
    if (fixBoxBtn.dataset.fixbox === "discard") return askConfirm({
      title: "¿Descartar los cambios al box score?",
      body: "Se pierde lo que llevas en el orden al bat y el pitcheo de este juego. El resultado de la corrección no cambia.",
      ok: "Descartar",
      onConfirm: () => { fixForm.box = null; render(); },
    });
    const cur = boxOf(g);
    const S = { away: g.a, home: g.b, boxSide: "a", a: [0], h: [0],
      sides: cur ? cloneBox(cur.sides) : { a: blankLineup(g.a), b: blankLineup(g.b) },
      pitch: cur && cur.pitch ? cloneBox(cur.pitch) : null };
    fixForm.box = S;
    syncFixBox(fixForm);
    if (!S.pitch) S.pitch = { a: defaultPitching("a", S), b: defaultPitching("b", S) };
    return render();
  }

  const unfix = e.target.closest("[data-unfix]");
  if (unfix){
    const [c] = corrections.splice(+unfix.dataset.unfix, 1);
    if (c && fixForm && fixForm.gameId === c.id) fixForm = fixFormFor(calGames().find(x => x.id === c.id));
    render();
    return toast("Corrección revertida");
  }

  const viewTable = e.target.closest("[data-viewtable]");
  if (viewTable){
    currentCat = viewTable.dataset.viewtable;
    changedTeams = viewTable.dataset.teams.split("|");
    screen = "standing";
    render();
    return window.scrollTo({ top:0 });
  }

  const go_ = e.target.closest("[data-go]");
  if (go_) return go(go_.dataset.go);

  const cat = e.target.closest("[data-cat]");
  if (cat){ currentCat = cat.dataset.cat; return render(); }

  const rc = e.target.closest("[data-rescat]");
  if (rc){ resCat = rc.dataset.rescat; return render(); }

  const tc = e.target.closest("[data-teamcat]");
  if (tc){ teamCat = tc.dataset.teamcat; return render(); }

  const lc = e.target.closest("[data-leadcat]");
  if (lc){ leadCat = lc.dataset.leadcat; return render(); }

  const sg = e.target.closest("[data-seasongames]");
  if (sg){ SEASON.games = Math.min(30, Math.max(2, SEASON.games + +sg.dataset.seasongames)); return render(); }

  const po = e.target.closest("[data-playoffs]");
  if (po){
    const [id, step] = po.dataset.playoffs.split("|");
    const n = (TEAMS[id] || []).length;
    SEASON.playoffs[id] = Math.min(n >= 2 ? n : 16, Math.max(2, (SEASON.playoffs[id] || 0) + +step));
    return render();
  }

  const ds = e.target.closest("[data-duesstep]");
  if (ds){ duesWeeks = Math.min(8, Math.max(1, duesWeeks + +ds.dataset.duesstep)); return render(); }

  const pc = e.target.closest("[data-paycat]");
  if (pc){ payCat = pc.dataset.paycat; return render(); }

  const boxSide = e.target.closest("[data-boxside]");
  if (boxSide){ bx().boxSide = boxSide.dataset.boxside; return render(); }

  const piAdd = e.target.closest("[data-piadd]");
  if (piAdd){
    const side = piAdd.dataset.piadd;
    const team = side === "a" ? bx().away : bx().home;
    bx().pitch[side].push(newPitcher("", !rosterOf(team).length));
    return render();
  }

  const piDel = e.target.closest("[data-pidel]");
  if (piDel){
    const [side, i] = piDel.dataset.pidel.split("|");
    const name = normName(bx().pitch[side][+i].player);
    return askConfirm({
      title: name ? `¿Quitar a ${name} del pitcheo?` : "¿Quitar este pitcher?",
      body: "Se quitan sus entradas lanzadas, carreras, ponches y su decisión de este juego.",
      onConfirm: () => { bx().pitch[side].splice(+i, 1); render(); },
    });
  }

  const piList = e.target.closest("[data-pilist]");
  if (piList){
    const [side, i] = piList.dataset.pilist.split("|");
    Object.assign(bx().pitch[side][+i], { player: "", typed: false });
    return render();
  }

  const luList = e.target.closest("[data-lulist]");
  if (luList){
    const [side, i, k] = luList.dataset.lulist.split("|");
    const slot = bx().sides[side][+i], entry = slot.entries[+k];
    entry.player = "";
    entry.typed = false;
    if (+k === 0) slot.entries.forEach(x => { if (x.kind === "reingreso") x.player = ""; });
    return render();
  }

  const luStart = e.target.closest("[data-lustart]");
  if (luStart){
    bx().sides[luStart.dataset.lustart] = GENERIC_POS.map(pos => ({ entries: [{ ...newEntry("", pos), typed: true }] }));
    if (!bx().pitch[luStart.dataset.lustart].length) bx().pitch[luStart.dataset.lustart] = [newPitcher("", true, "7.0")];
    return render();
  }

  const luClear = e.target.closest("[data-luclear]");
  if (luClear){
    const side = luClear.dataset.luclear;
    const team = side === "a" ? bx().away : bx().home;
    return askConfirm({
      title: `¿Capturar solo el marcador de ${team}?`,
      body: "Se borran el orden al bat y el pitcheo que llevas capturados de este equipo.",
      ok: "Borrar captura",
      onConfirm: () => { bx().sides[side] = []; bx().pitch[side] = []; render(); },
    });
  }

  const luAdd = e.target.closest("[data-luadd]");
  if (luAdd){
    const [side, i, kind] = luAdd.dataset.luadd.split("|");
    const slot = bx().sides[side][+i], last = lastOf(slot), starter = slot.entries[0];
    const inn = Math.min(INNINGS, (last.inn || 1) + 1);
    if (kind === "reingreso" && canReenter(slot)) slot.entries.push(newEntry(starter.player, starter.pos, "reingreso", inn));
    if (kind === "cambio" && last.player && last.kind !== "cambio") slot.entries.push(newEntry("", starter.pos === "JC" ? "JC" : last.pos, "cambio", inn));
    return render();
  }

  const luDel = e.target.closest("[data-ludel]");
  if (luDel){
    const [side, i] = luDel.dataset.ludel.split("|");
    const slot = bx().sides[side][+i];
    if (slot.entries.length < 2) return;
    const last = lastOf(slot), name = normName(last.player);
    return askConfirm({
      title: name ? `¿Quitar a ${name} del juego?` : "¿Quitar este cambio?",
      body: `Se quita ${last.kind === "reingreso" ? "el reingreso" : "el cambio"} del turno ${+i + 1} con sus estadísticas de este juego.`,
      onConfirm: () => { slot.entries.pop(); render(); },
    });
  }

  const luSlot = e.target.closest("[data-luslot]");
  if (luSlot){
    const [side, i] = luSlot.dataset.luslot.split("|");
    const slot = bx().sides[side][+i], name = normName(slot.entries[0].player);
    return askConfirm({
      title: name ? `¿Quitar a ${name} del orden al bat?` : `¿Quitar el turno ${+i + 1}?`,
      body: `Se quita el turno ${+i + 1}${slot.entries.length > 1 ? " con sus cambios" : ""} y sus estadísticas de este juego. Los turnos de abajo suben un lugar.`,
      onConfirm: () => { bx().sides[side].splice(+i, 1); render(); },
    });
  }

  const luAddSlot = e.target.closest("[data-luaddslot]");
  if (luAddSlot){
    const slots = bx().sides[luAddSlot.dataset.luaddslot];
    if (slots.length >= MAX_BATTERS) return;
    const pos = slots.length >= MIN_BATTERS ? "JC" : (FIELD_POS.find(p => !slots.some(s => lastOf(s).pos === p)) || "JD");
    slots.push({ entries: [newEntry("", pos)] });
    return render();
  }

  if (e.target.closest("#sch-newweek")){
    createdWeeks = calWeeks() - WEEKS + 1;
    const w = calWeeks();
    const cat = CATEGORIES.find(c => c.id === schedForm.cat) || mainCat();
    schedForm = { ...schedForm, w, ...firstFree(cat, w) };
    render();
    return toast(`Semana ${w} creada · ${weekRange(w)}`);
  }

  const pickSlot = e.target.closest("[data-pickslot]");
  if (pickSlot){
    const [d, h] = pickSlot.dataset.pickslot.split("|");
    Object.assign(schedForm, { d, h });
    return render();
  }

  const useSugg = e.target.closest("[data-usesugg]");
  if (useSugg){
    const s = JSON.parse(useSugg.dataset.usesugg);
    schedForm = { cat: s.c, w: s.w, a: s.a, b: s.b, d: s.d, h: s.h };
    render();
    window.scrollTo({ top:0 });
    return toast(`Sugerencia en el formulario: ${s.a} vs ${s.b}`);
  }

  const unsched = e.target.closest("[data-unsched]");
  if (unsched){
    const g = calGames().find(x => x.id === unsched.dataset.unsched && x.st === "P");
    if (!g) return;
    return askConfirm({
      title: `¿Eliminar ${g.a} vs ${g.b}?`,
      body: `Se quita del calendario: semana ${g.w}, ${DIAS[parseD(g.d).getUTCDay()]} ${fmtDay(g.d)} a las ${g.h} en ${fieldOf(g)}. El horario queda libre para programar otro juego.`,
      ok: "Eliminar juego",
      onConfirm: () => unscheduleGame(g.id),
    });
  }

  if (e.target.closest("#sch-save")){
    const f = schedForm;
    if (schedCheck(f).errors.length) return;
    const g = { w: f.w, d: f.d, h: f.h, c: f.cat, a: f.a, b: f.b, st: "P", id: `sch-${++schedSeq}`, ...(f.po ? { po: { ...f.po } } : {}) };
    scheduled.push(g);
    const cat = CATEGORIES.find(c => c.id === g.c) || mainCat();
    if (f.po){
      const next = pendingPlayoffGames()[0];
      schedForm = next ? playoffSchedForm(next) : { ...f, a: "", b: "", po: null };
    } else {
      schedForm = { ...f, a: "", b: "", ...firstFree(cat, f.w) };
    }
    render();
    return toast(`Programado: ${g.a} vs ${g.b}${g.po ? ` · playoffs, juego ${g.po.n}` : ""} · ${DIAS[parseD(g.d).getUTCDay()]} ${fmtDay(g.d)}, ${g.h} · ${cat.field}`);
  }

  const s = e.target.closest("[data-sort]");
  if (s){ sortKey = sortKey === s.dataset.sort ? "default" : s.dataset.sort; return render(); }

  const team = e.target.closest("[data-team]");
  if (team) return openTeamPage(team.dataset.team);

  if (e.target.closest("#save")) return publish();
  if (e.target.closest("#reset")) return resetDemo();
  if (e.target.closest("#theme")){
    return applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  }
});

document.addEventListener("input", e => {
  if (["sd-season", "sd-year", "sd-newname"].includes(e.target.id) && seasonDraft){
    seasonDraft[{ "sd-season": "season", "sd-year": "year", "sd-newname": "newName" }[e.target.id]] = e.target.value;
    return refreshSeason();
  }
  if ((e.target.id === "bf-name" || e.target.id === "bf-sport") && brandForm){
    brandForm[e.target.id === "bf-name" ? "name" : "sport"] = e.target.value;
    return refreshBrand();
  }
  if (e.target.id === "tf-name"){ teamForm.name = e.target.value; return refreshTeamChecks(); }
  if (e.target.id === "tf-mgrname"){ teamForm.mgrName = e.target.value; return refreshTeamChecks(); }
  if (e.target.id === "fix-as" || e.target.id === "fix-bs"){
    fixForm[e.target.id === "fix-as" ? "as" : "bs"] = e.target.value === "" ? NaN : Number(e.target.value);
    if (fixForm.box){ syncFixBox(fixForm); return recalcCapture(); }
    return refreshFix();
  }
  if (e.target.id === "fix-reason"){ fixForm.reason = e.target.value; return refreshFix(); }
  const inn = e.target.closest("[data-inn]");
  if (inn){
    const v = Math.max(0, Math.min(99, parseInt(inn.value, 10) || 0));
    capState[inn.dataset.inn][+inn.dataset.i] = v;
    return recalcCapture();
  }
  const pitchIn = e.target.closest("input[data-pi]");
  if (pitchIn){
    const [side, i, field] = pitchIn.dataset.pi.split("|");
    const p = bx().pitch[side][+i];
    if (field === "player"){ p.player = pitchIn.value; p.typed = true; }
    else if (field === "EL") p.EL = pitchIn.value;
    else p[field] = Math.max(0, Math.min(99, parseInt(pitchIn.value, 10) || 0));
    return recalcCapture();
  }
  const lineupStat = e.target.closest("input[data-lu]");
  if (lineupStat){
    const [side, i, k, field] = lineupStat.dataset.lu.split("|");
    const slot = bx().sides[side][+i], entry = slot.entries[+k];
    if (field === "player"){
      entry.player = lineupStat.value;
      entry.typed = true;
      if (+k === 0) slot.entries.forEach(x => { if (x.kind === "reingreso") x.player = entry.player; });
    } else {
      entry[field] = Math.max(0, Math.min(99, parseInt(lineupStat.value, 10) || 0));
    }
    return recalcCapture();
  }
});

document.addEventListener("change", e => {
  const lockSwitch = e.target.closest("[data-lockleague]");
  if (lockSwitch){
    const a = accounts.find(x => x.id === lockSwitch.dataset.lockleague);
    a.blocked = lockSwitch.checked;
    render();
    return toast(`${a.name}: edición ${a.blocked ? "bloqueada" : "desbloqueada"}`);
  }
  if (e.target.id === "tf-cat"){ teamForm.cat = e.target.value; return render(); }
  if (e.target.id === "tf-mgrplayer"){ teamForm.mgrPlayer = e.target.value; return render(); }
  if (e.target.id === "season-select") return viewSeason(e.target.value);
  const sdIn = e.target.closest("[data-sdinc], [data-sdcat], [data-sdroster], [data-sdpaid]");
  if (sdIn && seasonDraft){
    const ds = sdIn.dataset, key = ds.sdinc || ds.sdcat || ds.sdroster || ds.sdpaid;
    const t = seasonDraft.teams.find(x => x.key === key);
    if (!t) return;
    if (ds.sdinc) t.include = sdIn.checked;
    else if (ds.sdcat) t.cat = sdIn.value;
    else if (ds.sdroster) t.keepRoster = sdIn.checked;
    else t.paid = sdIn.checked;
    return render();
  }
  if (e.target.id === "sd-newcat" && seasonDraft){ seasonDraft.newCat = e.target.value; return; }
  if (e.target.id === "bf-logo"){
    const file = e.target.files && e.target.files[0];
    if (!file || !brandForm) return;
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return toast("El logo tiene que ser PNG, JPG o WebP");
    if (file.size > 1024 * 1024) return toast("El logo pesa más de 1 MB");
    const reader = new FileReader();
    reader.onload = () => { brandForm.logo = reader.result; render(); };
    reader.readAsDataURL(file);
    return;
  }
  if (e.target.id === "tf-logo"){
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return toast("El logo tiene que ser PNG, JPG o WebP");
    if (file.size > 1024 * 1024) return toast("El logo pesa más de 1 MB");
    const reader = new FileReader();
    reader.onload = () => { teamForm.logo = reader.result; render(); };
    reader.readAsDataURL(file);
    return;
  }
  const pitchName = e.target.closest("input.luname[data-pi]");
  if (pitchName){
    const [side, i] = pitchName.dataset.pi.split("|");
    const team = side === "a" ? bx().away : bx().home;
    const p = bx().pitch[side][+i];
    const clean = normName(pitchName.value);
    const match = rosterOf(team).find(n => nameKey(n) === nameKey(clean));
    p.player = match || clean;
    p.typed = !match;
    pitchName.value = p.player;
    return recalcCapture();
  }
  const pitchEL = e.target.closest("input[data-pi$='|EL']");
  if (pitchEL){
    const [side, i] = pitchEL.dataset.pi.split("|");
    const p = bx().pitch[side][+i], o = outsOf(p.EL);
    if (!Number.isNaN(o)){ p.EL = fmtEL(o); pitchEL.value = p.EL; }
    return recalcCapture();
  }
  const pitchSel = e.target.closest("select[data-pi]");
  if (pitchSel){
    const [side, i, field] = pitchSel.dataset.pi.split("|");
    const p = bx().pitch[side][+i];
    if (field === "player" && pitchSel.value === "__nuevo__"){
      p.player = "";
      p.typed = true;
      render();
      const box = document.querySelector(`input[data-pi="${side}|${i}|player"]`);
      if (box) box.focus();
      return;
    }
    p[field] = pitchSel.value;
    return render();
  }
  const typedName = e.target.closest("input.luname[data-lu]");
  if (typedName){
    const [side, i, k] = typedName.dataset.lu.split("|");
    const team = side === "a" ? bx().away : bx().home;
    const slot = bx().sides[side][+i], entry = slot.entries[+k];
    const clean = normName(typedName.value);
    const match = rosterOf(team).find(n => nameKey(n) === nameKey(clean));
    entry.player = match || clean;
    entry.typed = !match;
    typedName.value = entry.player;
    if (+k === 0) slot.entries.forEach(x => { if (x.kind === "reingreso") x.player = entry.player; });
    return recalcCapture();
  }
  const lineupSel = e.target.closest("select[data-lu]");
  if (lineupSel){
    const [side, i, k, field] = lineupSel.dataset.lu.split("|");
    const slot = bx().sides[side][+i], entry = slot.entries[+k];
    if (field === "player" && lineupSel.value === "__nuevo__"){
      entry.player = "";
      entry.typed = true;
      if (+k === 0) slot.entries.forEach(x => { if (x.kind === "reingreso") x.player = ""; });
      render();
      const box = document.querySelector(`input[data-lu="${side}|${i}|${k}|player"]`);
      if (box) box.focus();
      return;
    }
    entry[field] = field === "inn" ? +lineupSel.value : lineupSel.value;
    if (field === "pos" && +k === 0 && lineupSel.value === "JC") slot.entries.forEach(x => { x.pos = "JC"; });
    return render();
  }
  const pay = e.target.closest("[data-teampay]");
  if (pay){
    const team = pay.dataset.teampay;
    TEAM_DUES[team] = pay.checked ? TODAY_WEEK : null;
    render();
    return toast(pay.checked ? `${team}: inscripción cubierta` : `${team}: inscripción marcada como pendiente`);
  }
  if (e.target.id === "cap-st"){ capState.st = e.target.value; return render(); }
  if (e.target.id === "cap-ff"){ capState.ff = e.target.value; return render(); }
  if (e.target.id === "cap-why"){ capState.why = e.target.value; return render(); }
  if (e.target.id === "sch-po"){
    const p = pendingPlayoffGames()[+e.target.value];
    if (p) schedForm = playoffSchedForm(p);
    return render();
  }
  if (e.target.id === "sugg-toggle"){ showSugg = e.target.checked; return render(); }
  if (e.target.id === "sch-cat" || e.target.id === "sch-w"){
    const catId = e.target.id === "sch-cat" ? e.target.value : schedForm.cat;
    const cat = CATEGORIES.find(c => c.id === catId) || mainCat();
    const w = e.target.id === "sch-w" ? +e.target.value : schedForm.w;
    const keepTeams = e.target.id === "sch-w";
    schedForm = { cat: cat.id, w, a: keepTeams ? schedForm.a : "", b: keepTeams ? schedForm.b : "", ...firstFree(cat, w), po: keepTeams ? schedForm.po : null };
    return render();
  }
  if (e.target.id === "sch-d"){
    const cat = CATEGORIES.find(c => c.id === schedForm.cat) || mainCat();
    const busy = busySlots(cat, schedForm.w);
    const d = e.target.value;
    const times = cat.times || ["19:00", "21:00"];
    const h = busy.has(d + "|" + schedForm.h) ? (times.find(t => !busy.has(d + "|" + t)) || schedForm.h) : schedForm.h;
    Object.assign(schedForm, { d, h });
    return render();
  }
  if (["sch-a", "sch-b", "sch-h"].includes(e.target.id)){
    const key = { "sch-a": "a", "sch-b": "b", "sch-h": "h" }[e.target.id];
    schedForm[key] = e.target.value;
    if (key === "a" && schedForm.b === schedForm.a) schedForm.b = "";
    return render();
  }
  if (e.target.id === "sel-week"){
    capState.week = +e.target.value;
    setCaptureGame(capturable(capState.week).find(g => g.d <= TODAY) || null);
    capState.week = +e.target.value;
    return render();
  }
  if (e.target.id === "fix-week"){
    const week = +e.target.value, gs = correctable(week);
    fixForm = gs.length ? fixFormFor(gs[gs.length - 1]) : { ...fixForm, week, gameId: null };
    return render();
  }
  if (e.target.id === "fix-game"){ fixForm = fixFormFor(calGames().find(x => x.id === e.target.value)); return render(); }
  if (e.target.id === "fix-st"){ fixForm.st = e.target.value; return render(); }
  if (e.target.id === "fix-ff" || e.target.id === "fix-why"){
    fixForm[e.target.id === "fix-ff" ? "ff" : "why"] = e.target.value;
    return refreshFix();
  }
  if (e.target.id === "sel-game"){
    setCaptureGame(calGames().find(g => g.id === e.target.value) || null);
    return render();
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "tf-newplayer"){ e.preventDefault(); addPlayerFromInput(); }
});
window.addEventListener("hashchange", bootRoute);

initTheme();
bootRoute();
</script>
