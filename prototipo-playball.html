/* ---------------- pitcheo ---------------- */
const PITCH_KEYS = ["H", "C", "CL", "BB", "K"];
const DECISIONS = [["", "—"], ["G", "G"], ["P", "P"], ["S", "S"]];
/* Entradas lanzadas como se anotan: 6.1 = 6 entradas y 1 out, 6.2 = 6 entradas y 2 outs. */
const outsOf = el => {
  const m = String(el == null ? "" : el).trim().match(/^(\d{1,2})(?:\.([012])?)?$/);
  return m ? +m[1] * 3 + (+m[2] || 0) : NaN;
};
const fmtEL = outs => `${Math.floor(outs / 3)}.${outs % 3}`;
const fmtEra = (cl, outs) => outs > 0 ? ((+cl || 0) * INNINGS * 3 / outs).toFixed(2) : "—";
const newPitcher = (player = "", typed = false, EL = "0.0") => ({ player, dec: "", EL, H: 0, C: 0, CL: 0, BB: 0, K: 0, typed });

/* Pitcheo de ejemplo: un pitcher completo por equipo, con lo que bateó el rival. */
/* Pitcheo en blanco: un renglón para el abridor, sin nombre ni números. */
function defaultPitching(side, S = bx()){
  const team = side === "a" ? S.away : S.home;
  return rosterOf(team).length && pitchOn() ? [newPitcher("", false, "")] : [];
}

function pitchCheck(team, side){
  const errors = [], warnings = [];
  const rows = (bx().pitch && bx().pitch[side]) || [];
  const slots = (bx().sides && bx().sides[side]) || [];
  if (!rows.length){
    if (slots.length) warnings.push(`${team}: falta capturar su pitcheo.`);
    return { errors, warnings };
  }
  const seen = new Set();
  let outs = 0, badEL = false;
  rows.forEach((p, i) => {
    const name = normName(p.player), label = name || `el pitcher ${i + 1}`;
    if (!name) errors.push(`${team}: falta elegir al pitcher ${i + 1}.`);
    else if (seen.has(nameKey(name))) errors.push(`${team}: ${name} aparece dos veces en el pitcheo.`);
    else seen.add(nameKey(name));
    const o = pitOn("EL") ? outsOf(p.EL) : 0;
    if (Number.isNaN(o)){ badEL = true; errors.push(`${team}: las entradas lanzadas de ${label} se escriben como 6, 6.1 o 6.2 (entradas y outs).`); }
    else outs += o;
    if (pitOn("CL") && pitOn("C") && (+p.CL || 0) > (+p.C || 0)) errors.push(`${team}: ${label} tiene más carreras limpias que carreras.`);
  });
  const sum = k => rows.reduce((t, p) => t + (+p[k] || 0), 0);
  const oppRuns = (side === "a" ? bx().h : bx().a).reduce((t, v) => t + (+v || 0), 0);
  if (pitOn("C") && sum("C") !== oppRuns) warnings.push(`${team}: sus pitchers permitieron ${sum("C")} carreras y el rival anotó ${oppRuns}.`);
  const opp = (bx().sides && bx().sides[side === "a" ? "b" : "a"]) || [];
  if (opp.length){
    for (const [k, label] of [["H", "hits"], ["BB", "bases por bolas"], ["K", "ponches"]]){
      const theirs = opp.reduce((t, s) => t + s.entries.reduce((u, e) => u + (+e[k] || 0), 0), 0);
      if (pitOn(k) && batOn(k) && sum(k) !== theirs) warnings.push(`${team}: los ${label} de su pitcheo (${sum(k)}) no coinciden con el bateo del rival (${theirs}).`);
    }
  }
  if (!badEL && pitOn("EL")){
    if (outs > boxInnings() * 3) warnings.push(`${team}: las entradas lanzadas suman ${fmtEL(outs)}, más de las ${boxInnings()} entradas del juego.`);
    else if (outs < (INNINGS - 1) * 3) warnings.push(`${team}: las entradas lanzadas suman ${fmtEL(outs)}; revisa si el juego se acortó.`);
  }
  return { errors, warnings };
}

/* Ganado, perdido y salvado: uno de cada uno en el juego, y del lado que corresponde. */
function decisionCheck(){
  const errors = [], warnings = [];
  const rowsA = (bx().pitch && bx().pitch.a) || [], rowsB = (bx().pitch && bx().pitch.b) || [];
  if (!rowsA.length && !rowsB.length) return { errors, warnings };
  const total = arr => arr.reduce((t, v) => t + (+v || 0), 0);
  const ta = total(bx().a), th = total(bx().h);
  const teamOf = s => s === "a" ? bx().away : bx().home;
  const tagged = [...rowsA.map(p => ({ p, side: "a" })), ...rowsB.map(p => ({ p, side: "b" }))];
  const who = x => `${normName(x.p.player) || "Un pitcher"} (${teamOf(x.side)})`;
  const by = d => tagged.filter(x => x.p.dec === d);
  const G = by("G"), P = by("P"), S = by("S");
  if (G.length > 1) errors.push(`Solo un pitcher se lleva el ganado; están marcados ${G.map(who).join(" y ")}.`);
  if (P.length > 1) errors.push(`Solo un pitcher carga con el perdido; están marcados ${P.map(who).join(" y ")}.`);
  if (S.length > 1) errors.push(`Solo un pitcher se lleva el salvado; están marcados ${S.map(who).join(" y ")}.`);
  if (ta === th){
    if (G.length || P.length || S.length) warnings.push("Con el marcador empatado no hay ganado, perdido ni salvado.");
    return { errors, warnings };
  }
  const win = ta > th ? "a" : "b", lose = win === "a" ? "b" : "a";
  G.filter(x => x.side === lose).forEach(x => errors.push(`${who(x)} no puede llevarse el ganado: su equipo perdió.`));
  S.filter(x => x.side === lose).forEach(x => errors.push(`${who(x)} no puede llevarse el salvado: su equipo perdió.`));
  P.filter(x => x.side === win).forEach(x => errors.push(`${who(x)} no puede cargar con el perdido: su equipo ganó.`));
  if ((win === "a" ? rowsA : rowsB).length && !G.some(x => x.side === win)) warnings.push(`Falta marcar quién se lleva el ganado (G) de ${teamOf(win)}.`);
  if ((lose === "a" ? rowsA : rowsB).length && !P.some(x => x.side === lose)) warnings.push(`Falta marcar quién carga con el perdido (P) de ${teamOf(lose)}.`);
  return { errors, warnings };
}

  home: (CAL.find(g => g.id === "hoy") || {}).b,   // el rival de hoy en el calendario
  cat: "novatos",
  sides: { a: [], b: [] },       // orden al bat de cada equipo
  boxSide: "a",                  // equipo que se ve en el orden al bat
  week: TODAY_WEEK,              // semana elegida en Capturar
  gameId: "hoy",                 // juego programado que se está capturando
  pitch: { a: [], b: [] },       // pitchers de cada equipo
};

/* En Capturar solo se ofrecen los juegos programados (sin resultado) de la semana. */
const capturable = week => calGames()
  .filter(g => g.w === week && g.st === "P")
  .sort((x, y) => (x.d + x.h + fieldOf(x)).localeCompare(y.d + y.h + fieldOf(y)));
const captureGame = () => calGames().find(g => g.id === capState.gameId && g.st === "P") || null;

/* Elegir un juego arma el orden al bat de ejemplo de los dos equipos con su roster. */
function setCaptureGame(g){
  capState.gameId = g ? g.id : null;
  if (g){ capState.week = g.w; capState.cat = g.c; }
  capState.away = g ? g.a : "";
  capState.home = g ? g.b : "";
  capState.a = Array(INNINGS).fill("");
  capState.h = Array(INNINGS).fill("");
  capState.sides = { a: defaultLineup(capState.away, "a"), b: defaultLineup(capState.home, "b") };
  capState.pitch = { a: defaultPitching("a", capState), b: defaultPitching("b", capState) };
  capState.boxSide = "a";
  capState.swapped = false;      // true: abre el equipo que en el calendario va segundo
  capState.st = "F";             // F se jugó · FF forfit · NJ no se jugó
  capState.ff = "b";             // quién no se presentó
  capState.why = WHY_NJ[0];      // por qué no se jugó
}
setCaptureGame(CAL.find(g => g.id === "hoy") || null);
const capTotals = () => ({
  a: capState.a.reduce((x,v) => x + (+v || 0), 0),
  h: capState.h.reduce((x,v) => x + (+v || 0), 0),
});

/* Quién abre la entrada: el lado "a" siempre es el que abre (batea en la parte alta). */
let boxPair = false;             // bateo de un equipo y pitcheo del rival en la misma vista
const otherSide = s => s === "a" ? "b" : "a";
const pitchSideOf = side => boxPair ? otherSide(side) : side;

function swapCaptureSides(){
  const S = capState;
  [S.away, S.home] = [S.home, S.away];
  [S.a, S.h] = [S.h, S.a];
  S.sides = { a: S.sides.b, b: S.sides.a };
  S.pitch = { a: S.pitch.b, b: S.pitch.a };
  S.boxSide = otherSide(S.boxSide);
  S.swapped = !S.swapped;
}

/* Pestañas del box score: por equipo, o por parte de la entrada con el switch encendido. */
function boxTabs(S, order){
  const team = side => side === "a" ? S.away : S.home;
  return order.map((side, i) => team(side) ? `<button class="tab boxtab" data-boxside="${side}" aria-pressed="${S.boxSide === side}">${boxPair
      ? `<span class="bt-half">${i ? "Baja" : "Alta"}</span>${esc(team(side))} al bat<small>lanza ${esc(team(otherSide(side)))}</small>`
      : esc(team(side))}${boxTabStatus(side)}</button>` : "").join("");
}
const boxPairSwitch = () => `<label class="switch boxpair${boxPair ? " on" : ""}"><input type="checkbox" id="box-pair"${boxPair ? " checked" : ""}><span>Bateo y pitcheo rival juntos</span></label>`;

/* Barra fija de la captura: el marcador, lo que falta y el botón de publicar, siempre a la vista. */
function capBar(){
  const g = captureGame();
  if (!g) return "";
  const t = capTotals();
  const played = capState.st === "F", ta = played ? capState.away : g.a, tb = played ? capState.home : g.b;
  return `<div class="capbar" role="region" aria-label="Publicar el juego">
    <span class="cb-game">${crest(ta)}<b>${esc(ta)}</b><span class="cb-score num">${capState.st === "FF" ? (capState.ff === "a" ? "0–7" : "7–0")
      : capState.st === "NJ" || capState.st === "FF2" ? "—" : `<span id="cb-a">${t.a}</span>–<span id="cb-h">${t.h}</span>`}</span><b>${esc(tb)}</b>${crest(tb)}</span>
    <span class="cb-status" id="cb-status">${capStatusHtml()}</span>
    <span class="cb-acts"><button class="btn primary" id="save"${captureErrors().length ? " disabled" : ""}>${capState.st === "FF" ? "Publicar forfit" : capState.st === "FF2" ? "Publicar doble forfit" : capState.st === "NJ" ? "Marcar como no jugado" : "Guardar y publicar"}</button></span>
  </div>`;
}
/* En lugar de carreras y box score: qué va a pasar con un forfit o un juego no jugado. */
function capStatusPanel(g){
  const ff = capState.st === "FF", both = capState.st === "FF2";
  const winner = g[capState.ff === "a" ? "b" : "a"];
  const title = ff ? "Forfit" : both ? "Ninguno se presentó" : "Juego no jugado";
  return `<div class="panel">
    <div class="panel-h"><h2 class="display"><span class="stepn">2</span>${title}</h2><span class="meta">${ff || both ? "Sin carreras por entrada ni box score" : "Queda por reprogramar"}</span></div>
    <div class="capstatus">
      <i class="fa-solid ${ff ? "fa-flag" : both ? "fa-user-slash" : "fa-cloud-rain"}" aria-hidden="true"></i>
      <p>${ff
        ? `<b>${esc(g[capState.ff])} no se presentó.</b> El juego cuenta como jugado: ${esc(winner)} gana 7–0 ${g.po ? "en su serie de playoffs" : "en la tabla"}.`
        : both
          ? `<b>Ninguno de los dos equipos se presentó.</b> El juego cuenta como jugado y como derrota para ${esc(g.a)} y ${esc(g.b)}, cada uno con 7 carreras en contra.`
          : `<b>No se jugó: ${esc(capState.why)}.</b> No cuenta en la tabla${g.po ? " ni en la serie de playoffs" : ""} y queda en el calendario por reprogramar${g.po ? "; el juego vuelve a aparecer en Programar juegos" : ""}.`}</p>
    </div>
  </div>`;
}

/* Publicar un forfit o un juego no jugado: el resultado queda en el calendario, sin box score. */
function publishStatus(game){
  const base = CAL.find(x => x.id === game.id) || scheduled.find(x => x.id === game.id);
  if (!base) return;
  if (capState.st === "FF"){
    const ff = capState.ff;
    Object.assign(base, { st: "FF", ff, as: ff === "a" ? 0 : 7, bs: ff === "a" ? 7 : 0 });
    changedTeams = [game.a, game.b];
    currentCat = game.c;
    if (game.po) poCat = game.c;
    screen = game.po ? "playoffs" : "standing";
    render();
    window.scrollTo({ top: 0 });
    return toast(`Forfit registrado: ${game[ff]} no se presentó · ${game[ff === "a" ? "b" : "a"]} gana 7–0${game.po ? seriesToast(game) : ""}`);
  }
  if (capState.st === "FF2" && !game.po){
    Object.assign(base, { st: "FF2", as: null, bs: null });
    delete base.ff; delete base.why;
    changedTeams = [game.a, game.b];
    currentCat = game.c;
    screen = "standing";
    render();
    window.scrollTo({ top: 0 });
    return toast(`Doble forfit: ni ${game.a} ni ${game.b} se presentaron · derrota para los dos, con 7 carreras en contra`);
  }
  Object.assign(base, { st: "NJ", why: capState.why, as: null, bs: null });
  if (game.po) poCat = game.c;
  calWeek = game.w; calCat = "todas"; openGame = null;
  screen = game.po ? "playoffs" : "calendario";
  render();
  window.scrollTo({ top: 0 });
  toast(`${game.a} vs ${game.b}: no se jugó (${capState.why}) · queda por reprogramar${game.po ? " en Programar juegos" : ""}`);
}

function capStatusHtml(){
  const { errors, warnings } = captureChecks();
  if (errors.length) return `<button class="cb-issue err" data-jump="lineup-checks">${plural(errors.length, "error", "errores")} por corregir</button>`;
  if (warnings.length) return `<button class="cb-issue warn" data-jump="lineup-checks">Se puede publicar · ${plural(warnings.length, "aviso", "avisos")}</button>`;
  return `<span class="cb-issue ok">✓ Listo para publicar</span>`;
}
/* Estado de cada equipo en su pestaña: listo, avisos o errores. */
function boxTabStatus(side){
  const S = bx(), team = side === "a" ? S.away : S.home;
  if (!team) return "";
  const { errors, warnings } = captureChecks();
  const mine = m => m.startsWith(team) || m.includes(`(${team})`);

}

/* Actualiza totales, promedios y revisiones mientras se teclea, sin redibujar la tabla. */
function recalcCapture(){
  const t = capTotals();
  const ta = document.getElementById("tot-a"), th = document.getElementById("tot-h");
  if (ta) ta.textContent = t.a;
  if (th) th.textContent = t.h;

  const side = bx().boxSide;
  const slots = (bx().sides && bx().sides[side]) || [];
  slots.forEach((s, i) => s.entries.forEach((e, k) => {
    const cell = document.querySelector(`[data-luavg="${side}|${i}|${k}"]`);
    if (cell) cell.textContent = e.VB ? fmtPct((+e.H || 0) / e.VB) : ".000";
  }));
  const sum = k => slots.reduce((u, s) => u + s.entries.reduce((v, e) => v + (+e[k] || 0), 0), 0);
  STAT_KEYS.forEach(k => {
    const cell = document.querySelector(`[data-lusum="${side}|${k}"]`);
    if (cell) cell.textContent = sum(k);
  });
  const avg = document.querySelector(`[data-lusum="${side}|AVG"]`);
  if (avg) avg.textContent = sum("VB") ? fmtPct(sum("H") / sum("VB")) : ".000";

  const pside = pitchSideOf(side);
  const boxTeam = side === "a" ? bx().away : bx().home;
  const pitTeam = pside === "a" ? bx().away : bx().home;
  const prow = (bx().pitch && bx().pitch[pside]) || [];
  const reg = boxTeam ? lineupRegistration(boxTeam, slots, (bx().pitch && bx().pitch[side]) || []) : new Map();
  const preg = pitTeam ? lineupRegistration(pitTeam, (bx().sides && bx().sides[pside]) || [], prow) : new Map();
  const setCell = (sel, v) => { const cell = document.querySelector(sel); if (cell) cell.textContent = v; };
  prow.forEach((p, i) => {
    setCell(`[data-piera="${pside}|${i}"]`, fmtEra(p.CL, outsOf(p.EL)));
    const tag = document.querySelector(`[data-pitag="${pside}|${i}"]`);
    const tg = playerTag(pitTeam, preg, p.player);
    if (tag){ tag.className = tg.cls; tag.textContent = tg.txt; }
  });
  const pouts = prow.reduce((t, p) => t + (outsOf(p.EL) || 0), 0);
  const psum = k => prow.reduce((t, p) => t + (+p[k] || 0), 0);
  setCell(`[data-pisum="${pside}|EL"]`, fmtEL(pouts));
  PITCH_KEYS.forEach(k => setCell(`[data-pisum="${pside}|${k}"]`, psum(k)));
  setCell(`[data-pisum="${pside}|EFE"]`, fmtEra(psum("CL"), pouts));
  document.querySelectorAll("[data-regtag]").forEach(el => {
    const [s, i, k] = el.dataset.regtag.split("|");
    const e = s === side && slots[+i] && slots[+i].entries[+k];
    if (!e) return;
    const tg = playerTag(boxTeam, reg, e.player, e.kind === "reingreso");
    el.className = tg.cls;
    el.textContent = tg.txt;
  });
  const checks = document.getElementById("lineup-checks");
  if (checks) checks.innerHTML = lineupChecksHtml();
  const save = document.getElementById("save");
  if (save) save.disabled = !captureGame() || captureErrors().length > 0;
  const cbA = document.getElementById("cb-a"), cbH = document.getElementById("cb-h"), cbS = document.getElementById("cb-status");
  if (cbA) cbA.textContent = t.a;
  if (cbH) cbH.textContent = t.h;
  if (cbS) cbS.innerHTML = capStatusHtml();
  document.querySelectorAll("[data-boxstatus]").forEach(el => { el.outerHTML = boxTabStatus(el.dataset.boxstatus); });
  if (capMode === "corregir") refreshFix();
}

/* Publicar convierte el juego programado en resultado; la tabla y los resultados salen del calendario. */
function publish(){
  const t = capTotals();
  const game = captureGame();
  if (!game){ toast("Elige un juego programado para capturar"); return; }
  if (captureErrors().length){ toast("Revisa el orden al bat y el pitcheo antes de publicar"); return; }
  if (capState.st === "FF" || capState.st === "FF2" || capState.st === "NJ") return publishStatus(game);
  const boxResult = finalizeBox(capState);
  captured = { id: game.id, cat: game.c, a: capState.away, b: capState.home, as: t.a, bs: t.h, h: game.h,
               innings: { a: capState.a.slice(), h: capState.h.slice() },
               sides: JSON.parse(JSON.stringify(capState.sides)),
               pitch: JSON.parse(JSON.stringify(capState.pitch)) };
  const base = CAL.find(x => x.id === game.id) || scheduled.find(x => x.id === game.id);
  if (base) Object.assign(base, { st: "F", a: capState.away, b: capState.home, as: t.a, bs: t.h });
  SEASON_BOXES[game.id] = { sides: cloneBox(capState.sides), pitch: cloneBox(capState.pitch), innings: { a: capState.a.slice(), h: capState.h.slice() } };
  published = true;
  changedTeams = [game.a, game.b];
  currentCat = game.c;
  resCat = "todas";
  if (game.po) poCat = game.c;
  screen = game.po ? "playoffs" : "standing";
  render();
  window.scrollTo({ top:0 });
  toast(`Juego publicado en ${catName(game.c)} — ${capState.away} ${t.a}, ${capState.home} ${t.h}${game.po ? seriesToast(game) : ""}${boxToast(boxResult)}`);
}

}

/* Copia de los datos de la demo, para reiniciarla o volver a ella desde la liga vacía. */
const DEMO_SNAPSHOT = JSON.stringify({
  CAL, TEAMS, ROSTERS: ROSTER_DATA, MANAGERS, TEAM_DUES: TEAM_DUES_DATA,
  LOGOS: TEAM_LOGOS, LEAGUE, ERA: ERA_LEADERS, RIVALS: RIVAL_LEADERS,
});
const replaceObj = (target, source) => { for (const k of Object.keys(target)) delete target[k]; Object.assign(target, source); };
const replaceArr = (target, source) => { target.length = 0; target.push(...source); };

/* Carga los datos de la liga activa: la demo de Valle Alto o una liga vacía. */
function restoreLeagueData(){
  const demo = appMode === "demo" ? JSON.parse(DEMO_SNAPSHOT) : null;
  replaceArr(CATEGORIES, JSON.parse(CATEGORIES_DEFAULT));
  replaceArr(FIELDS, JSON.parse(FIELDS_DEFAULT));
  fieldForm = null;
  for (const k of Object.keys(TEAMS)) if (!CATEGORIES.some(c => c.id === k)) delete TEAMS[k];
  catForm = null;
  replaceArr(CAL, []);   // la demo arranca en la semana 1 sin juegos: el administrador programa desde cero

/* ---------------- historial del navegador ---------------- */
/* Cada pantalla tiene su dirección (#demo/standing, #demo/equipo/Tiburones, #demo/temporada-18/playoffs)
   y queda en el historial: atrás y adelante del navegador regresan a la sección anterior. */
const VIEW_IDS = ["inicio", "standing", "equipos", "calendario", "lideres", "juego", "equipo", "playoffs", "admin", "capturar", "lideresconfig", "estadisticas", "imprimir", "categorias", "campos", "reglamento", "rol",
  "inscripciones", "programar", "admequipos", "temporada", "nuevatemporada", "personalizar"];
let navRestoring = false;        // mientras se restaura una entrada del historial no se crean entradas nuevas
let lastHash = "";

function navHash(){
  if (route !== "app") return "#" + route;
  const parts = [appMode];
  if (viewingSeason) parts.push("temporada-" + viewingSeason);
  const sc = screen === "capturar" && capMode === "corregir" ? "corregir" : screen;
  if (sc !== "inicio" || parts.length > 1) parts.push(sc);
  if (screen === "equipo" && openTeam) parts.push(encodeURIComponent(openTeam));
  if (screen === "juego" && viewGameId) parts.push(encodeURIComponent(viewGameId));
  return "#" + parts.join("/");
}

function navState(){
  return { route, appMode, screen, capMode, openTeam, viewGameId, season: viewingSeason || null,
    calWeek, calCat, poCat, currentCat, teamCat, leadCat };
}

function stateFromHash(hash){
  const parts = String(hash || "").replace(/^#/, "").split("/").filter(Boolean)
    .map(p => { try { return decodeURIComponent(p); } catch (e) { return p; } });
  const r = parts.shift();
  if (r !== "demo" && r !== "liga") return { route: r === "master" ? "master" : "inicio" };
  const st = { route: "app", appMode: r, season: null, screen: "inicio", capMode: "nuevo" };
  if (parts[0] && parts[0].startsWith("temporada-")) st.season = parts.shift().slice("temporada-".length);
  const sc = parts.shift();
  if (sc === "corregir"){ st.screen = "capturar"; st.capMode = "corregir"; }
  else if (VIEW_IDS.includes(sc)) st.screen = sc;
  if (st.screen === "equipo") st.openTeam = parts[0] || null;
  if (st.screen === "juego") st.viewGameId = parts[0] || null;
  return st;
}

/* Después de cada render: una entrada nueva si cambió la sección; si no, se actualiza la actual. */
function pushNav(){
  if (navRestoring || !booted) return;
  const hash = navHash();
  try {
    if (hash === lastHash) history.replaceState(navState(), "", hash);
    else history.pushState(navState(), "", hash);
  } catch (e) { /* sin historial propio (vista incrustada): la navegación sigue en memoria */ }
  lastHash = hash;
}

function restoreNav(st){
  if (!st) return;
  navRestoring = true;
  try {
    if (st.route !== "app"){
      applyRoute(st.route);
    } else {
      if (route !== "app" || appMode !== st.appMode) applyRoute(st.appMode);
      if ((st.season || null) !== (viewingSeason || null)) viewSeason(st.season || "actual", true);
      screen = VIEW_IDS.includes(st.screen) ? st.screen : "inicio";
      capMode = st.capMode || "nuevo";
      if (screen === "capturar" && capMode === "corregir" && !fixForm) fixForm = defaultFixForm();
      if ("openTeam" in st) openTeam = st.openTeam;
      if ("viewGameId" in st) viewGameId = st.viewGameId;
      if ("calWeek" in st) calWeek = st.calWeek;
      if (st.calCat) calCat = st.calCat;
      if ("poCat" in st) poCat = st.poCat;
      if (st.currentCat) currentCat = st.currentCat;
      if (st.teamCat) teamCat = st.teamCat;
      if (st.leadCat) leadCat = st.leadCat;
      render();
      window.scrollTo({ top: 0 });
    }
  } finally {
    navRestoring = false;
  }
  lastHash = navHash();
  try { history.replaceState(navState(), "", lastHash); } catch (e) { /* sin historial propio */ }
}

function bootRoute(){
  let h = "";
  try { h = location.hash; } catch (e) { /* sin URL propia */ }
  restoreNav(stateFromHash(h));
}

];
function emptyContact(){ return { facebook: "", instagram: "", whatsapp: "", phone: "", address: "" }; }

function contactLink(k, v){
  const handle = s => s.replace(/^https?:\/\//i, "").replace(/^(www\.)?(facebook|instagram)\.com\//i, "").replace(/^@/, "").replace(/\/+$/, "");
  const digits = v.replace(/\D/g, "");
  const intl = digits.length === 10 ? "52" + digits : digits;   // números de 10 dígitos: México
  switch (k){
    case "facebook":  return { href: /^https?:\/\//i.test(v) ? v : `https://facebook.com/${handle(v)}`, text: handle(v) };
    case "instagram": return { href: `https://instagram.com/${handle(v)}`, text: "@" + handle(v) };
    case "whatsapp":  return { href: `https://wa.me/${intl}`, text: v };
    case "phone":     return { href: `tel:+${intl}`, text: v };
    default:          return { href: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v)}`, text: v };
  }
}

function footContact(){

/* Abre el PDF: en el artifact se ofrece como descarga; en el sitio se abre en otra pestaña. */
async function openRules(){
  const r = RULES_FILE;
  if (!r) return;
  const bin = atob(String(r.data).split(",")[1] || ""), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const blob = new Blob([bytes], { type: "application/pdf" });
  if (window.claude && typeof window.claude.use === "function"){
    const dl = await window.claude.use("downloads").catch(() => null);
    if (dl){
      try { await dl.save({ filename: r.name, data: blob }); }
      catch (err){
        if (err && err.code === "rate_limited") toast("Espera un momento e intenta otra vez", true);
        else if (err && err.code !== "declined") toast("No se pudo abrir el reglamento aquí", true);
      }
      return;
    }
  }
  const url = URL.createObjectURL(blob);
  const win = window.open(url, "_blank");
  if (!win){
    const a = document.createElement("a");
    a.href = url; a.download = r.name;
    document.body.appendChild(a); a.click(); a.remove();
  }
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/* ---------------- administrar equipos ---------------- */
const allTeamNames = () => [...Object.values(TEAMS).flat(), ...withdrawn.map(w => w.team)];
const teamHasGames = team => calGames().some(g => g.a === team || g.b === team);

function openTeamForm(team){
  if (!team){
    teamForm = { original: null, name: "", cat: teamAdminCat, mgrKind: "otra", mgrPlayer: "", mgrName: "", roster: [], logo: null, confirmBaja: false };
    return;
  }
  const roster = (ROSTERS[team] || []).slice();
  const mgr = MANAGERS[team] || "";
  const isPlayer = roster.includes(mgr);
  teamForm = { original: team, name: team, cat: categoryOf(team), mgrKind: isPlayer ? "jugador" : "otra",
    mgrPlayer: isPlayer ? mgr : "", mgrName: isPlayer ? "" : mgr, roster, logo: TEAM_LOGOS[team] || null, confirmBaja: false };
}

function teamChecks(f){
  const errors = [], warnings = [];
  const name = f.name.trim();
  if (!name) errors.push("Escribe el nombre del equipo.");
  else if (name.toLowerCase() !== (f.original || "").toLowerCase() && allTeamNames().some(t => t.toLowerCase() === name.toLowerCase()))
    errors.push(`Ya existe un equipo llamado ${name}.`);
  const manager = f.mgrKind === "jugador" ? f.mgrPlayer : f.mgrName.trim();
  if (!manager) errors.push(f.mgrKind === "jugador" ? "Elige qué jugador es el manager." : "Escribe el nombre del manager.");
  const dup = f.roster.filter((p, i) => f.roster.findIndex(x => x.toLowerCase() === p.toLowerCase()) !== i);
  if (dup.length) errors.push(`Jugador repetido: ${[...new Set(dup)].join(", ")}.`);
  if (f.roster.length > ROSTER_MAX) errors.push(`El máximo es de ${ROSTER_MAX} jugadores por equipo (lleva ${f.roster.length}).`);
  if (f.roster.length < MIN_BATTERS) warnings.push(`Con ${plural(f.roster.length, "jugador", "jugadores")} no alcanza para un orden al bat de ${MIN_BATTERS}.`);
  const elsewhere = f.roster
    .map(p => [p, Object.keys(ROSTERS).find(t => t !== f.original && (ROSTERS[t] || []).includes(p))])
    .filter(([, t]) => t);
  if (elsewhere.length) warnings.push(`También aparecen en otro equipo: ${elsewhere.map(([p, t]) => `${p} (${t})`).join(", ")}.`);
  if (f.original && name && name !== f.original && teamHasGames(f.original)) warnings.push("El nombre nuevo también se aplica a su tabla, calendario y resultados.");
  return { errors, warnings };
}
function teamChecksHtml(f){
  const { errors, warnings } = teamChecks(f);
  return [...errors.map(e => `<li class="err">${esc(e)}</li>`), ...warnings.map(w => `<li class="warn">${esc(w)}</li>`)].join("")
    || `<li class="ok">Listo para guardar.</li>`;
}
function refreshTeamChecks(){
  const box = document.getElementById("team-checks");
  if (box) box.innerHTML = teamChecksHtml(teamForm);
  const save = document.querySelector("[data-teamsave]");
  if (save) save.disabled = teamChecks(teamForm).errors.length > 0;
}

/* Cambiar el nombre de un equipo lo cambia en todo lo que lo menciona. */
function renameTeam(old, neu){
  for (const c of Object.keys(TEAMS)) TEAMS[c] = TEAMS[c].map(t => t === old ? neu : t);
  const swap = g => { if (g.a === old) g.a = neu; if (g.b === old) g.b = neu; };
  CAL.forEach(swap);
  scheduled.forEach(swap);
  corrections.forEach(swap);
  if (captured) swap(captured);
  for (const obj of [ROSTERS, MANAGERS, TEAM_DUES, TEAM_DUES_DATA, TEAM_LOGOS, SUSPENSIONS])
    if (old in obj){ obj[neu] = obj[old]; delete obj[old]; }
  [ERA_LEADERS, ...Object.values(RIVAL_LEADERS)].flat().forEach(r => { if (r.t === old) r.t = neu; });
  if (capState.away === old) capState.away = neu;
  if (capState.home === old) capState.home = neu;
  for (const k of ["a", "b"]) if (schedForm[k] === old) schedForm[k] = neu;
  if (STATS_TEAM === old) STATS_TEAM = neu;
  if (openTeam === old) openTeam = neu;
  changedTeams = changedTeams.map(t => t === old ? neu : t);
}

function saveTeam(){
  const f = teamForm;
  if (teamChecks(f).errors.length) return;
  const name = f.name.trim().replace(/\s+/g, " ");
  const manager = f.mgrKind === "jugador" ? f.mgrPlayer : f.mgrName.trim();
  const isNew = !f.original;
  if (isNew){
    TEAMS[f.cat].push(name);
    TEAM_DUES[name] = null;
  } else {
    if (name !== f.original) renameTeam(f.original, name);
    const from = categoryOf(name);
    if (from && from !== f.cat && !teamHasGames(name)){
      TEAMS[from] = TEAMS[from].filter(t => t !== name);
      TEAMS[f.cat].push(name);
    }
  }
  if (f.roster.length) ROSTERS[name] = f.roster.slice(); else delete ROSTERS[name];
  MANAGERS[name] = manager;
  if (f.logo) TEAM_LOGOS[name] = f.logo; else delete TEAM_LOGOS[name];
  CATEGORIES.forEach(c => { c.teams = TEAMS[c.id].length; c.active = c.teams > 0; });
  teamAdminCat = categoryOf(name) || f.cat;
  openTeamForm(name);
  render();
  toast(isNew ? `${name} dado de alta en ${catName(teamAdminCat)}` : `${name}: cambios guardados`);
}

/* Regla de la liga: el equipo que se da de baja sale de la tabla y sus rivales conservan
   el resultado y la información de esos juegos. Sus juegos por jugar se quitan. */
function withdrawTeam(team){
  const cat = categoryOf(team);
  if (!cat) return;
  TEAMS[cat] = TEAMS[cat].filter(t => t !== team);
  let removed = 0;
  for (let i = CAL.length - 1; i >= 0; i--){
    const g = CAL[i];
    if (g.a !== team && g.b !== team) continue;
    if (g.st === "P"){ CAL.splice(i, 1); removed++; }
    else g.baja = g.a === team ? "a" : "b";
  }
  const before = scheduled.length;
  scheduled = scheduled.filter(g => g.a !== team && g.b !== team);
  removed += before - scheduled.length;
  withdrawn.push({ team, cat, at: TODAY });
  CATEGORIES.forEach(c => { c.teams = TEAMS[c.id].length; c.active = c.teams > 0; });
  if (capState.away === team || capState.home === team) setCaptureGame(null);
  if (openTeam === team) openTeam = null;
  teamForm = null;
  render();
  toast(`${team} dado de baja · sus rivales conservan los resultados${removed ? ` · ${plural(removed, "juego por jugar quitado", "juegos por jugar quitados")}` : ""}`);
}

function fieldChecks(f){
  const errors = [], warnings = [];
  const name = normName(f.name);
  if (!name) errors.push("Escribe el nombre del campo.");
  else if (FIELDS.some(x => x.name !== f.original && nameKey(x.name) === nameKey(name))) errors.push(`Ya existe ${name}.`);
  if (f.original && name && name !== f.original){
    const cats = fieldCats(f.original);
    if (cats.length) warnings.push(`${listJoin(cats.map(c => c.name))} y sus juegos pasan a ${name}.`);
  }
  for (const id of f.cats){
    const c = CATEGORIES.find(x => x.id === id);
    if (!c || (f.original && nameKey(c.field) === nameKey(f.original))) continue;
    const games = calGames().filter(g => g.c === id).length;
    warnings.push(`${c.name} deja el ${c.field}${games ? ` con sus ${plural(games, "juego", "juegos")}` : ""}.`);

    if (p && !f.cats.includes(p.id)) warnings.push(`${c.name} deja de compartir campo con ${p.name}.`);
  }
  return { errors, warnings };
}

  const { errors, warnings } = fieldChecks(f);

}

const HOURS = Array.from({ length: 17 }, (_, i) => `${i + 6}:00`);   // de 6:00 AM a 10:00 PM
const DAY_OPTS = ["Entre semana", "Sábados y domingos"];
const hourKey = h => { const [a, b] = String(h).split(":"); return +a * 60 + (+b || 0); };
let catForm = null;              // categoría que se está creando o editando

const catHasData = id => (TEAMS[id] || []).length > 0 || calGames().some(g => g.c === id)
  || SEASON_ARCHIVE.some(s => s.cat === id) || withdrawn.some(w => w.cat === id);

    : { original: null, name: "", field: (FIELDS[0] || {}).name || "", days: DAY_OPTS[0], times: ["19:00", "21:00"], shares: "", season: "1", confirmDel: false };
}

function catChecks(f){
  const errors = [], warnings = [];
  const name = normName(f.name), field = normName(f.field);
  if (!name) errors.push("Escribe el nombre de la categoría.");
  else if (CATEGORIES.some(c => c.id !== f.original && nameKey(c.name) === nameKey(name))) errors.push(`Ya existe la categoría ${name}.`);
  if (!field) errors.push("Elige el campo donde juega.");
  else if (!fieldInfo(field)) errors.push(`${field} ya no existe: elige otro campo.`);
  if (!f.times.length) errors.push("Elige al menos un horario.");
  if (!f.original && !normName(f.season)) errors.push("Escribe la temporada con que arranca.");
  if (f.shares){
    const p = CATEGORIES.find(c => c.id === f.shares);
    if (p && field && nameKey(p.field) !== nameKey(field)) errors.push(`Para compartir campo con ${p.name}, las dos tienen que jugar en el mismo campo (${p.name} juega en ${p.field}).`);
    if (p && p.shares && p.shares !== f.original) warnings.push(`${p.name} deja de compartir campo con ${catName(p.shares)}.`);
  }
  const c = f.original ? CATEGORIES.find(x => x.id === f.original) : null;
  if (c){
    const games = calGames().filter(g => g.c === c.id);
    const pending = games.filter(g => g.st === "P");
    if (field && nameKey(field) !== nameKey(c.field) && games.length) warnings.push(`Sus ${plural(games.length, "juego", "juegos")} del calendario pasan al ${field}.`);
    if (pending.some(g => !f.times.includes(g.h)) || (f.days !== c.days && pending.length))
      warnings.push(`${plural(pending.length, "juego programado se queda", "juegos programados se quedan")} con su día y hora actuales.`);
  }
  return { errors, warnings };
}
const catChecksHtml = f => {
  const { errors, warnings } = catChecks(f);
  return [...errors.map(e => `<li class="err">${esc(e)}</li>`), ...warnings.map(w => `<li class="warn">${esc(w)}</li>`)].join("") || `<li class="ok">Listo para guardar.</li>`;
};

function saveCategory(){
  const f = catForm;
  if (!f || catChecks(f).errors.length) return;
  const name = normName(f.name), field = normName(f.field);
  const times = f.times.slice().sort((a, b) => hourKey(a) - hourKey(b));
  const byId = id => CATEGORIES.find(x => x.id === id);
  let c;
  if (!f.original){
    const base = slugOf(name) || "categoria";
    let id = base, n = 2;
    while (byId(id) || TEAMS[id]) id = `${base}-${n++}`;
    c = { id, name, field, days: f.days, times, teams: 0, active: false };
    CATEGORIES.push(c);
    TEAMS[id] = [];
    SEASON.regular[id] = SEASON_DEFAULT.games;
    SEASON.playoffs[id] = SEASON_DEFAULT.playoffs;
    CAT_SEASONS[id] = { season: normName(f.season), year: LEAGUE.year };
  } else {
    c = byId(f.original);
    Object.assign(c, { name, field, days: f.days, times });
  }
  const unshare = x => {
    if (!x || !x.shares) return;
    const p = byId(x.shares);
    if (p && p.shares === x.id) delete p.shares;
    delete x.shares;
  };
  if ((c.shares || "") !== f.shares){
    unshare(c);
    if (f.shares){ const p = byId(f.shares); unshare(p); c.shares = p.id; p.shares = c.id; }
  }
  seasonDraft = null;
  openCatForm(c.id);
  render();
  toast(f.original ? `${name}: cambios guardados` : `Categoría ${name} creada · ${seasonLabel(c.id)}`);
}

  if (!c || catHasData(id) || CATEGORIES.length < 2) return;
  if (c.shares){ const p = CATEGORIES.find(x => x.id === c.shares); if (p && p.shares === id) delete p.shares; }
  CATEGORIES.splice(CATEGORIES.indexOf(c), 1);
  delete TEAMS[id]; delete SEASON.regular[id]; delete SEASON.playoffs[id]; delete CAT_SEASONS[id]; delete PLAYOFFS.cats[id];

/* ---------------- confirmaciones ---------------- */
let confirmAction = null;
function askConfirm({ title, body, ok = "Quitar", onConfirm }){
  const dialog = document.getElementById("confirm-dialog");
  document.getElementById("confirm-title").textContent = title;
  document.getElementById("confirm-body").textContent = body;
  document.getElementById("confirm-ok").textContent = ok;
  if (typeof dialog.showModal !== "function"){
    if (window.confirm(`${title}\n\n${body}`)) onConfirm();
    return;
  }
  confirmAction = onConfirm;
  dialog.returnValue = "";
  dialog.showModal();
  document.getElementById("confirm-ok").focus();
}
document.getElementById("confirm-dialog").addEventListener("close", e => {
  const action = confirmAction;
  confirmAction = null;
  if (e.target.returnValue === "ok" && action) action();
});

    if (normName(f.contact[k]) && (digits.length < 8 || digits.length > 15)) errors.push(`Revisa el número de ${CONTACT_FIELDS.find(x => x.k === k).label}.`);
  }
  const changed = normName(f.name) !== LEAGUE.name || normName(f.sport) !== (LEAGUE.sport || "")
    || f.logo !== leagueLogo() || f.accent !== accentId
    || CONTACT_FIELDS.some(x => normName(f.contact[x.k]) !== (LEAGUE.contact[x.k] || ""));
  const hint = errors.length ? errors[0] : changed ? "Hay cambios sin guardar: se aplican a todo el sitio al guardar." : "Sin cambios por guardar.";

}

/* Rol de juego de la semana como imagen: Avanzados y Novatos comparten campo e imagen; las demás
   categorías van en la suya. Día, hora y los dos equipos con su logo. */
let rolWeek = null;
const rolWeekOf = () => rolWeek ?? TODAY_WEEK;
const rolCache = new Map();      // grupo -> { sig, url }
let rolToken = 0;

function rolGroups(w){
  const games = calGames().filter(g => g.w === w && g.st !== "NJ");
  const groups = [], seen = new Set();
  for (const c of CATEGORIES){
    if (seen.has(c.id)) continue;
    const ids = [c.id, ...(c.shares && !seen.has(c.shares) ? [c.shares] : [])];
    ids.forEach(id => seen.add(id));
    const cats = CATEGORIES.filter(x => ids.includes(x.id));
    const gs = games.filter(g => ids.includes(g.c)).sort((x, y) => (x.d + x.h).localeCompare(y.d + y.h));
    if (gs.length) groups.push({ key: ids.join("-"), cats, games: gs, title: `${listJoin(cats.map(x => x.name))} · ${cats[0].field}` });
  }
  return groups;
}
const rolSig = (gr, w) => JSON.stringify([w, accentId, leagueFull(), leagueLogo().length,
  gr.games.map(g => [g.id, g.d, g.h, g.a, g.b, (TEAM_LOGOS[g.a] || "").length, (TEAM_LOGOS[g.b] || "").length])]);
function rolCached(gr, w){
  const c = rolCache.get(gr.key);
  return c && c.sig === rolSig(gr, w) ? c.url : null;
}

const loadImg = src => new Promise(res => {
  if (!src) return res(null);
  const im = new Image();
  im.onload = () => res(im);
  im.onerror = () => res(null);
  im.src = src;
});
function roundRectPath(x, px, py, w, h, r){
  x.beginPath();
  x.moveTo(px + r, py);
  x.arcTo(px + w, py, px + w, py + h, r);
  x.arcTo(px + w, py + h, px, py + h, r);
  x.arcTo(px, py + h, px, py, r);
  x.arcTo(px, py, px + w, py, r);
  x.closePath();
}
function drawContain(x, img, px, py, w, h){
  const s = Math.min(w / img.width, h / img.height), iw = img.width * s, ih = img.height * s;
  x.drawImage(img, px + (w - iw) / 2, py + (h - ih) / 2, iw, ih);
}
function drawCover(x, img, px, py, w, h){
  const s = Math.max(w / img.width, h / img.height), iw = img.width * s, ih = img.height * s;
  x.drawImage(img, px + (w - iw) / 2, py + (h - ih) / 2, iw, ih);
}
function fitText(x, text, px, py, max, min){
  let t = String(text);
  const m = x.font.match(/(\d+(?:\.\d+)?)px/);
  if (min && m){
    let size = +m[1];
    while (size > min && x.measureText(t).width > max){
      size -= 1;
      x.font = x.font.replace(/\d+(?:\.\d+)?px/, size + "px");
    }
  }
  if (x.measureText(t).width > max){
    while (t.length > 1 && x.measureText(t + "…").width > max) t = t.slice(0, -1);
    t = t.trimEnd() + "…";
  }
  x.fillText(t, px, py);
}
async function drawCrest(x, team, px, py, s){
  const img = await loadImg(TEAM_LOGOS[team]);
  x.save();
  x.beginPath();
  x.arc(px + s / 2, py + s / 2, s / 2, 0, Math.PI * 2);
  x.closePath();
  if (img){
    x.restore();
    drawContain(x, img, px, py, s, s);
    return;
  }
  x.fillStyle = `hsl(${crestHue(team)} 38% 34%)`; x.fill();
  x.restore();
  x.save();
  x.fillStyle = "#fff"; x.textAlign = "center";
  x.font = `900 ${Math.round(s * .34)}px "Archivo", Arial, sans-serif`;
  x.fillText(initials(team), px + s / 2, py + s / 2 + s * .12);
  x.restore();
}

async function rolImage(gr, w){
  try { await Promise.all(['900 58px "Archivo"', '800 32px "Archivo"', '700 28px "Instrument Sans"', '600 38px "IBM Plex Mono"', '800 24px "Poppins"'].map(f => document.fonts.load(f))); }
  catch (e) { /* sin fuentes cargadas: se dibuja con las del sistema */ }
  const a = ACCENTS.find(x => x.id === accentId) || ACCENTS[0];
  const W = 1080, PAD = 64, ROW = 128, DAYH = 80, HEAD = 336, FOOT = 110, GAP = 18;
  const days = [...new Set(gr.games.map(g => g.d))];
  const PO_BAND = 34;              // espacio para la etiqueta de playoffs en la tarjeta del juego
  const rowH = g => g.po ? ROW + PO_BAND : ROW;
  const H = HEAD + days.length * (DAYH + GAP) + gr.games.reduce((t, g) => t + rowH(g), 0) + FOOT;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d");

  x.fillStyle = "#0C0D15"; x.fillRect(0, 0, W, H);
  const glow = x.createRadialGradient(W * .86, 0, 40, W * .86, 0, 760);
  glow.addColorStop(0, `rgba(${a.rgb},.55)`); glow.addColorStop(1, "rgba(0,0,0,0)");
  x.fillStyle = glow; x.fillRect(0, 0, W, 760);
  x.fillStyle = a.accent; x.fillRect(0, 0, W, 10);

  const LS = 140, LX = PAD, LY = 62;
  const logo = await loadImg(leagueLogo());
  x.save();
  x.beginPath(); x.arc(LX + LS / 2, LY + LS / 2, LS / 2, 0, Math.PI * 2); x.closePath();
  x.fillStyle = leagueLogo() === LOGO ? "#11121c" : "#fff"; x.fill();   // el logo de STRIKEONE es oscuro: sin orilla blanca
  if (logo){ x.clip(); drawCover(x, logo, LX, LY, LS, LS); }
  x.restore();

  const TX = LX + LS + 36;
  x.textBaseline = "alphabetic"; x.textAlign = "left";
  x.fillStyle = a.soft; x.font = '700 24px "Instrument Sans", Arial, sans-serif';
  x.fillText(`ROL DE JUEGO · SEMANA ${w}`, TX, LY + 40);
  x.fillStyle = "#fff"; x.font = '900 56px "Archivo", Arial, sans-serif';
  fitText(x, leagueFull().toUpperCase(), TX, LY + 102, W - TX - PAD, 34);
  x.fillStyle = "#C9CCDA"; x.font = '500 28px "Instrument Sans", Arial, sans-serif';
  x.fillText(weekRange(w), TX, LY + 144);

  x.fillStyle = a.accent; roundRectPath(x, PAD, 250, W - PAD * 2, 60, 14); x.fill();
  x.fillStyle = a.on; x.font = '800 30px "Archivo", Arial, sans-serif';
  fitText(x, gr.title.toUpperCase(), PAD + 26, 291, W - PAD * 2 - 52, 20);

  let y = HEAD;
  const left = PAD + 196, right = W - PAD - 26, mid = (left + right) / 2, CS = 76, NAME = 236;
  for (const d of days){
    x.textAlign = "left"; x.fillStyle = a.inkDark; x.font = '800 32px "Archivo", Arial, sans-serif';
    x.fillText(`${DIAS[parseD(d).getUTCDay()]} ${fmtDay(d)}`.toUpperCase(), PAD, y + 48);
    x.fillStyle = "#2A2925"; x.fillRect(PAD, y + 64, W - PAD * 2, 2);
    y += DAYH;
    for (const g of gr.games.filter(z => z.d === d)){
      x.fillStyle = "#1B1D2B"; roundRectPath(x, PAD, y, W - PAD * 2, rowH(g) - 16, 18); x.fill();
      let top = y;
      if (g.po){
        const label = `PLAYOFFS · ${g.po.round.toUpperCase()} · JUEGO ${g.po.n}`;
        x.font = '800 19px "Archivo", Arial, sans-serif'; x.textAlign = "left";
        const tw = x.measureText(label).width + 30;
        x.fillStyle = a.accent; roundRectPath(x, PAD + 22, y + 16, tw, 32, 16); x.fill();
        x.fillStyle = a.on; x.fillText(label, PAD + 37, y + 39);
        top = y + PO_BAND;
      }
      const cy = top + (ROW - 16) / 2;
      x.textAlign = "left"; x.fillStyle = "#fff"; x.font = '600 31px "IBM Plex Mono", monospace';
      x.fillText(fmtHour(g.h), PAD + 26, gr.cats.length > 1 ? cy + 2 : cy + 13);
      if (gr.cats.length > 1){
        x.fillStyle = a.soft; x.font = '700 17px "Instrument Sans", Arial, sans-serif';
        x.fillText(catName(g.c).toUpperCase(), PAD + 28, cy + 32);
      }
      await drawCrest(x, g.a, left, cy - CS / 2, CS);
      await drawCrest(x, g.b, right - CS, cy - CS / 2, CS);
      const teamFont = '700 27px "Instrument Sans", Arial, sans-serif';
      x.fillStyle = "#fff";
      x.font = teamFont; x.textAlign = "left"; fitText(x, g.a, left + CS + 16, cy + 10, NAME, 19);
      x.font = teamFont; x.textAlign = "right"; fitText(x, g.b, right - CS - 16, cy + 10, NAME, 19);
      x.textAlign = "center"; x.fillStyle = a.inkDark; x.font = '900 26px "Archivo", Arial, sans-serif';
      x.fillText("VS", mid, cy + 9);
      y += rowH(g);
    }
    y += GAP;
  }

  x.fillStyle = "#262939"; x.fillRect(PAD, H - 92, W - PAD * 2, 2);
  x.fillStyle = "#8A8EA3"; x.font = '500 22px "Instrument Sans", Arial, sans-serif';
  x.textAlign = "left"; x.fillText(leagueFull(), PAD, H - 46);
  { const lead = x.font; x.textAlign = "right"; x.font = '800 24px "Poppins", Arial, sans-serif'; x.fillText("STRIKEONE", W - PAD, H - 46);
    const bw = x.measureText("STRIKEONE").width; x.font = lead; x.fillText("Powered by ", W - PAD - bw - 4, H - 46); }
  return cv;
}

async function drawRolImages(){
  const w = rolWeekOf(), token = ++rolToken;
  for (const gr of rolGroups(w)){
    if (rolCached(gr, w)) continue;
    const cv = await rolImage(gr, w);
    if (token !== rolToken) return;
    const url = cv.toDataURL("image/png");
    rolCache.set(gr.key, { sig: rolSig(gr, w), url });
    const box = document.querySelector(`[data-rolimg="${gr.key}"]`);
    if (box) box.innerHTML = `<img src="${url}" alt="Rol de juego · ${esc(gr.title)} · semana ${w}">`;
  }
}

async function downloadRol(key){
  const w = rolWeekOf(), gr = rolGroups(w).find(x => x.key === key);
  if (!gr) return;
  let url = rolCached(gr, w);
  if (!url){
    url = (await rolImage(gr, w)).toDataURL("image/png");
    rolCache.set(gr.key, { sig: rolSig(gr, w), url });
  }
  const bin = atob(url.split(",")[1]), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return saveFile(`rol-semana-${w}-${slugOf(gr.cats.map(c => c.name).join(" "))}.png`, new Blob([bytes], { type: "image/png" }));
}

/* Descargar un archivo generado: en claude.ai con el permiso de descargas; fuera, con un enlace. */
async function saveFile(filename, data){
  if (window.claude && typeof window.claude.use === "function"){
    let dl = null;
    try { dl = await window.claude.use("downloads"); } catch (e) { dl = null; }
    if (dl){
      try { await dl.save({ filename, data }); }
      catch (e){
        const code = e && e.code;
        if (code === "rate_limited") toast("Espera un momento y vuelve a intentar");
        else if (code === "rejected_extension" || code === "extension_not_enabled") toast("Este formato no se puede descargar aquí");
        else if (code !== "declined") toast("La descarga no está disponible en esta vista");
      }
      return;
    }
  }
  const blob = data instanceof Blob ? data : new Blob([data], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

        <div class="statpick">${STAT_KEYS.map(k => opt("bat", k, STAT_LABEL[k] || k, STAT_NAMES[k])).join("")}</div>
      </section>
      <section class="panel">
        <div class="panel-h"><h2 class="display"><i class="fa-solid fa-baseball" aria-hidden="true"></i> Pitcheo</h2>
          <label class="switch${f.pitch ? " on" : ""}"><input type="checkbox" id="stat-pitch"${f.pitch ? " checked" : ""}><span>Capturar pitcheo</span></label></div>
        ${f.pitch
          ? `<div class="statpick">${PIT_OPTS.map(([k, ab, name]) => opt("pit", k, ab, name)).join("")}</div>
             <p class="statnote">EFE ${f.pit.EL && f.pit.CL ? "se calcula con EL y CL" : "necesita EL y CL"}</p>`
          : `<p class="statnote">Sin pitcheo en captura, juegos, equipos y líderes.</p>`}
      </section>
      <section class="panel"><div class="savebar">
        <span class="hint">${changed ? "Hay cambios sin guardar" : "Sin cambios por guardar"}</span>
        <button type="button" class="btn ghost" data-statreset${changed ? "" : " disabled"}>Descartar</button>
        <button type="button" class="btn primary" id="stat-save"${changed ? "" : " disabled"}>Guardar</button>
      </div></section>
    </div>
  </div>`;
}

/* Ajustes de Líderes: qué estadísticas se publican. */
function leadFormState(f){
  const changed = f.show.length !== leaderShow.length || f.show.some(k => !leaderShow.includes(k));
  const n = f.show.filter(leaderAvailable).length;
  const hint = n ? plural(n, "estadística", "estadísticas") + (changed ? " · sin guardar" : "") : "Elige al menos una estadística";
  return { changed, ok: n > 0, hint };
}

function viewLideresConfig(){
  if (!leadForm) leadForm = { show: leaderShow.slice() };
  const f = leadForm, st = leadFormState(f);
  const group = (kind, label, icon) => {
    const stats = LEADER_CATALOG.filter(s => s.kind === kind);
    const on = stats.filter(s => f.show.includes(s.key)).length;
    return `<section class="panel">
      <div class="panel-h"><h2 class="display"><i class="fa-solid ${icon}" aria-hidden="true"></i> ${label}</h2>
        <button type="button" class="btn ghost" data-lsall="${kind}">${on === stats.length ? "Quitar todas" : "Marcar todas"}</button></div>
      <div class="statpick" role="group" aria-label="${label}">
        ${stats.map(s => `<button type="button" class="statopt" role="checkbox" aria-checked="${f.show.includes(s.key) && leaderAvailable(s.key)}" data-lstoggle="${s.key}"${leaderAvailable(s.key) ? "" : " disabled"}>
          <span class="ab">${s.unit}</span><span class="nm">${s.title}${leaderAvailable(s.key) ? "" : "<small>No se captura</small>"}</span><span class="ck"><i class="fa-solid fa-check" aria-hidden="true"></i></span>
        </button>`).join("")}
      </div>
    </section>`;
  };
  return `<div class="screen">
    <div class="page-head">
      <div>
        <p class="eyebrow">${esc(leagueFull())} · Administrador</p>
        <h1>Líderes</h1>
      </div>
      <button type="button" class="btn ghost" data-go="lideres"><i class="fa-solid fa-medal" aria-hidden="true"></i> Ver Líderes</button>
    </div>
    <div class="stack">
      ${group("bat", "Bateo", "fa-baseball-bat-ball")}
      ${group("pit", "Pitcheo", "fa-baseball")}
      <section class="panel"><div class="savebar">
        <span class="hint">${esc(st.hint)}</span>
        <button type="button" class="btn ghost" data-lsreset${st.changed ? "" : " disabled"}>Descartar</button>
        <button type="button" class="btn primary" id="ls-save"${st.changed && st.ok ? "" : " disabled"}>Guardar</button>
      </div></section>
    </div>
  </div>`;
}

/* Mientras se escribe el nombre: actualiza la vista previa y el botón sin redibujar los campos. */
function refreshBrand(){
  const f = brandForm;
  if (!f) return;
  const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
  set("bp-name", normName(f.name) || "Nombre de la liga");
  set("bp-sub", [normName(f.sport), LEAGUE.year].filter(Boolean).join(" · "));
  set("bp-full", [normName(f.name), normName(f.sport)].filter(Boolean).join(" ") || "Nombre de la liga");
  const st = brandState(f);
  set("bf-hint", st.hint);
  const save = document.getElementById("bf-save"), reset = document.querySelector("[data-bfreset]");
  if (save) save.disabled = !st.changed || st.errors.length > 0;
  if (reset) reset.disabled = !st.changed;
}

function saveBrand(){
  const f = brandForm;
  if (!f || brandState(f).errors.length) return;
  LEAGUE.name = normName(f.name);
  LEAGUE.sport = normName(f.sport);
  LEAGUE.logo = f.logo || "";
  LEAGUE.contact = Object.fromEntries(CONTACT_FIELDS.map(x => [x.k, normName(f.contact[x.k])]));
  applyAccent(f.accent);
  brandForm = null;
  render();
  toast(`Personalización guardada: ${leagueFull()} ya se ve así en todo el sitio`);
}

function initTheme(){
  let saved = null;
  try { saved = localStorage.getItem("strikeone-theme"); } catch (e) { /* sin storage */ }
  applyTheme(saved === "dark" ? "dark" : "light");

let toastTimer;
function toast(msg, warn){
  const el = document.getElementById("toast");
  el.innerHTML = `<b>${warn ? "!" : "✓"}</b> ${esc(msg)}`;
  el.classList.toggle("warn", !!warn);
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 3400);
}

/* ---------------- eventos ---------------- */
document.addEventListener("click", e => {
  const soScroll = e.target.closest("[data-soscroll]");

    const target = document.getElementById("so-" + soScroll.dataset.soscroll);

  }

  const poCatBtn = e.target.closest("[data-pocat]");

      title: `¿Cerrar la temporada regular de ${c.name}?`,

      ok: "Cerrar y publicar playoffs",
