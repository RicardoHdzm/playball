/* Temporada 18 de ejemplo para la demo, con su rol completo: 10 semanas y exactamente 10 juegos por
   equipo (todos contra todos, sin repetir rival). Los equipos de hoy más algunos que ya no juegan:
   BNG Agroproductos se dio de baja después; Rayos del Valle, Gacelas y Las Reinas son de ejemplo.
   La tabla final sale de esos juegos. */
function demoArchive(){
  const hash = s => [...s].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) >>> 0, 17);
  let seed = 180726;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const week1 = "2025-03-03";
  const dayOf = (w, dow) => new Date(parseD(week1).getTime() + ((w - 1) * 7 + dow) * DAY_MS).toISOString().slice(0, 10);
  const groups = {
    novatos: [...TEAMS.avanzados, ...TEAMS.novatos, "BNG Agroproductos", "Rayos del Valle"],
    femenil: [...TEAMS.femenil.slice(0, 8), "Gacelas", "Las Reinas"],
  };
  const slots = [];
  for (let dow = 0; dow < 5; dow++) for (const h of ["19:00", "21:00"]) slots.push([dow, h]);
  const games = [];
  let n = 0;
  for (const [cat, names] of Object.entries(groups)){
    const strength = Object.fromEntries(names.map(t => [t, 3 + hash(t + "·fuerza") % 7]));
    const list = names.slice();                       // número par de equipos
    for (let r = 0; r < 10; r++){
      const pairs = [];
      for (let i = 0; i < list.length / 2; i++) pairs.push([list[i], list[list.length - 1 - i]]);
      list.splice(1, 0, list.pop());                  // método del círculo: el primero queda fijo
      pairs.forEach(([x, y], i) => {
        const [dow, h] = slots[i % slots.length];
        const [a, b] = (r + i) % 2 ? [x, y] : [y, x];
        const w = r + 1;
        const g = { w, d: dayOf(w, dow), h, c: cat, a, b, id: `t18-${++n}` };
        if (rnd() < 0.03){
          const ff = rnd() < 0.5 ? "a" : "b";
          Object.assign(g, { st: "FF", ff, as: ff === "a" ? 0 : 7, bs: ff === "a" ? 7 : 0 });
        } else {
          let as = Math.round(strength[a] * (0.6 + rnd()) + rnd() * 4);
          let bs = Math.round(strength[b] * (0.6 + rnd()) + rnd() * 4);
          if (as === bs){ if (rnd() < 0.5) as++; else bs++; }
          Object.assign(g, { st: "F", as, bs });
        }
        games.push(g);
      });
    }
  }
  const categories = {};
  for (const [cat, names] of Object.entries(groups)){
    const rows = Object.fromEntries(names.map(t => [t, { team: t, JG: 0, JE: 0, JP: 0, CF: 0, CC: 0 }]));
    for (const g of games.filter(x => x.c === cat)){
      const ws = g.as > g.bs ? "a" : g.bs > g.as ? "b" : null;
      for (const s of ["a", "b"]){
        const r = rows[g[s]], o = s === "a" ? "b" : "a";
        if (!ws) r.JE++; else if (ws === s) r.JG++; else r.JP++;
        r.CF += g[s + "s"]; r.CC += g[o + "s"];
      }
    }
    categories[cat] = Object.values(rows)
      .sort((x, y) => y.JG - x.JG || x.JP - y.JP || (y.CF - y.CC) - (x.CF - x.CC) || y.CF - x.CF)
      .map((r, i) => ({ team: r.team, JG: r.JG, JE: r.JE, JP: r.JP, place: i + 1 }));
  }
  const teamInfo = {};
  for (const [cat, names] of Object.entries(groups)) for (const t of names)
    teamInfo[t] = { cat, manager: MANAGERS[t] || "", roster: (ROSTER_DATA[t] || []).slice(), logo: TEAM_LOGOS[t] || null };
  return [{ season: "18", year: "2025", example: true, teamInfo, categories, games, boxes: {},
    week1, weeks: 10, regular: 10, playoffs: { novatos: 8, femenil: 4 }, played: games.length,
    po: simulatedPlayoffs(categories, { novatos: 8, femenil: 4 }, dayOf(10, 4), hash, rnd, games, dayOf) }];
}

/* Cierra la temporada en curso: tabla final por categoría y la ficha de cada equipo. */
function archiveCurrentSeason(){
  const categories = {}, teamInfo = {};
  const infoOf = (t, cat, extra) => ({ cat, manager: MANAGERS[t] || "", roster: (ROSTERS[t] || []).slice(), logo: TEAM_LOGOS[t] || null, ...extra });
  for (const c of CATEGORIES){
    const rows = rankTable(c.id);
    if (rows.length) categories[c.id] = rows.map((r, i) => ({ team: r.team, JG: r.JG, JE: r.JE, JP: r.JP, place: i + 1 }));
    for (const t of TEAMS[c.id] || []) teamInfo[t] = infoOf(t, c.id);
  }
  for (const w of withdrawn) if (!teamInfo[w.team]) teamInfo[w.team] = infoOf(w.team, w.cat, { baja: true });
  const games = calGames().filter(g => g.st !== "P").map(g => { const { fresh, ...rest } = g; return JSON.parse(JSON.stringify(rest)); });
  const boxes = {};
  for (const g of calGames()) if (g.st === "F"){ const b = boxOf(g); if (b) boxes[g.id] = JSON.parse(JSON.stringify(b)); }
  SEASON_ARCHIVE.unshift({ season: LEAGUE.season, year: LEAGUE.year, categories, teamInfo, games, boxes,
    week1: WEEK1, weeks: Math.max(1, ...games.map(g => g.w)), regular: SEASON.games, playoffs: { ...SEASON.playoffs },
    po: JSON.parse(JSON.stringify(PLAYOFFS)),
    played: games.filter(isPlayed).length });
}

/* Lista de equipos para la temporada nueva: los de ahora (incluidos), los dados de baja y los
   de temporadas pasadas (sin incluir), cada uno con su última categoría, roster y manager. */
function newSeasonDraft(){
  const teams = [], seen = new Set();
  const add = t => {
    if (seen.has(nameKey(t.name))) return;
    seen.add(nameKey(t.name));
    teams.push({ key: "t" + teams.length, keepRoster: t.roster.length > 0, paid: false, ...t });
  };
  for (const c of CATEGORIES){
    const rows = rankTable(c.id);
    rows.forEach((r, i) => add({ name: r.team, from: "actual", lastCat: c.id, cat: c.id, include: true,
      note: `Temporada ${LEAGUE.season} · ${c.name} · ${i + 1}º de ${rows.length}`,
      manager: MANAGERS[r.team] || "", roster: (ROSTERS[r.team] || []).slice(), logo: TEAM_LOGOS[r.team] || null }));
  }
  for (const w of withdrawn) add({ name: w.team, from: "baja", lastCat: w.cat, cat: w.cat, include: false,
    note: `Se dio de baja en la temporada ${LEAGUE.season}`,
    manager: MANAGERS[w.team] || "", roster: (ROSTERS[w.team] || []).slice(), logo: TEAM_LOGOS[w.team] || null });
  for (const s of SEASON_ARCHIVE) for (const [name, info] of Object.entries(s.teamInfo)){
    const row = (s.categories[info.cat] || []).find(r => r.team === name);
    add({ name, from: "pasada", lastCat: info.cat, cat: CATEGORIES.some(c => c.id === info.cat) ? info.cat : mainCat().id, include: false,
      note: `Última vez: temporada ${s.season} · ${catName(info.cat)}${row ? ` · ${row.place}º` : ""}${info.baja ? " · se dio de baja" : ""}`,
      manager: info.manager, roster: info.roster.slice(), logo: info.logo });
  }
  return {
    season: nextSeasonName(), year: String(Math.max(+LEAGUE.year || 0, +TODAY.slice(0, 4))),
    games: SEASON.games, playoffs: { ...SEASON.playoffs }, teams,
    newName: "", newCat: mainCat().id, show: "todos",
  };
}

function seasonChecks(d){
  const errors = [], warnings = [];
  const name = normName(d.season);
  if (!name) errors.push("Escribe el número de la nueva temporada.");
  else if ([LEAGUE.season, ...SEASON_ARCHIVE.map(s => s.season)].some(s => nameKey(s) === nameKey(name))) errors.push(`Ya existe la temporada ${name}.`);
  if (!/^\d{4}$/.test(normName(d.year))) errors.push("El año va con 4 dígitos.");
  const inc = d.teams.filter(t => t.include);
  if (!inc.length) errors.push("Incluye al menos un equipo.");
  for (const c of CATEGORIES){
    const n = inc.filter(t => t.cat === c.id).length;
    if (n === 1) warnings.push(`${c.name} queda con un solo equipo: no se le pueden programar juegos.`);
    if (n > 1 && d.playoffs[c.id] > n) warnings.push(`${c.name}: pasan ${d.playoffs[c.id]} a playoffs pero solo tiene ${n} equipos.`);
  }
  const out = d.teams.filter(t => t.from === "actual" && !t.include).length;
  if (out) warnings.push(`${plural(out, "equipo de esta temporada no sigue", "equipos de esta temporada no siguen")}: quedan guardados para volver a inscribirse después.`);
  const pending = calGames().filter(g => g.st === "P").length;
  if (pending) warnings.push(`${plural(pending, "juego programado", "juegos programados")} sin resultado de la temporada ${LEAGUE.season} se quitan del calendario.`);
  return { errors, warnings };
}

function weekRangeFrom(monday){
  const a = parseD(monday), b = new Date(a.getTime() + 6 * DAY_MS);
  return `${a.getUTCDate()} ${MESES[a.getUTCMonth()]}–${b.getUTCDate()} ${MESES[b.getUTCMonth()]}`;
}

/* Mientras se escribe el número o el año: revisión y barra, sin redibujar los campos. */
function refreshSeason(){
  const d = seasonDraft;
  if (!d) return;
  const chk = seasonChecks(d);
  const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
  set("sd-checks", seasonChecksHtml(chk));
  set("sdbar-status", seasonStatusHtml(chk));
  set("sdbar-name", `Temporada ${esc(normName(d.season) || "nueva")}`);
  set("sd-sumname", esc(normName(d.season) || "nueva"));
  const btn = document.querySelector("[data-sdcreate]");
  if (btn) btn.disabled = chk.errors.length > 0;
}

function seasonAction(el){
  const d = seasonDraft, ds = el.dataset;
  if (ds.sdall){
    const [cat, on] = ds.sdall.split("|");
    d.teams.filter(t => t.cat === cat).forEach(t => { t.include = on === "1"; });
    return render();
  }
  if (ds.sdshow){ d.show = ds.sdshow; return render(); }
  if (ds.sdgames){ d.games = Math.min(30, Math.max(2, d.games + +ds.sdgames)); return render(); }
  if (ds.sdplayoffs){
    const [cat, step] = ds.sdplayoffs.split("|");
    const n = d.teams.filter(t => t.include && t.cat === cat).length;
    d.playoffs[cat] = Math.min(n >= 2 ? n : 16, Math.max(2, (d.playoffs[cat] || 0) + +step));
    return render();
  }
  if (ds.sdadd !== undefined){
    const name = normName(d.newName);
    if (!name) return toast("Escribe el nombre del equipo nuevo");
    const same = d.teams.find(t => nameKey(t.name) === nameKey(name));
    if (same){
      same.include = true;
      d.newName = "";
      render();
      return toast(same.from === "actual" ? `${same.name} ya está en la temporada` : `${same.name} ya jugó antes: quedó incluido con su historial`);
    }
    d.teams.push({ key: "n" + d.teams.length + "-" + Date.now(), name, from: "nuevo", lastCat: d.newCat, cat: d.newCat, include: true,
      note: "Equipo nuevo · su manager y roster se capturan en Administrar equipos", manager: "", roster: [], logo: null, keepRoster: false, paid: false });
    d.newName = "";
    render();
    const box = document.getElementById("sd-newname");
    if (box) box.focus();
    return toast(`${name} agregado a ${catName(d.newCat)}`);
  }
  if (ds.sddel){ d.teams = d.teams.filter(t => t.key !== ds.sddel); return render(); }
  if (ds.sdcancel !== undefined){ seasonDraft = null; return go("temporada"); }
  if (ds.sdcreate !== undefined){
    if (seasonChecks(d).errors.length) return;
    const inc = d.teams.filter(t => t.include).length;
    return askConfirm({
      title: `¿Crear la temporada ${normName(d.season)}?`,
      body: `La temporada ${LEAGUE.season} se cierra y queda archivada con su tabla final. La nueva arranca con ${plural(inc, "equipo", "equipos")}, el calendario vacío y las estadísticas en cero.`,
      ok: "Crear temporada",
      onConfirm: createSeason,
    });
  }
}

function createSeason(){
  const d = seasonDraft;
  if (!d || seasonChecks(d).errors.length) return;
  const prev = LEAGUE.season;
  const pending = calGames().filter(g => g.st === "P").length;
  archiveCurrentSeason();

  const inc = d.teams.filter(t => t.include);
  for (const c of CATEGORIES) TEAMS[c.id] = inc.filter(t => t.cat === c.id).map(t => t.name);
  for (const t of inc){
    if (t.keepRoster && t.roster.length) ROSTERS[t.name] = t.roster.slice(); else delete ROSTERS[t.name];
    if (!MANAGERS[t.name]) MANAGERS[t.name] = t.manager || "Por asignar";
    if (t.logo && !TEAM_LOGOS[t.name]) TEAM_LOGOS[t.name] = t.logo;
  }
  CATEGORIES.forEach(c => { c.teams = TEAMS[c.id].length; c.active = c.teams > 0; });

  replaceArr(CAL, []);
  SEASON_BOXES = {};
  scheduled = []; captured = null; corrections = []; published = false; createdWeeks = 0; changedTeams = [];
  WEEK1 = mondayOf(TODAY); WEEKS = 1; TODAY_WEEK = weekOf(TODAY);
  const dues = Object.fromEntries(inc.map(t => [t.name, t.paid ? TODAY_WEEK : null]));
  replaceObj(TEAM_DUES_DATA, dues);
  replaceObj(TEAM_DUES, dues);
  replaceArr(ERA_LEADERS, []);
  replaceObj(RIVAL_LEADERS, { avg: [], CP: [], HR: [] });
  SEASON.games = d.games;
  for (const c of CATEGORIES){
    const n = TEAMS[c.id].length;
    SEASON.playoffs[c.id] = n >= 2 ? Math.min(d.playoffs[c.id] || 2, n) : (d.playoffs[c.id] || SEASON_DEFAULT.playoffs);
  }
  LEAGUE.season = normName(d.season);
  LEAGUE.year = normName(d.year);
  seasonsCreated++;
  withdrawn = [];
  Object.assign(PLAYOFFS, emptyPlayoffs());

  setCaptureGame(null);
  capState.week = TODAY_WEEK;
  fixForm = null; capMode = "nuevo"; calWeek = null; openGame = null;
  schedForm = defaultSchedForm();
  if (openTeam && !inc.some(t => t.name === openTeam)) openTeam = null;
  teamForm = null;
  seasonDraft = null;
  go("admin");
  toast(`Temporada ${LEAGUE.season} creada con ${plural(inc.length, "equipo", "equipos")} · la ${prev} quedó archivada${pending ? ` y se quitaron ${plural(pending, "juego sin jugar", "juegos sin jugar")}` : ""}`);
}

/* ---------------- playoffs ---------------- */
/* Series al mejor de 3 (gana quien gane 2). En cada ronda el mejor sembrado que sigue vivo enfrenta
   al peor, el segundo al penúltimo, y así; con equipos impares, el mejor sembrado descansa.
   Mientras la temporada regular siga abierta la llave es una proyección del standing; al cerrarla
   se congelan los sembrados y el administrador captura los juegos de cada serie. */
function emptyPlayoffs(){ return { closed: false, closedAt: null, cats: {}, results: {} }; }
const PLAYOFFS = emptyPlayoffs();
let poCat = null;                // categoría abierta en la pestaña de playoffs
let poRegistry = [];             // series de la llave dibujada, para los botones de captura

function roundName(teams){
  return teams <= 2 ? "Final" : teams <= 4 ? "Semifinales" : teams <= 8 ? "Cuartos de final" : teams <= 16 ? "Octavos de final" : "Primera ronda";
}

function buildBracket(catId, seeds, results){
  const rounds = [];
  let alive = seeds.slice().sort((a, b) => a.seed - b.seed);
  let r = 0;
  while (alive.length > 1){
    const list = alive.slice();
    const bye = list.length % 2 ? list.shift() : null;
    const series = [];
    for (let i = 0; i < list.length / 2; i++){
      const hi = list[i], lo = list[list.length - 1 - i];
      const key = `${catId}|${r}|${hi.team}|${lo.team}`;
      const games = (results && results[key]) || [];
      const wins = { hi: games.filter(g => g.h > g.l).length, lo: games.filter(g => g.l > g.h).length };
      series.push({ key, hi, lo, games, wins, winner: wins.hi >= 2 ? hi : wins.lo >= 2 ? lo : null });
    }
    rounds.push({ name: roundName(alive.length), series, bye });
    if (series.some(s => !s.winner)){
      let n = series.length + (bye ? 1 : 0);
      while (n > 1){
        const odd = n % 2 === 1, count = Math.floor(n / 2);
        rounds.push({ name: roundName(n), series: Array.from({ length: count }, () => ({ placeholder: true })), bye: odd ? { placeholder: true } : null });
        n = count + (odd ? 1 : 0);
      }
      return { rounds, champion: null };
    }
    alive = [...(bye ? [bye] : []), ...series.map(s => s.winner)].sort((a, b) => a.seed - b.seed);
    r++;
  }
  return { rounds, champion: rounds.length ? alive[0] : null };
}

/* Playoffs ya jugados para la temporada de ejemplo: cada juego de cada serie queda en el calendario,
   a partir de la semana 11, un juego por día para no chocar en el campo. */
function simulatedPlayoffs(categories, counts, closedAt, hash, rnd, games, dayOf){
  const po = emptyPlayoffs();
  po.closed = true;
  po.closedAt = closedAt;
  const score = t => Math.round((3 + hash(t + "·fuerza") % 7) * (0.6 + rnd()) + rnd() * 4);
  let id = 0, catOffset = 0;
  for (const [cat, rows] of Object.entries(categories)){
    const P = Math.min(counts[cat] || 4, rows.length);
    if (P < 2) continue;
    po.cats[cat] = { seeds: rows.slice(0, P).map((r, i) => ({ team: r.team, seed: i + 1, JG: r.JG, JP: r.JP, JE: r.JE })) };
    for (let guard = 0; guard < 60; guard++){
      const br = buildBracket(cat, po.cats[cat].seeds, po.results);
      const ri = br.rounds.findIndex(rd => rd.series.some(s => !s.placeholder && !s.winner));
      if (ri < 0) break;
      const rd = br.rounds[ri], si = rd.series.findIndex(s => !s.placeholder && !s.winner), s = rd.series[si];
      let h = score(s.hi.team), l = score(s.lo.team);
      if (h === l){ if (rnd() < 0.55) h++; else l++; }
      (po.results[s.key] = po.results[s.key] || []).push({ h, l });
      const n = po.results[s.key].length;
      const slot = si * 3 + (n - 1);
      const w = 11 + ri * 3 + Math.floor(slot / 5);
      games.push({ w, d: dayOf(w, slot % 5), h: catOffset ? "21:00" : "19:00", c: cat, a: s.hi.team, b: s.lo.team,
        id: `t18-po-${++id}`, st: "F", as: h, bs: l, po: { key: s.key, n, hi: s.hi.team, lo: s.lo.team, round: rd.name } });
    }
    catOffset++;
  }
  return po;
}

const seedsOf = catId => rankTable(catId).slice(0, playoffsFor(catId)).map((r, i) => ({ team: r.team, seed: i + 1, JG: r.JG, JP: r.JP, JE: r.JE }));
function bracketFor(catId){
  if (PLAYOFFS.closed){
    const fixed = PLAYOFFS.cats[catId];
    return fixed ? { ...buildBracket(catId, fixed.seeds, { ...PLAYOFFS.results, ...derivedResults(catId) }), seeds: fixed.seeds, closed: true } : null;
  }
  const seeds = seedsOf(catId);
  return seeds.length >= 2 ? { ...buildBracket(catId, seeds, {}), seeds, closed: false } : null;
}

function regularGamesLeft(){
  return CATEGORIES.reduce((n, c) => {
    const t = (TEAMS[c.id] || []).length;
    return t < 2 ? n : n + Math.max(0, t * SEASON.games / 2 - calGames().filter(g => g.c === c.id && isPlayed(g) && !g.po).length);
  }, 0);
}

function closeRegularSeason(){
  const cats = {};
  for (const c of CATEGORIES){
    const seeds = seedsOf(c.id);
    if (seeds.length >= 2) cats[c.id] = { seeds };
  }
  for (let i = CAL.length - 1; i >= 0; i--) if (CAL[i].st === "P" && !CAL[i].po) CAL.splice(i, 1);
  scheduled = scheduled.filter(g => g.po || g.st !== "P");
  if (!captureGame()) setCaptureGame(null);
  Object.assign(PLAYOFFS, { closed: true, closedAt: TODAY, cats, results: {} });
  const first = pendingPlayoffGames()[0];
  if (first) schedForm = playoffSchedForm(first);
}

/* Resultados de cada serie a partir de sus juegos del calendario (jugados o forfit). */
function derivedResults(catId, games = calGames()){
  const res = {};
  for (const g of games){
    if (!g.po || g.c !== catId || !isPlayed(g)) continue;
    const hiFirst = g.a === g.po.hi;
    (res[g.po.key] = res[g.po.key] || []).push({ h: hiFirst ? g.as : g.bs, l: hiFirst ? g.bs : g.as, n: g.po.n });
  }
  for (const k of Object.keys(res)) res[k].sort((x, y) => x.n - y.n);
  return res;
}

/* Juegos de una serie: los que ya están en el calendario y los que faltan por programar.
   Juego 1 y 2 siempre; el 3 solo si la serie va 1–1 después de dos juegos. */
function seriesSlots(s){
  const games = calGames().filter(g => g.po && g.po.key === s.key && g.st !== "NJ").sort((x, y) => x.po.n - y.po.n);
  const played = games.filter(isPlayed).length;
  const need = s.winner ? 0 : played >= 2 && s.wins.hi === 1 && s.wins.lo === 1 ? 3 : 2;
  const top = Math.max(need, ...games.map(g => g.po.n), 0);
  const out = [];
  for (let n = 1; n <= top; n++) out.push({ n, game: games.find(g => g.po.n === n) || null });
  return out;
}

/* Juegos de playoffs que el administrador tiene que programar, en orden de categoría y ronda. */
function pendingPlayoffGames(){
  if (!PLAYOFFS.closed) return [];
  const out = [];
  for (const c of CATEGORIES){
    const br = bracketFor(c.id);
    if (!br) continue;
    br.rounds.forEach(rd => rd.series.forEach(s => {
      if (s.placeholder || s.winner) return;
      for (const slot of seriesSlots(s)) if (!slot.game) out.push({ cat: c.id, round: rd.name, key: s.key, n: slot.n, hi: s.hi, lo: s.lo });
    }));
  }
  return out;
}

function playoffSchedForm(p){
  const cat = CATEGORIES.find(c => c.id === p.cat) || mainCat();
  const prevWeeks = calGames().filter(g => g.po && g.po.key === p.key && g.po.n < p.n).map(g => g.w);
  const w = Math.min(calWeeks(), Math.max(TODAY_WEEK, ...prevWeeks));
  return { cat: cat.id, w, a: p.hi.team, b: p.lo.team, ...firstFree(cat, w),
    po: { key: p.key, n: p.n, hi: p.hi.team, lo: p.lo.team, round: p.round } };
}

function playoffSchedCheck(f){
  const cat = CATEGORIES.find(c => c.id === f.cat) || mainCat();
  const errors = [], warnings = [];
  if (!freeCount(cat, f.w)){
    errors.push(`La semana ${f.w} ya no tiene horarios libres en el ${cat.field.toLowerCase()}. Crea la semana ${calWeeks() + 1} para seguir programando.`);
    return { errors, warnings };
  }
  if (f.d < TODAY) errors.push("Ese día ya pasó.");
  if (cat.times && !cat.times.includes(f.h)) errors.push(`${cat.name} solo juega a las ${listJoin(cat.times)}.`);
  const games = calGames().filter(g => g.st !== "NJ");
  const clash = games.find(g => g.d === f.d && g.h === f.h && fieldOf(g) === cat.field);
  if (clash) errors.push(`El ${cat.field.toLowerCase()} ya tiene ${clash.a} vs ${clash.b} (${catName(clash.c)}) a esa hora.`);
  for (const t of [f.a, f.b]){
    const same = games.find(g => g.d === f.d && (g.a === t || g.b === t));
    if (same) errors.push(`${t} ya juega ese día a las ${same.h}.`);
  }
  const prev = games.filter(g => g.po && g.po.key === f.po.key && g.po.n < f.po.n).sort((x, y) => y.po.n - x.po.n)[0];
  if (prev && f.d <= prev.d) errors.push(`El juego ${f.po.n} tiene que ir después del juego ${prev.po.n} (${fmtDay(prev.d)}).`);
  return { errors, warnings };
}

function seriesToast(game){
  const br = bracketFor(game.c);
  const s = br && br.rounds.flatMap(rd => rd.series).find(x => x.key === game.po.key);
  if (!s) return "";
  return s.winner
    ? ` · ${s.winner.team} gana la serie ${Math.max(s.wins.hi, s.wins.lo)}–${Math.min(s.wins.hi, s.wins.lo)}${br.champion ? " y es campeón" : ""}`
    : ` · serie ${s.hi.team} ${s.wins.hi}–${s.wins.lo} ${s.lo.team}`;
}

/* ---------------- ver temporadas pasadas ---------------- */
/* Todo el sitio se calcula de CAL, TEAMS, rosters y la temporada en LEAGUE: para ver una temporada
   archivada se cargan sus datos ahí, en solo lectura, y la temporada en curso se guarda intacta. */
function captureSeasonState(){
  return {
    games: CAL.slice(), scheduled, captured, corrections, published, createdWeeks, withdrawn,
    teams: Object.fromEntries(CATEGORIES.map(c => [c.id, (TEAMS[c.id] || []).slice()])),
    rosters: { ...ROSTER_DATA }, managers: { ...MANAGERS }, logos: { ...TEAM_LOGOS },
    season: LEAGUE.season, year: LEAGUE.year, week1: WEEK1, weeks: WEEKS, todayWeek: TODAY_WEEK,
    regular: SEASON.games, playoffs: { ...SEASON.playoffs },
    era: ERA_LEADERS.slice(), rivals: { ...RIVAL_LEADERS }, boxes: SEASON_BOXES,
    po: JSON.parse(JSON.stringify(PLAYOFFS)),
  };
}
function stateFromArchive(s){
  const teams = Object.fromEntries(CATEGORIES.map(c => [c.id, []]));
  for (const [name, info] of Object.entries(s.teamInfo)) if (!info.baja && teams[info.cat]) teams[info.cat].push(name);
  const pick = k => Object.fromEntries(Object.entries(s.teamInfo)
    .filter(([, i]) => k === "roster" ? i.roster && i.roster.length : i[k])
    .map(([name, i]) => [name, k === "roster" ? i.roster.slice() : i[k]]));
  const weeks = s.weeks || Math.max(1, ...(s.games || []).map(g => g.w));
  return {
    games: (s.games || []).map(g => ({ ...g })), scheduled: [], captured: null, corrections: [], published: false, createdWeeks: 0, withdrawn: [],
    teams, rosters: pick("roster"), managers: pick("manager"), logos: pick("logo"),
    season: s.season, year: s.year, week1: s.week1 || WEEK1, weeks, todayWeek: weeks,
    regular: s.regular || SEASON.games, playoffs: { ...SEASON.playoffs, ...(s.playoffs || {}) },
    era: [], rivals: { avg: [], CP: [], HR: [] }, boxes: s.boxes || {},
    po: s.po ? JSON.parse(JSON.stringify(s.po)) : emptyPlayoffs(),
  };
}
function loadSeasonState(st){
  replaceArr(CAL, st.games);
  scheduled = st.scheduled; captured = st.captured; corrections = st.corrections;
  published = st.published; createdWeeks = st.createdWeeks; withdrawn = st.withdrawn;
  for (const c of CATEGORIES) TEAMS[c.id] = st.teams[c.id] || [];
  replaceObj(ROSTER_DATA, st.rosters);
  replaceObj(MANAGERS, st.managers);
  replaceObj(TEAM_LOGOS, st.logos);
  LEAGUE.season = st.season; LEAGUE.year = st.year;
  WEEK1 = st.week1; WEEKS = st.weeks; TODAY_WEEK = st.todayWeek;
  SEASON.games = st.regular;
  Object.assign(SEASON.playoffs, st.playoffs);
  replaceArr(ERA_LEADERS, st.era);
  replaceObj(RIVAL_LEADERS, st.rivals);
  SEASON_BOXES = st.boxes;
  Object.assign(PLAYOFFS, emptyPlayoffs(), st.po || {});
  CATEGORIES.forEach(c => { c.teams = TEAMS[c.id].length; c.active = c.teams > 0; });
}

function viewSeason(id){
  const live = liveState ? liveState.season : LEAGUE.season;
  if (!id || id === "actual" || id === live){
    if (!viewingSeason) return;
    loadSeasonState(liveState);
    liveState = null;
    viewingSeason = null;
  } else {
    const s = SEASON_ARCHIVE.find(x => x.season === id);
    if (!s || viewingSeason === s.season) return;
    if (!liveState) liveState = captureSeasonState();
    loadSeasonState(stateFromArchive(s));
    viewingSeason = s.season;
  }
  const keepTeam = screen === "equipo" && openTeam && categoryOf(openTeam) ? openTeam : null;   // si también jugó esa temporada, se queda en su perfil
  calWeek = null; openGame = null; openTeam = keepTeam; viewGameId = null; changedTeams = [];
  if (ADMIN_SCREENS.includes(screen) || screen === "juego") screen = "inicio";
  else if (screen === "equipo" && !keepTeam) screen = "equipos";
  render();
  window.scrollTo({ top: 0 });
  toast(viewingSeason ? `Viendo la temporada ${LEAGUE.season} (${LEAGUE.year}) en solo lectura` : `De vuelta en la temporada ${LEAGUE.season}`);
}

/* ---------------- orden al bat ---------------- */
const POSITIONS = ["P", "C", "1B", "2B", "3B", "SS", "LF", "CF", "RF", "JD", "JC"];
const FIELD_POS = POSITIONS.slice(0, 9);
const POS_LABEL = { JD: "JD · designado", JC: "JC · cortesía" };
const STAT_KEYS = ["VB", "H", "D", "T", "HR", "CA", "CP", "BB", "K", "BR"];
const STAT_LABEL = { D: "2B", T: "3B" };
const INNINGS = 7;
const MAX_BATTERS = 10, MIN_BATTERS = 9;
const ROSTER_MAX = 20;           // jugadores registrados por equipo
const SAMPLE_INN = { a: [2, 0, 3, 1, 4, 1, 1], h: [0, 2, 1, 3, 0, 2, 1] };   // suman lo mismo que las CA de ejemplo

const statsOf = arr => Object.fromEntries(STAT_KEYS.map((k, i) => [k, arr ? arr[i] : 0]));
const newEntry = (player, pos, kind = "titular", inn = null, stats) => ({ player, pos, kind, inn, ...statsOf(stats) });
const lastOf = slot => slot.entries[slot.entries.length - 1];
const rosterOf = team => (team && ROSTERS[team]) || [];
const normName = name => (name || "").trim().replace(/\s+/g, " ");
const nameKey = name => normName(name).toLowerCase();

/* Jugadores anotados en un juego que no están en el roster del equipo, en orden de aparición.
   Los que caben hasta ROSTER_MAX quedan registrados al publicar ("nuevo"); los que ya no
   caben juegan sin estar registrados: alineación indebida. */
function lineupRegistration(team, slots, pitchers = []){
  const roster = rosterOf(team);
  const known = new Set(roster.map(nameKey));
  let free = Math.max(0, ROSTER_MAX - roster.length);
  const reg = new Map();
  const visit = player => {
    const key = nameKey(player);
    if (!key || known.has(key) || reg.has(key)) return;
    reg.set(key, { name: normName(player), st: free > 0 ? "nuevo" : "indebida" });
    if (free > 0) free--;
  };
  slots.forEach(s => s.entries.forEach(e => visit(e.player)));
  pitchers.forEach(p => visit(p.player));
  return reg;
}
const regOf = (reg, player) => reg.get(nameKey(player)) || null;
const REG_LABEL = { nuevo: "Nuevo", indebida: "Alineación indebida" };
const regTagClass = st => "regtag" + (st === "indebida" ? " bad" : st === "nuevo" ? " new" : "");

/* Orden al bat de ejemplo de Caimanes: 10 bateadores con JD y JC, y un cambio en la 5ª. */
const CAIMANES_SAMPLE = [
  ["Edwyn Pompa",        "C",  [3,2,0,0,0,2,1,1,0,2]],
  ["Enrique Muñoz",      "LF", [4,3,1,0,0,2,2,0,0,1]],
  ["Axel Medina",        "CF", [4,2,1,0,0,1,2,0,1,0]],
  ["Xico Espinoza",      "SS", [4,2,0,0,1,2,3,0,0,1]],
  ["Luis Fernando Lugo", "1B", [3,2,1,0,0,1,2,1,0,1]],
  ["Ricardo Hernández",  "3B", [4,1,1,0,0,1,1,0,1,1]],
  ["Carlos Sepulveda",   "2B", [3,1,0,0,0,1,0,1,0,0]],
  ["Teddy Sainz",        "JD", [3,1,0,1,0,1,1,0,0,0]],
  ["Luis Pompa",         "RF", [2,0,0,0,0,0,0,1,1,0], ["Omar Ramirez", 5, [1,1,0,0,0,1,0,0,0,0]]],
  ["Carlos Baez",        "JC", [3,1,0,0,0,0,0,0,1,0]],
];
/* Los demás equipos: 9 bateadores que cubren las 9 posiciones, con números de ejemplo. */
const GENERIC_POS = ["CF", "SS", "1B", "3B", "LF", "2B", "C", "RF", "P"];
const SAMPLE_STATS = {
  a: [[4,2,1,0,0,2,1,0,0,1],[4,2,0,0,0,1,1,0,1,0],[4,3,1,0,1,2,3,0,0,0],[4,2,1,0,0,2,2,0,0,1],[3,1,0,0,0,1,1,1,0,0],
      [4,2,0,1,0,1,2,0,1,0],[3,1,0,0,0,1,0,1,0,1],[3,1,0,0,0,1,1,0,1,0],[3,1,0,0,0,1,1,0,0,0]],
  b: [[4,2,0,0,0,1,0,0,0,1],[4,1,1,0,0,1,1,0,1,0],[4,2,0,0,1,2,2,0,0,0],[4,2,1,0,0,1,2,0,1,0],[3,1,0,0,0,1,1,1,0,0],
      [3,1,0,0,0,1,1,0,1,0],[3,1,0,0,0,1,1,0,0,1],[3,0,0,0,0,0,0,1,1,0],[3,1,0,0,0,1,1,0,0,0]],
};

/* Orden al bat en blanco: 9 turnos (el mínimo) con la posición sugerida y sin jugadores ni números. */
function defaultLineup(team, side){
  return rosterOf(team).length ? GENERIC_POS.map(pos => ({ entries: [newEntry("", pos)] })) : [];
}

/* Jugadores que ya aparecen en el orden al bat (titulares, cambios y reingresos). */
const usedPlayers = (slots, skip) => new Set(slots.flatMap((s, i) =>
  s.entries.filter((e, k) => !(skip && skip[0] === i && skip[1] === k)).map(e => e.player)).filter(Boolean));

/* Reingreso: solo el titular, en su mismo turno, una sola vez, y cuando quien está es un cambio.
   Quien entró de cambio solo puede salir para que reingrese el titular por el que entró. */
const canReenter = slot => slot.entries.length > 1 && lastOf(slot).kind === "cambio"
  && !slot.entries.some(e => e.kind === "reingreso");

function lineupCheck(team, slots){
  const errors = [], warnings = [];
  const n = slots.length;
  const starters = slots.map(s => s.entries[0]);
  const current = slots.map(lastOf);
  const jc = starters.filter(e => e.pos === "JC").length;
  const jd = starters.filter(e => e.pos === "JD").length;

  if (n < MIN_BATTERS) errors.push(`${team}: el orden al bat necesita mínimo ${MIN_BATTERS} bateadores (lleva ${n}).`);
  if (n > MAX_BATTERS) errors.push(`${team}: el orden al bat es de máximo ${MAX_BATTERS} bateadores.`);
  if (n === MAX_BATTERS && !jc) errors.push(`${team}: el décimo bateador solo va si es JC (jugador de cortesía).`);
  if (jc > 1) errors.push(`${team}: solo puede haber un JC.`);
  if (jd > 1) errors.push(`${team}: solo puede haber un JD.`);

  slots.forEach((s, i) => s.entries.forEach((e, k) => {
    if (!normName(e.player)) errors.push(`${team}: falta elegir ${k ? "quién entra" : "al jugador"} en el turno ${i + 1}.`);
  }));

  const seen = new Map();
  slots.forEach((s, i) => s.entries.forEach(e => {
    const key = nameKey(e.player);
    if (!key || e.kind === "reingreso") return;
    if (seen.has(key)) errors.push(`${team}: ${normName(e.player)} aparece dos veces (turnos ${seen.get(key)} y ${i + 1}).`);
    else seen.set(key, i + 1);
  }));

  slots.forEach((s, i) => {
    const starter = s.entries[0];
    const back = s.entries.filter(e => e.kind === "reingreso");
    if (back.length > 1) errors.push(`${team}: ${starter.player} solo puede reingresar una vez.`);
    back.forEach(e => { if (e.player !== starter.player) errors.push(`${team}: en el turno ${i + 1} solo puede reingresar el titular (${starter.player}).`); });
    for (let k = 1; k < s.entries.length; k++){
      const prev = s.entries[k - 1].inn || 1, cur = s.entries[k].inn;
      if (!cur) errors.push(`${team}: falta la entrada del cambio en el turno ${i + 1}.`);
      else if (cur < prev) errors.push(`${team}: en el turno ${i + 1} los cambios van en el orden en que ocurrieron.`);
      if (s.entries[k].kind === "cambio" && s.entries[k - 1].kind === "cambio")
        errors.push(`${team}: ${normName(s.entries[k - 1].player) || "el cambio"} entró de cambio en el turno ${i + 1}; solo puede salir para que reingrese ${starter.player}.`);
    }
    if (starter.pos === "JC" && s.entries.some(e => e.pos !== "JC")) errors.push(`${team}: el JC solo batea; quien entra por él también es JC (turno ${i + 1}).`);
  });

  const byPos = {};
  current.forEach((e, i) => { if (FIELD_POS.includes(e.pos)) (byPos[e.pos] = byPos[e.pos] || []).push(i + 1); });
  for (const [p, turns] of Object.entries(byPos)) if (turns.length > 1) warnings.push(`${team}: ${p} repetida en los turnos ${turns.join(" y ")}.`);
  const missing = FIELD_POS.filter(p => !byPos[p]);
  const free = jd ? 1 : 0;   // con JD, uno de los defensivos no batea
  if (n >= MIN_BATTERS && missing.length > free)
    warnings.push(`${team}: sin cubrir a la defensiva entre los bateadores: ${missing.join(", ")}${free ? " (con JD, uno de los nueve no batea)" : ""}.`);

  slots.forEach(s => s.entries.forEach(e => {
    if (!e.player) return;
    if (e.H > e.VB) warnings.push(`${team}: ${e.player} tiene más hits que turnos al bat.`);
    if (e.D + e.T + e.HR > e.H) warnings.push(`${team}: ${e.player} tiene más extrabases que hits.`);
  }));
  return { errors, warnings };
}

function captureChecks(){
  const errors = [], warnings = [], infos = [];
  if (bx() === capState && capState.st && capState.st !== "F") return { errors, warnings, infos };
  for (const side of ["a", "b"]){
    const team = side === "a" ? bx().away : bx().home;
    if (!team) continue;
    const slots = (bx().sides && bx().sides[side]) || [];
    const pitchers = (bx().pitch && bx().pitch[side]) || [];
    if (!rosterOf(team).length && !slots.length && !pitchers.length){
      warnings.push(`${team} no tiene roster registrado: se captura solo su marcador, o su orden al bat y pitcheo escribiendo los nombres.`);
      continue;
    }
    if (slots.length || rosterOf(team).length){
      const c = lineupCheck(team, slots);
      errors.push(...c.errors);
      warnings.push(...c.warnings);
      const runs = slots.reduce((t, s) => t + s.entries.reduce((u, e) => u + (+e.CA || 0), 0), 0);
      const line = (side === "a" ? bx().a : bx().h).reduce((t, v) => t + (+v || 0), 0);
      if (runs !== line) warnings.push(`${team}: las carreras anotadas del orden al bat (${runs}) no coinciden con su marcador (${line}).`);
    }
    const pc = pitchCheck(team, side);
    errors.push(...pc.errors);
    warnings.push(...pc.warnings);
    for (const r of lineupRegistration(team, slots, pitchers).values()){
      if (r.st === "indebida") warnings.push(`${team}: ${r.name} no está registrado y el equipo ya tiene ${ROSTER_MAX} jugadores: alineación indebida.`);
      else infos.push(`${team}: ${r.name} no está registrado; queda registrado en el equipo al publicar.`);
    }
  }
  const dc = decisionCheck();
  errors.push(...dc.errors);
  warnings.push(...dc.warnings);
  return { errors, warnings, infos };
}
const captureErrors = () => captureChecks().errors;
function lineupChecksHtml(){
  const { errors, warnings, infos } = captureChecks();
  return [
    ...errors.map(e => `<li class="err">${esc(e)}</li>`),
    ...warnings.map(w => `<li class="warn">${esc(w)}</li>`),
    ...infos.map(x => `<li class="info">${esc(x)}</li>`),
  ].join("") || `<li class="ok">Orden al bat y pitcheo completos, sin choques.</li>`;
}

function lineupTable(side){
  const team = side === "a" ? bx().away : bx().home;
  if (!team) return `<p class="capnote">Elige un juego para capturar su orden al bat.</p>`;
  const names = rosterOf(team);
  const slots = bx().sides[side];
  if (!names.length && !slots.length) return `<div class="empty">
      <strong>${esc(team)} no tiene roster registrado</strong>

      <button class="btn" style="margin-top:8px" data-lustart="${side}">Capturar orden al bat</button>
    </div>`;
  const known = new Set(names.map(nameKey));
  const reg = lineupRegistration(team, slots, bx().pitch[side] || []);
  const opt = (v, label, sel) => `<option value="${esc(v)}"${sel ? " selected" : ""}>${esc(label)}</option>`;
  const rows = slots.map((slot, i) => slot.entries.map((e, k) => {

    const typed = e.kind !== "reingreso" && (e.typed || !names.length || (!!e.player && !known.has(nameKey(e.player))));
    const st = e.kind === "reingreso" ? null : (regOf(reg, e.player) || {}).st;
    const regTag = `<span class="${regTagClass(st)}" data-regtag="${key}">${st ? REG_LABEL[st] : ""}</span>`;
    const playerSel = e.kind === "reingreso"
      ? `<select data-lu="${key}|player" disabled aria-label="Reingresa">${opt(e.player, e.player, true)}</select>`
      : typed
        ? `<input type="text" class="luname" data-lu="${key}|player" value="${esc(e.player)}" maxlength="60" placeholder="Nombre del jugador" aria-label="Jugador no registrado en el turno ${i + 1}">${
            names.length ? `<button class="linkbtn" data-lulist="${key}" title="Elegir de los jugadores registrados">Lista</button>` : ""}`
        : `<select data-lu="${key}|player" aria-label="${k ? "Quién entra" : "Jugador"} en el turno ${i + 1}">${opt("", "Elige jugador", !e.player)}${
            names.filter(p => p === e.player || !used.has(p)).map(p => opt(p, p, p === e.player)).join("")}${opt("__nuevo__", "+ Jugador no registrado…", false)}</select>`;
    const jcLocked = k > 0 && slot.entries[0].pos === "JC";
    const posSel = `<select data-lu="${key}|pos" aria-label="Posición"${jcLocked ? " disabled" : ""}>${POSITIONS.map(p => opt(p, p, p === e.pos)).join("")}</select>`;
    const innSel = k
      ? `<select data-lu="${key}|inn" aria-label="Entrada del cambio">${Array.from({ length: INNINGS }, (_, x) => opt(x + 1, `${x + 1}ª`, e.inn === x + 1)).join("")}</select>`
      : `<span class="muted">—</span>`;
    const acts = !isLast ? "" : [

/* ---------------- pitcheo ---------------- */
const PITCH_KEYS = ["H", "C", "CL", "BB", "K"];
const DECISIONS = [["", "—"], ["G", "G"], ["P", "P"], ["S", "S"]];
/* Entradas lanzadas como se anotan: 6.1 = 6 entradas y 1 out, 6.2 = 6 entradas y 2 outs. */
const outsOf = el => {
  const m = String(el == null ? "" : el).trim().match(/^(\d{1,2})(?:\.([012])?)?$/);
  return m ? +m[1] * 3 + (+m[2] || 0) : NaN;
};
const fmtEL = outs => `${Math.floor(outs / 3)}.${outs % 3}`;
const fmtEra = (cl, outs) => outs > 0 ? ((+cl || 0) * INNINGS * 3 / outs).toFixed(2) : "—";
const newPitcher = (player = "", typed = false, EL = "0.0") => ({ player, dec: "", EL, H: 0, C: 0, CL: 0, BB: 0, K: 0, typed });

/* Pitcheo de ejemplo: un pitcher completo por equipo, con lo que bateó el rival. */
/* Pitcheo en blanco: un renglón para el abridor, sin nombre ni números. */
function defaultPitching(side, S = bx()){
  const team = side === "a" ? S.away : S.home;
  return rosterOf(team).length ? [newPitcher("", false, "")] : [];
}

function pitchCheck(team, side){
  const errors = [], warnings = [];
  const rows = (bx().pitch && bx().pitch[side]) || [];
  const slots = (bx().sides && bx().sides[side]) || [];
  if (!rows.length){
    if (slots.length) warnings.push(`${team}: falta capturar su pitcheo.`);
    return { errors, warnings };
  }
  const seen = new Set();
  let outs = 0, badEL = false;
  rows.forEach((p, i) => {
    const name = normName(p.player), label = name || `el pitcher ${i + 1}`;
    if (!name) errors.push(`${team}: falta elegir al pitcher ${i + 1}.`);
    else if (seen.has(nameKey(name))) errors.push(`${team}: ${name} aparece dos veces en el pitcheo.`);
    else seen.add(nameKey(name));
    const o = outsOf(p.EL);
    if (Number.isNaN(o)){ badEL = true; errors.push(`${team}: las entradas lanzadas de ${label} se escriben como 6, 6.1 o 6.2 (entradas y outs).`); }
    else outs += o;
    if ((+p.CL || 0) > (+p.C || 0)) errors.push(`${team}: ${label} tiene más carreras limpias que carreras.`);
  });
  const sum = k => rows.reduce((t, p) => t + (+p[k] || 0), 0);
  const oppRuns = (side === "a" ? bx().h : bx().a).reduce((t, v) => t + (+v || 0), 0);
  if (sum("C") !== oppRuns) warnings.push(`${team}: sus pitchers permitieron ${sum("C")} carreras y el rival anotó ${oppRuns}.`);
  const opp = (bx().sides && bx().sides[side === "a" ? "b" : "a"]) || [];
  if (opp.length){
    for (const [k, label] of [["H", "hits"], ["BB", "bases por bolas"], ["K", "ponches"]]){
      const theirs = opp.reduce((t, s) => t + s.entries.reduce((u, e) => u + (+e[k] || 0), 0), 0);
      if (sum(k) !== theirs) warnings.push(`${team}: los ${label} de su pitcheo (${sum(k)}) no coinciden con el bateo del rival (${theirs}).`);
    }
  }
  if (!badEL){
    if (outs > INNINGS * 3) warnings.push(`${team}: las entradas lanzadas suman ${fmtEL(outs)}, más de las ${INNINGS} de un juego.`);
    else if (outs < (INNINGS - 1) * 3) warnings.push(`${team}: las entradas lanzadas suman ${fmtEL(outs)}; revisa si el juego se acortó.`);
  }
  return { errors, warnings };
}

/* Ganado, perdido y salvado: uno de cada uno en el juego, y del lado que corresponde. */
function decisionCheck(){
  const errors = [], warnings = [];
  const rowsA = (bx().pitch && bx().pitch.a) || [], rowsB = (bx().pitch && bx().pitch.b) || [];
  if (!rowsA.length && !rowsB.length) return { errors, warnings };
  const total = arr => arr.reduce((t, v) => t + (+v || 0), 0);
  const ta = total(bx().a), th = total(bx().h);
  const teamOf = s => s === "a" ? bx().away : bx().home;
  const tagged = [...rowsA.map(p => ({ p, side: "a" })), ...rowsB.map(p => ({ p, side: "b" }))];
  const who = x => `${normName(x.p.player) || "Un pitcher"} (${teamOf(x.side)})`;
  const by = d => tagged.filter(x => x.p.dec === d);
  const G = by("G"), P = by("P"), S = by("S");
  if (G.length > 1) errors.push(`Solo un pitcher se lleva el ganado; están marcados ${G.map(who).join(" y ")}.`);
  if (P.length > 1) errors.push(`Solo un pitcher carga con el perdido; están marcados ${P.map(who).join(" y ")}.`);
  if (S.length > 1) errors.push(`Solo un pitcher se lleva el salvado; están marcados ${S.map(who).join(" y ")}.`);
  if (ta === th){
    if (G.length || P.length || S.length) warnings.push("Con el marcador empatado no hay ganado, perdido ni salvado.");
    return { errors, warnings };
  }
  const win = ta > th ? "a" : "b", lose = win === "a" ? "b" : "a";
  G.filter(x => x.side === lose).forEach(x => errors.push(`${who(x)} no puede llevarse el ganado: su equipo perdió.`));
  S.filter(x => x.side === lose).forEach(x => errors.push(`${who(x)} no puede llevarse el salvado: su equipo perdió.`));
  P.filter(x => x.side === win).forEach(x => errors.push(`${who(x)} no puede cargar con el perdido: su equipo ganó.`));
  if ((win === "a" ? rowsA : rowsB).length && !G.some(x => x.side === win)) warnings.push(`Falta marcar quién se lleva el ganado (G) de ${teamOf(win)}.`);
  if ((lose === "a" ? rowsA : rowsB).length && !P.some(x => x.side === lose)) warnings.push(`Falta marcar quién carga con el perdido (P) de ${teamOf(lose)}.`);
  return { errors, warnings };
}

function pitchTable(side){
  const team = side === "a" ? bx().away : bx().home;
  if (!team) return "";
  const names = rosterOf(team);
  const slots = bx().sides[side] || [];
  const rows = bx().pitch[side];
  if (!names.length && !slots.length && !rows.length) return "";
  const known = new Set(names.map(nameKey));
  const reg = lineupRegistration(team, slots, rows);
  const opt = (v, label, sel) => `<option value="${esc(v)}"${sel ? " selected" : ""}>${esc(label)}</option>`;
  const body = rows.map((p, i) => {
    const key = `${side}|${i}`;
    const used = new Set(rows.filter((_, j) => j !== i).map(x => x.player));
    const typed = p.typed || !names.length || (!!p.player && !known.has(nameKey(p.player)));
    const st = (regOf(reg, p.player) || {}).st;
    const who = typed
      ? `<input type="text" class="luname" data-pi="${key}|player" value="${esc(p.player)}" maxlength="60" placeholder="Nombre del pitcher" aria-label="Pitcher ${i + 1} no registrado">${
          names.length ? `<button class="linkbtn" data-pilist="${key}" title="Elegir de los jugadores registrados">Lista</button>` : ""}`
      : `<select data-pi="${key}|player" aria-label="Pitcher ${i + 1}">${opt("", "Elige pitcher", !p.player)}${
          names.filter(n => n === p.player || !used.has(n)).map(n => opt(n, n, n === p.player)).join("")}${opt("__nuevo__", "+ Jugador no registrado…", false)}</select>`;
    return `<tr>
      <td class="ord num">${i + 1}</td>
      <td class="l"><span class="who">${who}<span class="${regTagClass(st)}" data-pitag="${key}">${st ? REG_LABEL[st] : ""}</span></span></td>
      <td><select data-pi="${key}|dec" aria-label="Decisión de ${esc(p.player || `el pitcher ${i + 1}`)}">${DECISIONS.map(([v, l]) => opt(v, l, v === p.dec)).join("")}</select></td>
      <td><input class="num el" data-pi="${key}|EL" inputmode="decimal" value="${esc(p.EL)}" aria-label="Entradas lanzadas de ${esc(p.player || `el pitcher ${i + 1}`)}"></td>
      ${PITCH_KEYS.map(k => `<td><input class="num" data-pi="${key}|${k}" inputmode="numeric" value="${p[k]}" aria-label="${esc(p.player || `Pitcher ${i + 1}`)} ${k}"></td>`).join("")}
      <td class="avg" data-piera="${key}">${fmtEra(p.CL, outsOf(p.EL))}</td>
      <td class="acts"><button class="linkbtn danger" data-pidel="${key}" aria-label="Quitar al pitcher ${i + 1}">Quitar</button></td>
    </tr>`;
  }).join("");
  const outs = rows.reduce((t, p) => t + (outsOf(p.EL) || 0), 0);
  const sum = k => rows.reduce((t, p) => t + (+p[k] || 0), 0);
  return `<div class="subhead"><h3 class="display">Pitcheo · ${esc(team)}</h3><span class="meta">Sus pitchers, contra el bateo del rival</span></div>
    ${rows.length ? `<div class="tablewrap"><table class="box lineup pitching">
      <thead><tr><th>#</th><th class="l">Pitcher</th><th title="Decisión: G ganado, P perdido, S salvado">Dec</th><th title="Entradas lanzadas">EL</th>${
        PITCH_KEYS.map(k => `<th>${k}</th>`).join("")}<th title="Efectividad a ${INNINGS} entradas">EFE</th><th></th></tr></thead>
      <tbody>${body}</tbody>
      <tfoot><tr><td></td><td class="l">Totales</td><td></td><td class="num" data-pisum="${side}|EL">${fmtEL(outs)}</td>${
        PITCH_KEYS.map(k => `<td class="num" data-pisum="${side}|${k}">${sum(k)}</td>`).join("")}<td class="num" data-pisum="${side}|EFE">${fmtEra(sum("CL"), outs)}</td><td></td></tr></tfoot>
    </table></div>` : `<p class="capnote">Sin pitchers capturados.</p>`}
    <div class="lineuptools">
      <button class="btn" data-piadd="${side}">+ Agregar pitcher</button>
      <span class="hint">EL = entradas lanzadas (6.1 = 6 entradas y 1 out) · C = carreras · CL = carreras limpias · EFE = efectividad a ${INNINGS} entradas · G ganado · P perdido · S salvado</span>
    </div>`;
}

/* Pitcheo en la hoja de anotación publicada. */
function pitchSheet(team, rows){

/* ---------------- captura ---------------- */
const capState = {
  a: SAMPLE_INN.a.slice(),       // equipo por entrada
  h: SAMPLE_INN.h.slice(),       // rival por entrada
  away: "Caimanes de Villas",
  home: (CAL.find(g => g.id === "hoy") || {}).b,   // el rival de hoy en el calendario
  cat: "novatos",
  sides: { a: [], b: [] },       // orden al bat de cada equipo
  boxSide: "a",                  // equipo que se ve en el orden al bat
  week: TODAY_WEEK,              // semana elegida en Capturar
  gameId: "hoy",                 // juego programado que se está capturando
  pitch: { a: [], b: [] },       // pitchers de cada equipo
};

/* En Capturar solo se ofrecen los juegos programados (sin resultado) de la semana. */
const capturable = week => calGames()
  .filter(g => g.w === week && g.st === "P")
  .sort((x, y) => (x.d + x.h + fieldOf(x)).localeCompare(y.d + y.h + fieldOf(y)));
const captureGame = () => calGames().find(g => g.id === capState.gameId && g.st === "P") || null;

/* Elegir un juego arma el orden al bat de ejemplo de los dos equipos con su roster. */
function setCaptureGame(g){
  capState.gameId = g ? g.id : null;
  if (g){ capState.week = g.w; capState.cat = g.c; }
  capState.away = g ? g.a : "";
  capState.home = g ? g.b : "";
  capState.a = Array(INNINGS).fill("");
  capState.h = Array(INNINGS).fill("");
  capState.sides = { a: defaultLineup(capState.away, "a"), b: defaultLineup(capState.home, "b") };
  capState.pitch = { a: defaultPitching("a", capState), b: defaultPitching("b", capState) };
  capState.boxSide = "a";
  capState.st = "F";             // F se jugó · FF forfit · NJ no se jugó
  capState.ff = "b";             // quién no se presentó
  capState.why = WHY_NJ[0];      // por qué no se jugó
}
setCaptureGame(CAL.find(g => g.id === "hoy") || null);
const capTotals = () => ({
  a: capState.a.reduce((x,v) => x + (+v || 0), 0),
  h: capState.h.reduce((x,v) => x + (+v || 0), 0),
});

/* Barra fija de la captura: el marcador, lo que falta y el botón de publicar, siempre a la vista. */
function capBar(){
  const g = captureGame();
  if (!g) return "";
  const t = capTotals();
  return `<div class="capbar" role="region" aria-label="Publicar el juego">
    <span class="cb-game">${crest(g.a)}<b>${esc(g.a)}</b><span class="cb-score num">${capState.st === "FF" ? (capState.ff === "a" ? "0–7" : "7–0")
      : capState.st === "NJ" ? "—" : `<span id="cb-a">${t.a}</span>–<span id="cb-h">${t.h}</span>`}</span><b>${esc(g.b)}</b>${crest(g.b)}</span>
    <span class="cb-status" id="cb-status">${capStatusHtml()}</span>
    <span class="cb-acts"><button class="btn primary" id="save"${captureErrors().length ? " disabled" : ""}>${capState.st === "FF" ? "Publicar forfit" : capState.st === "NJ" ? "Marcar como no jugado" : "Guardar y publicar"}</button></span>
  </div>`;

/* En lugar de carreras y box score: qué va a pasar con un forfit o un juego no jugado. */
function capStatusPanel(g){
  const ff = capState.st === "FF";
  const winner = g[capState.ff === "a" ? "b" : "a"];
  return `<div class="panel">
    <div class="panel-h"><h2 class="display"><span class="stepn">2</span>${ff ? "Forfit" : "Juego no jugado"}</h2><span class="meta">${ff ? "Sin carreras por entrada ni box score" : "Queda por reprogramar"}</span></div>

        : `<b>No se jugó: ${esc(capState.why)}.</b> No cuenta en la tabla${g.po ? " ni en la serie de playoffs" : ""} y queda en el calendario por reprogramar${g.po ? "; el juego vuelve a aparecer en Programar juegos" : ""}.`}</p>

/* Publicar un forfit o un juego no jugado: el resultado queda en el calendario, sin box score. */
function publishStatus(game){
  const base = CAL.find(x => x.id === game.id) || scheduled.find(x => x.id === game.id);
  if (!base) return;
  if (capState.st === "FF"){
    const ff = capState.ff;
    Object.assign(base, { st: "FF", ff, as: ff === "a" ? 0 : 7, bs: ff === "a" ? 7 : 0 });
    changedTeams = [game.a, game.b];
    currentCat = game.c;
    if (game.po) poCat = game.c;
    screen = game.po ? "playoffs" : "standing";
    render();
    window.scrollTo({ top: 0 });
    return toast(`Forfit registrado: ${game[ff]} no se presentó · ${game[ff === "a" ? "b" : "a"]} gana 7–0${game.po ? seriesToast(game) : ""}`);
  }
  Object.assign(base, { st: "NJ", why: capState.why, as: null, bs: null });
  if (game.po) poCat = game.c;
  calWeek = game.w; calCat = "todas"; openGame = null;
  screen = game.po ? "playoffs" : "calendario";
  render();
  window.scrollTo({ top: 0 });
  toast(`${game.a} vs ${game.b}: no se jugó (${capState.why}) · queda por reprogramar${game.po ? " en Programar juegos" : ""}`);
}

function capStatusHtml(){
  const { errors, warnings } = captureChecks();
  if (errors.length) return `<button class="cb-issue err" data-jump="lineup-checks">${plural(errors.length, "error", "errores")} por corregir</button>`;
  if (warnings.length) return `<button class="cb-issue warn" data-jump="lineup-checks">Se puede publicar · ${plural(warnings.length, "aviso", "avisos")}</button>`;
  return `<span class="cb-issue ok">✓ Listo para publicar</span>`;
}

/* Actualiza totales, promedios y revisiones mientras se teclea, sin redibujar la tabla. */
function recalcCapture(){
  const t = capTotals();
  const ta = document.getElementById("tot-a"), th = document.getElementById("tot-h");
  if (ta) ta.textContent = t.a;
  if (th) th.textContent = t.h;

  const side = bx().boxSide;
  const slots = (bx().sides && bx().sides[side]) || [];
  slots.forEach((s, i) => s.entries.forEach((e, k) => {
    const cell = document.querySelector(`[data-luavg="${side}|${i}|${k}"]`);
    if (cell) cell.textContent = e.VB ? fmtPct((+e.H || 0) / e.VB) : ".000";
  }));
  const sum = k => slots.reduce((u, s) => u + s.entries.reduce((v, e) => v + (+e[k] || 0), 0), 0);
  STAT_KEYS.forEach(k => {
    const cell = document.querySelector(`[data-lusum="${side}|${k}"]`);
    if (cell) cell.textContent = sum(k);
  });
  const avg = document.querySelector(`[data-lusum="${side}|AVG"]`);
  if (avg) avg.textContent = sum("VB") ? fmtPct(sum("H") / sum("VB")) : ".000";

  const boxTeam = side === "a" ? bx().away : bx().home;
  const prow = (bx().pitch && bx().pitch[side]) || [];
  const reg = boxTeam ? lineupRegistration(boxTeam, slots, prow) : new Map();
  const setCell = (sel, v) => { const cell = document.querySelector(sel); if (cell) cell.textContent = v; };
  prow.forEach((p, i) => {
    setCell(`[data-piera="${side}|${i}"]`, fmtEra(p.CL, outsOf(p.EL)));
    const tag = document.querySelector(`[data-pitag="${side}|${i}"]`);
    const st = (regOf(reg, p.player) || {}).st;
    if (tag){ tag.className = regTagClass(st); tag.textContent = st ? REG_LABEL[st] : ""; }
  });
  const pouts = prow.reduce((t, p) => t + (outsOf(p.EL) || 0), 0);
  const psum = k => prow.reduce((t, p) => t + (+p[k] || 0), 0);
  setCell(`[data-pisum="${side}|EL"]`, fmtEL(pouts));
  PITCH_KEYS.forEach(k => setCell(`[data-pisum="${side}|${k}"]`, psum(k)));
  setCell(`[data-pisum="${side}|EFE"]`, fmtEra(psum("CL"), pouts));
  document.querySelectorAll("[data-regtag]").forEach(el => {
    const [s, i, k] = el.dataset.regtag.split("|");
    const e = s === side && slots[+i] && slots[+i].entries[+k];
    if (!e) return;
    const st = e.kind === "reingreso" ? null : (regOf(reg, e.player) || {}).st;
    el.className = regTagClass(st);
    el.textContent = st ? REG_LABEL[st] : "";
  });
  const checks = document.getElementById("lineup-checks");
  if (checks) checks.innerHTML = lineupChecksHtml();
  const save = document.getElementById("save");
  if (save) save.disabled = !captureGame() || captureErrors().length > 0;
  const cbA = document.getElementById("cb-a"), cbH = document.getElementById("cb-h"), cbS = document.getElementById("cb-status");
  if (cbA) cbA.textContent = t.a;
  if (cbH) cbH.textContent = t.h;
  if (cbS) cbS.innerHTML = capStatusHtml();
  document.querySelectorAll("[data-boxstatus]").forEach(el => { el.outerHTML = boxTabStatus(el.dataset.boxstatus); });
  if (capMode === "corregir") refreshFix();
}

/* Publicar convierte el juego programado en resultado; la tabla y los resultados salen del calendario. */
function publish(){
  const t = capTotals();
  const game = captureGame();
  if (!game){ toast("Elige un juego programado para capturar"); return; }
  if (captureErrors().length){ toast("Revisa el orden al bat y el pitcheo antes de publicar"); return; }
  if (capState.st === "FF" || capState.st === "NJ") return publishStatus(game);
  const boxResult = finalizeBox(capState);
  captured = { id: game.id, cat: game.c, a: game.a, b: game.b, as: t.a, bs: t.h, h: game.h,
               innings: { a: capState.a.slice(), h: capState.h.slice() },
               sides: JSON.parse(JSON.stringify(capState.sides)),
               pitch: JSON.parse(JSON.stringify(capState.pitch)) };
  const base = CAL.find(x => x.id === game.id) || scheduled.find(x => x.id === game.id);
  if (base) Object.assign(base, { st: "F", as: t.a, bs: t.h });
  SEASON_BOXES[game.id] = { sides: cloneBox(capState.sides), pitch: cloneBox(capState.pitch), innings: { a: capState.a.slice(), h: capState.h.slice() } };
  published = true;
  changedTeams = [game.a, game.b];
  currentCat = game.c;
  resCat = "todas";
  if (game.po) poCat = game.c;
  screen = game.po ? "playoffs" : "standing";
  render();
  window.scrollTo({ top:0 });
  toast(`Juego publicado en ${catName(game.c)} — ${game.a} ${t.a}, ${game.b} ${t.h}${game.po ? seriesToast(game) : ""}${boxToast(boxResult)}`);
}

/* Rutas: #inicio, #demo, #liga y #master. La ruta vive en memoria; la URL solo se

function applyRoute(h){
  if (h === "demo" || h === "liga"){
    if (!booted || h !== appMode){
      appMode = h;
      screen = "inicio";
      resetDemo(true);
    }
    route = "app";
  } else {
    route = h === "master" ? "master" : "inicio";
  }
  booted = true;
  render();
  window.scrollTo({ top: 0 });
}
function openRoute(h){
  try { history.replaceState(null, "", "#" + h); } catch (e) { /* sin URL propia: la ruta sigue en memoria */ }

}
function bootRoute(){
  let h = "";
  try { h = location.hash.replace(/^#/, ""); } catch (e) { /* sin URL propia */ }
  applyRoute(h);
}

/* ---------------- administrar equipos ---------------- */
const allTeamNames = () => [...Object.values(TEAMS).flat(), ...withdrawn.map(w => w.team)];
const teamHasGames = team => calGames().some(g => g.a === team || g.b === team);

function openTeamForm(team){
  if (!team){
    teamForm = { original: null, name: "", cat: teamAdminCat, mgrKind: "otra", mgrPlayer: "", mgrName: "", roster: [], logo: null, confirmBaja: false };
    return;
  }
  const roster = (ROSTERS[team] || []).slice();
  const mgr = MANAGERS[team] || "";
  const isPlayer = roster.includes(mgr);
  teamForm = { original: team, name: team, cat: categoryOf(team), mgrKind: isPlayer ? "jugador" : "otra",
    mgrPlayer: isPlayer ? mgr : "", mgrName: isPlayer ? "" : mgr, roster, logo: TEAM_LOGOS[team] || null, confirmBaja: false };
}

function teamChecks(f){
  const errors = [], warnings = [];
  const name = f.name.trim();
  if (!name) errors.push("Escribe el nombre del equipo.");
  else if (name.toLowerCase() !== (f.original || "").toLowerCase() && allTeamNames().some(t => t.toLowerCase() === name.toLowerCase()))
    errors.push(`Ya existe un equipo llamado ${name}.`);
  const manager = f.mgrKind === "jugador" ? f.mgrPlayer : f.mgrName.trim();
  if (!manager) errors.push(f.mgrKind === "jugador" ? "Elige qué jugador es el manager." : "Escribe el nombre del manager.");
  const dup = f.roster.filter((p, i) => f.roster.findIndex(x => x.toLowerCase() === p.toLowerCase()) !== i);
  if (dup.length) errors.push(`Jugador repetido: ${[...new Set(dup)].join(", ")}.`);
  if (f.roster.length > ROSTER_MAX) errors.push(`El máximo es de ${ROSTER_MAX} jugadores por equipo (lleva ${f.roster.length}).`);
  if (f.roster.length < MIN_BATTERS) warnings.push(`Con ${plural(f.roster.length, "jugador", "jugadores")} no alcanza para un orden al bat de ${MIN_BATTERS}.`);
  const elsewhere = f.roster
    .map(p => [p, Object.keys(ROSTERS).find(t => t !== f.original && (ROSTERS[t] || []).includes(p))])
    .filter(([, t]) => t);
  if (elsewhere.length) warnings.push(`También aparecen en otro equipo: ${elsewhere.map(([p, t]) => `${p} (${t})`).join(", ")}.`);
  if (f.original && name && name !== f.original && teamHasGames(f.original)) warnings.push("El nombre nuevo también se aplica a su tabla, calendario y resultados.");
  return { errors, warnings };
}
function teamChecksHtml(f){
  const { errors, warnings } = teamChecks(f);
  return [...errors.map(e => `<li class="err">${esc(e)}</li>`), ...warnings.map(w => `<li class="warn">${esc(w)}</li>`)].join("")
    || `<li class="ok">Listo para guardar.</li>`;
}
function refreshTeamChecks(){
  const box = document.getElementById("team-checks");
  if (box) box.innerHTML = teamChecksHtml(teamForm);
  const save = document.querySelector("[data-teamsave]");
  if (save) save.disabled = teamChecks(teamForm).errors.length > 0;
}

/* Cambiar el nombre de un equipo lo cambia en todo lo que lo menciona. */
function renameTeam(old, neu){
  for (const c of Object.keys(TEAMS)) TEAMS[c] = TEAMS[c].map(t => t === old ? neu : t);
  const swap = g => { if (g.a === old) g.a = neu; if (g.b === old) g.b = neu; };
  CAL.forEach(swap);
  scheduled.forEach(swap);
  corrections.forEach(swap);
  if (captured) swap(captured);
  for (const obj of [ROSTERS, MANAGERS, TEAM_DUES, TEAM_DUES_DATA, TEAM_LOGOS])
    if (old in obj){ obj[neu] = obj[old]; delete obj[old]; }
  [ERA_LEADERS, ...Object.values(RIVAL_LEADERS)].flat().forEach(r => { if (r.t === old) r.t = neu; });
  if (capState.away === old) capState.away = neu;
  if (capState.home === old) capState.home = neu;
  for (const k of ["a", "b"]) if (schedForm[k] === old) schedForm[k] = neu;
  if (STATS_TEAM === old) STATS_TEAM = neu;
  if (openTeam === old) openTeam = neu;
  changedTeams = changedTeams.map(t => t === old ? neu : t);
}

function saveTeam(){
  const f = teamForm;
  if (teamChecks(f).errors.length) return;
  const name = f.name.trim().replace(/\s+/g, " ");
  const manager = f.mgrKind === "jugador" ? f.mgrPlayer : f.mgrName.trim();
  const isNew = !f.original;
  if (isNew){
    TEAMS[f.cat].push(name);
    TEAM_DUES[name] = null;
  } else {
    if (name !== f.original) renameTeam(f.original, name);
    const from = categoryOf(name);
    if (from && from !== f.cat && !teamHasGames(name)){
      TEAMS[from] = TEAMS[from].filter(t => t !== name);
      TEAMS[f.cat].push(name);
    }
  }
  if (f.roster.length) ROSTERS[name] = f.roster.slice(); else delete ROSTERS[name];
  MANAGERS[name] = manager;
  if (f.logo) TEAM_LOGOS[name] = f.logo; else delete TEAM_LOGOS[name];
  CATEGORIES.forEach(c => { c.teams = TEAMS[c.id].length; c.active = c.teams > 0; });
  teamAdminCat = categoryOf(name) || f.cat;
  openTeamForm(name);
  render();
  toast(isNew ? `${name} dado de alta en ${catName(teamAdminCat)}` : `${name}: cambios guardados`);
}

/* Regla de la liga: el equipo que se da de baja sale de la tabla y sus rivales conservan
   el resultado y la información de esos juegos. Sus juegos por jugar se quitan. */
function withdrawTeam(team){
  const cat = categoryOf(team);
  if (!cat) return;
  TEAMS[cat] = TEAMS[cat].filter(t => t !== team);
  let removed = 0;
  for (let i = CAL.length - 1; i >= 0; i--){
    const g = CAL[i];
    if (g.a !== team && g.b !== team) continue;
    if (g.st === "P"){ CAL.splice(i, 1); removed++; }
    else g.baja = g.a === team ? "a" : "b";
  }
  const before = scheduled.length;
  scheduled = scheduled.filter(g => g.a !== team && g.b !== team);
  removed += before - scheduled.length;
  withdrawn.push({ team, cat, at: TODAY });
  CATEGORIES.forEach(c => { c.teams = TEAMS[c.id].length; c.active = c.teams > 0; });
  if (capState.away === team || capState.home === team) setCaptureGame(null);
  if (openTeam === team) openTeam = null;
  teamForm = null;
  render();
  toast(`${team} dado de baja · sus rivales conservan los resultados${removed ? ` · ${plural(removed, "juego por jugar quitado", "juegos por jugar quitados")}` : ""}`);
}

/* ---------------- confirmaciones ---------------- */
let confirmAction = null;
function askConfirm({ title, body, ok = "Quitar", onConfirm }){
  const dialog = document.getElementById("confirm-dialog");
  document.getElementById("confirm-title").textContent = title;
  document.getElementById("confirm-body").textContent = body;
  document.getElementById("confirm-ok").textContent = ok;
  if (typeof dialog.showModal !== "function"){
    if (window.confirm(`${title}\n\n${body}`)) onConfirm();
    return;
  }
  confirmAction = onConfirm;
  dialog.returnValue = "";
  dialog.showModal();
  document.getElementById("confirm-ok").focus();
}
document.getElementById("confirm-dialog").addEventListener("close", e => {
  const action = confirmAction;
  confirmAction = null;
  if (e.target.returnValue === "ok" && action) action();
});

  { id:"rojo",     name:"Rojo",     accent:"#C8102E", rgb:"200,16,46",  ink:"#B00E28", inkDark:"#FF6B7F", tint:"#FCE3E6", tintDark:"#300A10", on:"#FFFFFF", soft:"#FFB3BD", deep:"#33070E", deepInk:"#FFD9DE" },
  { id:"azul",     name:"Azul",     accent:"#1D4ED8", rgb:"29,78,216",  ink:"#1D4ED8", inkDark:"#8AB0FF", tint:"#E3EBFD", tintDark:"#0E1A3A", on:"#FFFFFF", soft:"#B7CBFF", deep:"#0B1633", deepInk:"#D6E1FF" },
  { id:"amarillo", name:"Amarillo", accent:"#EAB308", rgb:"234,179,8",  ink:"#8A6400", inkDark:"#F5C94A", tint:"#FDF4D3", tintDark:"#2E2505", on:"#1A1400", soft:"#F7D774", deep:"#2B2204", deepInk:"#FBEBB5" },
  { id:"verde",    name:"Verde",    accent:"#15803D", rgb:"21,128,61",  ink:"#15803D", inkDark:"#4ADE80", tint:"#DCF3E4", tintDark:"#0B2616", on:"#FFFFFF", soft:"#A7F0C0", deep:"#06220F", deepInk:"#CFF5DC" },
];
let accentId = "vino";
let brandForm = null;            // personalización en curso, sin guardar

const accentVars = (a, dark) => `--accent:${a.accent}; --accent-rgb:${a.rgb}; --accent-ink:${dark ? a.inkDark : a.ink}; `
  + `--accent-tint:${dark ? a.tintDark : a.tint}; --on-accent:${a.on}; --pos:${dark ? a.inkDark : a.ink}; --pos-tint:${dark ? a.tintDark : a.tint}; `
  + `--accent-bright:${a.inkDark}; --accent-soft:${a.soft}; --accent-deep:${a.deep}; --accent-deep-ink:${a.deepInk};`;

function applyAccent(id){
  const a = ACCENTS.find(x => x.id === id) || ACCENTS[0];
  accentId = a.id;
  let el = document.getElementById("accent-style");
  if (!el){ el = document.createElement("style"); el.id = "accent-style"; document.head.appendChild(el); }
  el.textContent = `:root{${accentVars(a, false)}} :root[data-theme="dark"]{${accentVars(a, true)}}`;
}

function brandState(f){
  const errors = normName(f.name) ? [] : ["Escribe el nombre de la liga."];
  const changed = normName(f.name) !== LEAGUE.name || normName(f.sport) !== (LEAGUE.sport || "")
    || f.logo !== leagueLogo() || f.accent !== accentId;
  const hint = errors.length ? errors[0] : changed ? "Hay cambios sin guardar: se aplican a todo el sitio al guardar." : "Sin cambios por guardar.";
  return { errors, changed, hint };
}

function viewPersonalizar(){
  if (!brandForm) brandForm = { name: LEAGUE.name, sport: LEAGUE.sport || "", logo: leagueLogo(), accent: accentId };
  const f = brandForm;
  const a = ACCENTS.find(x => x.id === f.accent) || ACCENTS[0];
  const st = brandState(f);
  const logoImg = f.logo ? `<img src="${f.logo}" alt="">` : `<i class="fa-solid fa-baseball-bat-ball" aria-hidden="true"></i>`;
  const sub = [normName(f.sport), `Temporada ${LEAGUE.season}`].filter(Boolean).join(" · ");
  const full = [normName(f.name), normName(f.sport)].filter(Boolean).join(" ") || "Nombre de la liga";
  return `<div class="screen">
    <div class="page-head">
      <div>
        <p class="eyebrow">${esc(leagueFull())} · Administrador</p>
        <h1>Personalización</h1>
        <p class="sub">El logo, el nombre y el color de la liga. Al guardar se aplican a todo el sitio: navbar, portada, botones y footer.</p>
      </div>
    </div>

    <div class="brandgrid">
      <div class="stack">
        <section class="panel">
          <div class="panel-h"><h2 class="display"><span class="stepn">1</span>Logo</h2><span class="meta">PNG, JPG o WebP de máximo 1 MB</span></div>
          <div class="logoedit brandlogo">
            <span class="brandlogo-prev">${logoImg}</span>
            <div class="logoacts">
              <label class="btn" for="bf-logo"><i class="fa-solid fa-upload" aria-hidden="true"></i> ${f.logo ? "Cambiar logo" : "Subir logo"}</label>
              <input type="file" id="bf-logo" accept="image/png,image/jpeg,image/webp" hidden>
              ${f.logo ? `<button type="button" class="btn ghost" data-bflogoremove>Quitar logo</button>` : ""}
              <small class="fieldnote">Se muestra en círculo: funciona mejor un logo cuadrado, con fondo blanco o transparente.</small>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-h"><h2 class="display"><span class="stepn">2</span>Nombre</h2><span class="meta">Navbar, portada, footer y pestaña del navegador</span></div>
          <div class="form-row">
            <div class="field wide"><label for="bf-name">Nombre de la liga</label>
              <input type="text" id="bf-name" maxlength="40" value="${esc(f.name)}" placeholder="Ej. Liga Valle Alto"></div>
            <div class="field wide"><label for="bf-sport">Deporte o complemento</label>
              <input type="text" id="bf-sport" maxlength="24" value="${esc(f.sport)}" placeholder="Ej. Softbol"></div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-h"><h2 class="display"><span class="stepn">3</span>Color</h2><span class="meta">Color de acento del sitio</span></div>

            ${ACCENTS.map(x => `<button type="button" class="swatch" role="radio" aria-checked="${x.id === f.accent}" data-bfaccent="${x.id}" style="--sw:${x.accent}; --sw-on:${x.on}">
              <span class="chip"><i class="fa-solid fa-check" aria-hidden="true"></i></span>
              <span class="sn">${x.name}</span>${x.note ? `<small>${x.note}</small>` : ""}

      <div class="stack brandside">
        <section class="panel">
          <div class="panel-h"><h2 class="display">Vista previa</h2><span class="meta">${a.name}</span></div>
          <div class="brandprev" style="${accentVars(a, document.documentElement.dataset.theme === "dark")}">
            <div class="bp-nav">
              <span class="brand-logo">${logoImg}</span>
              <span class="brand-name"><b id="bp-name">${esc(normName(f.name) || "Nombre de la liga")}</b><small id="bp-sub">${esc(sub)}</small></span>
              <span class="bp-admin"><i class="fa-solid fa-sliders" aria-hidden="true"></i> Ajustes</span>
            </div>
            <div class="bp-hero">
              <div class="hero2-bg" aria-hidden="true"></div>
              <p class="hero2-kicker"><i class="fa-solid fa-baseball" aria-hidden="true"></i> Temporada ${esc(LEAGUE.season)} · ${esc(LEAGUE.year)}</p>
              <b class="bp-title" id="bp-full">${esc(full)}</b>
              <span class="btn cta"><i class="fa-solid fa-ranking-star" aria-hidden="true"></i> Ver standing</span>
            </div>
            <div class="bp-light">
              <span class="tab" aria-pressed="true">Novatos</span>
              <span class="tab">Femenil</span>
              <span class="pstag in">Clasificado</span>
              <span class="btn primary">Guardar y publicar</span>

          </div>
          <div class="savebar">
            <span class="hint" id="bf-hint">${esc(st.hint)}</span>
            <button type="button" class="btn ghost" data-bfreset${st.changed ? "" : " disabled"}>Descartar</button>
            <button type="button" class="btn primary" id="bf-save"${st.changed && !st.errors.length ? "" : " disabled"}>Guardar personalización</button>

        </section>
