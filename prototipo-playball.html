.bp-nav .brand-name b{font-size:14px}
.bp-nav .brand-name small{font-size:9px}
.bp-admin{margin-left:auto; display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:7px; background:var(--accent); color:var(--on-accent); font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; white-space:nowrap}
.bp-hero{position:relative; isolation:isolate; overflow:hidden; display:flex; flex-direction:column; align-items:flex-start; gap:10px; padding:20px; border-radius:12px; background:#121210; color:#fff}
.bp-hero .hero2-kicker{margin:0; font-size:10px}
.bp-title{font-family:"Archivo",sans-serif; font-variation-settings:"wdth" 125; font-weight:900; font-size:26px; line-height:.95; text-transform:uppercase; color:#fff; overflow-wrap:anywhere}
.bp-hero .btn.cta, .bp-light .btn, .bp-light .tab{pointer-events:none}
.bp-hero .btn.cta{padding:8px 13px; font-size:12px}
.bp-light{display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:12px; border-radius:10px; background:var(--surface); border:1px solid var(--line)}
.bp-light .pstag{margin-left:0}
.bp-light .btn{margin-left:auto}

/* ---------- nueva temporada ---------- */
.seasonnow .rulebody{justify-content:space-between}
.sdtext{width:100%; border:1px solid var(--line); background:var(--raised); color:var(--ink); border-radius:8px; padding:8px 10px; font:inherit; font-size:13.5px}
.sdtext:focus{border-color:var(--accent); outline:none}
.sdhelp{padding:14px 18px 12px}
.sdcat{border-top:1px solid var(--line)}
.sdcat-h{display:flex; flex-wrap:wrap; align-items:center; gap:6px 16px; padding:11px 18px; background:var(--ground)}
.sdcat-h h3{font-size:14px; letter-spacing:.06em}
.sdcat-h .meta{font-size:12px; color:var(--ink-3)}
.sdbulk{margin-left:auto; display:flex; gap:16px}
.sdempty{padding:12px 18px}
.sdlist{list-style:none; margin:0; padding:0}
.sdrow{display:grid; grid-template-columns:24px minmax(0,1fr) 140px 190px 170px 52px; align-items:center; gap:8px 14px; padding:9px 18px; border-top:1px solid var(--line); font-size:13.5px}
.sdrow.off .sdteam{opacity:.55}
.sdinc input, .sdopt input{width:16px; height:16px; margin:0; accent-color:var(--accent)}
.sdteam{display:flex; align-items:center; gap:10px; min-width:0}
.sdteam .crest{width:36px; height:36px; font-size:11.5px}
.sdname{display:flex; flex-direction:column; min-width:0}
.sdname b{font-weight:600}
.sdname small{font-size:11.5px; color:var(--ink-3); line-height:1.35}
.sdtag{display:inline-block; margin-left:7px; padding:1px 6px; border-radius:4px; font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; vertical-align:2px}
.sdtag.past{background:var(--ground); color:var(--ink-2); border:1px solid var(--line-2)}
.sdtag.new{background:var(--accent); color:var(--on-accent)}
.sdrow select, .sdadd select{border:1px solid var(--line); background:var(--raised); color:var(--ink); border-radius:8px; padding:7px 8px; font:inherit; font-size:13px}
.sdrow select:disabled{opacity:.5}
.sdopt{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-2); white-space:nowrap; cursor:pointer}
.sdopt.na{color:var(--ink-3)}
.sdadd{display:flex; flex-wrap:wrap; gap:8px; padding:14px 18px; border-top:1px solid var(--line)}
.sdadd .sdtext{flex:1; width:auto; min-width:220px}
.sdadd .btn{display:inline-flex; align-items:center; gap:7px}
.sdplayoffs{display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:12px; padding:16px 18px}
.sdpo{display:flex; flex-direction:column; align-items:flex-start; gap:8px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--raised)}
.sdpo b{font-family:"Archivo",sans-serif; font-variation-settings:"wdth" 112; font-weight:900; font-size:13px; letter-spacing:.06em; text-transform:uppercase}
.sdpo small{font-size:12px; color:var(--ink-3)}
.sdsummary{list-style:none; margin:0; padding:14px 18px 6px; display:flex; flex-direction:column; gap:8px; font-size:13.5px; line-height:1.45; color:var(--ink-2)}
.sdsummary li{display:flex; gap:10px}
.sdsummary i{flex:none; width:16px; margin-top:3px; color:var(--accent-ink)}
.sdsummary b{color:var(--ink); font-weight:600}
#sd-checks{margin:0; padding:8px 18px 16px}
.sdbar .cb-game > i{font-size:18px; color:var(--accent-ink)}
.sdbar .cb-game > span{font-size:13px; color:var(--ink-3); white-space:nowrap}
.archlist{list-style:none; margin:0; padding:0}
.archlist li{display:grid; grid-template-columns:170px 150px minmax(0,1fr); align-items:center; gap:6px 18px; padding:12px 18px; border-bottom:1px solid var(--line)}
.archlist .an{display:flex; flex-direction:column}
.archlist .an b{font-family:"Archivo",sans-serif; font-variation-settings:"wdth" 112; font-weight:900; font-size:14px; text-transform:uppercase}
.archlist .an small{font-size:11.5px; color:var(--ink-3)}
.archlist .ac{font-size:13px; color:var(--ink-2)}
.archlist .aw{display:flex; flex-wrap:wrap; gap:6px 20px; font-size:13px; color:var(--ink-2)}
.archlist .aw i{margin-right:6px; color:var(--accent-ink)}
.archlist .aw b{color:var(--ink); font-weight:600}
.archnote{padding:10px 18px 14px}
@media (max-width:1100px){
  .sdrow{grid-template-columns:24px minmax(0,1fr) auto; row-gap:6px}
  .sdrow > select, .sdrow > .sdopt{grid-column:2}
  .sdrow > :last-child{grid-column:3; grid-row:1}
  .archlist li{grid-template-columns:minmax(0,1fr)}
}

/* ---------- página de un juego ---------- */
.gp-top{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.gp-top .btn{display:inline-flex; align-items:center; gap:8px}
.gp-hero{position:relative; isolation:isolate; overflow:hidden; padding:22px 28px 26px; border-radius:18px; background:#121210; color:#F6F3E8; box-shadow:0 24px 50px -30px rgba(0,0,0,.75)}
.gp-meta{display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; font-size:12.5px; color:#CFCABA}
.gp-meta i{margin-right:4px; color:var(--accent-soft)}
.gp-meta .catbadge{margin-left:0; background:transparent; color:var(--accent-soft); border-color:color-mix(in srgb, var(--accent-soft) 45%, transparent)}
.gp-meta .stp{margin-left:auto}
.gp-board{display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:18px; margin-top:22px}
.gp-team{display:flex; flex-direction:column; align-items:center; gap:8px; padding:8px; border:0; border-radius:14px; background:none; color:#fff; text-align:center}
.gp-team:hover{background:rgba(255,255,255,.06)}
.gp-team .crest{width:116px; height:116px; font-size:34px}
.gp-team b{font-family:"Archivo",sans-serif; font-variation-settings:"wdth" 118; font-weight:900; font-size:clamp(17px, 2.2vw, 25px); line-height:1.05; text-transform:uppercase}
.gp-team small{font-size:12px; color:#A9A594}
.gp-team.lose b{color:#CFCABA}
.gp-score{display:flex; align-items:center; gap:14px; font-family:"Archivo",sans-serif; font-variation-settings:"wdth" 118; font-weight:900; font-size:clamp(46px, 7vw, 80px); line-height:1; color:#fff}
.gp-score i{font-style:normal; font-size:.5em; color:#77746A}
.gp-score .lose{color:#77746A}
.gp-score.vs{font-size:30px; letter-spacing:.2em; color:#A9A594}
.gp-notes{margin-top:18px; display:flex; flex-direction:column; gap:6px}
.gp-notes p{margin:0; display:flex; align-items:baseline; gap:8px; font-size:13px; color:#E9E6D8}
.gp-notes i{color:var(--accent-soft)}
.gp-sheet{background:transparent; border-bottom:0}
@media (max-width:640px){
  .gp-hero{padding:18px 16px 20px}
  .gp-team .crest{width:66px; height:66px; font-size:20px}
  .gp-board{gap:8px}
  .gp-meta .stp{margin-left:0}
}

/* ---------- historial de juegos ---------- */
.gamelist{list-style:none; margin:0; padding:0}
.gamelist li{display:grid; grid-template-columns:130px minmax(0,1fr) 160px auto; align-items:center; gap:8px 16px; padding:10px 18px; border-bottom:1px solid var(--line); font-size:13.5px}
.gamelist li:last-child{border-bottom:0}
.gl-when{display:flex; flex-direction:column}
.gl-when b{font-weight:600}
.gl-when small{font-size:11.5px; color:var(--ink-3)}
.gl-opp{display:flex; align-items:center; gap:9px; min-width:0}
.gl-opp small{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.gl-opp .crest{width:36px; height:36px; font-size:11.5px}
.gl-opp span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.gl-res{display:flex; align-items:center; gap:8px}
.gl-res b{font-family:"Archivo",sans-serif; font-variation-settings:"wdth" 112; font-weight:900; font-size:18px}
.gl-res small{font-size:11px; color:var(--warn-ink)}
.gres{display:inline-grid; place-items:center; min-width:24px; height:24px; padding:0 6px; border-radius:6px; font-size:11.5px; font-style:normal; font-weight:800}
.gres.g{background:var(--accent); color:var(--on-accent)}
.gres.p{background:var(--ground); color:var(--ink-2); box-shadow:inset 0 0 0 1px var(--line-2)}
.gres.e{background:var(--warn-tint); color:var(--warn-ink)}
.gres.nj, .gres.prog{min-width:0; padding:0 8px; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; background:transparent; color:var(--ink-3); box-shadow:inset 0 0 0 1px var(--line-2)}
.streak{display:inline-flex; gap:3px; margin-left:4px; vertical-align:middle}
.streak .gres{min-width:18px; height:18px; padding:0 4px; font-size:9.5px; border-radius:4px}
.gact i{margin-right:6px}
.rescard{cursor:pointer}
@media (max-width:760px){
  .gamelist li{grid-template-columns:minmax(0,1fr) auto}
  .gl-when{grid-column:1 / -1}
}

/* ---------- temporadas: selector en la navbar y franja de solo lectura ---------- */
.brand-home, .brand-title{background:none; border:0; padding:0; color:inherit; text-align:left; cursor:pointer}
.brand-home{flex:none; border-radius:50%}
.brand-title{display:block; min-width:0}
.brand-title b{display:block}
.brand-sub{display:flex; align-items:center; gap:6px; margin-top:4px; font-size:10px; font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:#B9B5A4; white-space:nowrap}
.brand-sub #brand-l2:empty{display:none}
.seasonsel{position:relative; display:inline-flex; align-items:center; gap:5px; cursor:pointer}
.seasonsel[hidden]{display:none}
.seasonsel i{font-size:10px; color:var(--accent-bright)}
.seasonsel select{
  appearance:none; -webkit-appearance:none; border:0; border-radius:4px; margin:0; padding:2px 14px 2px 2px;
  background-color:transparent; color:#F4F2E6; font:inherit; font-weight:700; letter-spacing:inherit; text-transform:inherit; cursor:pointer;
  background-image:linear-gradient(45deg, transparent 50%, #B9B5A4 50%), linear-gradient(135deg, #B9B5A4 50%, transparent 50%);
  background-position:right 5px center, right 1px center; background-size:4px 4px; background-repeat:no-repeat;
}
.seasonsel:hover select{color:#fff; background-color:rgba(255,255,255,.06)}
.seasonsel select:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.seasonsel select option{color:#14140F; background:#fff; text-transform:none; letter-spacing:0; font-weight:500}

.pastbar{position:sticky; top:73px; z-index:29; background:var(--warn-tint); color:var(--warn-ink); border-bottom:1px solid color-mix(in srgb, var(--warn) 45%, transparent)}
.pastbar[hidden]{display:none}
.pastbar-in{max-width:1440px; margin:0 auto; padding:9px 28px; display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; font-size:13.5px}
.pastbar-in > i{font-size:15px}
.pastbar-in b{font-weight:700}
.pastback{margin-left:auto; display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border:1px solid color-mix(in srgb, var(--warn) 55%, transparent); border-radius:8px; background:var(--raised); color:var(--ink); font-size:12.5px; font-weight:600}
.pastback:hover{border-color:var(--warn)}
.archlist li{grid-template-columns:170px 150px minmax(0,1fr) auto}
@media (max-width:1100px){
  .archlist li{grid-template-columns:minmax(0,1fr)}
  .archlist li .btn{justify-self:start}
}
@media (max-width:640px){
  .pastbar{top:65px}
  .pastbar-in{padding:8px 14px; font-size:12.5px}
  .brand-sub{letter-spacing:.12em}
}

/* ---------- página de un equipo ---------- */
.tp-hero{position:relative; isolation:isolate; overflow:hidden; border-radius:18px; background:#121210; color:#F6F3E8; box-shadow:0 24px 50px -30px rgba(0,0,0,.75)}
.tp-in{display:flex; align-items:center; gap:32px; padding:36px 42px 30px}
.tp-logo{width:160px; height:160px; flex:none; display:grid; place-items:center; overflow:hidden; border-radius:50%; background:#fff; box-shadow:0 0 0 6px rgba(255,255,255,.08), 0 22px 44px -18px rgba(0,0,0,.85)}
.tp-logo img{width:100%; height:100%; padding:12px; object-fit:contain; display:block}
.tp-logo.crestwrap{overflow:visible; background:transparent; box-shadow:none}
.tp-logo .crest{width:150px; height:150px; font-size:46px}
.tp-text{min-width:0}
.tp-hero h1{font-size:clamp(34px, 5.2vw, 64px); line-height:.94; font-variation-settings:"wdth" 125; font-weight:900; letter-spacing:-.015em; color:#fff; overflow-wrap:anywhere}
.tp-mgr{margin:14px 0 0; display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; font-size:14px; color:#CFCABA}
.tp-mgr b{color:#fff; font-weight:600}
.tp-mgr .pstag{margin-left:0}
.tp-streak{margin:12px 0 0; display:flex; align-items:center; gap:8px; font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:#A9A594}
.tp-stats b small{margin-left:2px; font-size:.5em; color:#A9A594}
.tp-next{align-items:center}
.tp-next .linkbtn{margin-left:auto; font-size:13px}
@media (max-width:820px){
  .tp-in{flex-direction:column; text-align:center; gap:18px; padding:28px 20px 22px}
  .tp-logo{width:120px; height:120px}
  .tp-logo .crest{width:112px; height:112px; font-size:34px}
  .tp-mgr, .tp-streak{justify-content:center}
}

/* ---------- navbar con una pestaña más: en pantallas medianas, sin íconos ---------- */
@media (min-width:1221px) and (max-width:1440px){
  .navlink{padding:0 10px}
  .navlink:not(.admin) i{display:none}
}

/* ---------- playoffs ---------- */
.po-note{align-items:center; flex-wrap:wrap}
.po-note .btn{margin-left:auto; display:inline-flex; align-items:center; gap:8px}
.po-champ{position:relative; isolation:isolate; overflow:hidden; display:flex; align-items:center; gap:24px; padding:24px 30px; border-radius:18px; background:#121210; color:#fff; box-shadow:0 24px 50px -30px rgba(0,0,0,.75)}
.po-champ > i{font-size:46px; color:#F5C94A}
.po-champ .hero2-kicker{margin:0 0 8px}
.po-champ-team{display:flex; align-items:center; gap:14px; padding:0; border:0; background:none; color:#fff; text-align:left}
.po-champ-team .crest{width:66px; height:66px; font-size:20px}
.po-champ-team b{font-family:"Archivo",sans-serif; font-variation-settings:"wdth" 125; font-weight:900; font-size:clamp(26px, 4vw, 42px); line-height:1; text-transform:uppercase}

.po-grid{display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:18px; align-items:start}
@media (max-width:1100px){ .po-grid{grid-template-columns:minmax(0,1fr)} }
.bracket{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(270px, 1fr); gap:16px; overflow-x:auto; padding:16px 18px 18px}
.po-round{display:flex; flex-direction:column; gap:10px; min-width:0}
.po-rname{padding:8px 12px; border-radius:9px; background:#151513; color:#F4F2E6; font-size:12.5px; letter-spacing:.1em; text-align:center}
.po-list{flex:1; display:flex; flex-direction:column; justify-content:space-around; gap:14px}

.po-series{overflow:hidden; border:1px solid var(--line); border-radius:12px; background:var(--raised); box-shadow:var(--shadow)}
.po-series.done{border-color:color-mix(in srgb, var(--accent) 40%, var(--line))}
.po-series.tbd{box-shadow:none; border-style:dashed; background:transparent}
.po-sh{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:7px 12px; border-bottom:1px solid var(--line); background:var(--ground); font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.po-status{font-size:12px; font-weight:600; letter-spacing:0; text-transform:none; color:var(--ink-2)}
.po-series.done .po-status{color:var(--accent-ink)}
.po-team{display:grid; grid-template-columns:26px minmax(0,1fr) 28px; align-items:center; gap:10px; padding:9px 12px}
.po-team + .po-team{border-top:1px solid var(--line)}
.po-seed{display:inline-grid; place-items:center; width:24px; height:24px; border-radius:6px; background:var(--ground); color:var(--ink-2); font-size:11.5px; font-weight:800; box-shadow:inset 0 0 0 1px var(--line-2)}
.po-name{display:flex; align-items:center; gap:9px; min-width:0; padding:0; border:0; background:none; color:var(--ink); font-size:14px; font-weight:600; text-align:left}
.po-name .crest{flex:none; width:36px; height:36px; font-size:11.5px}
.po-name > span{display:flex; flex-direction:column; min-width:0; overflow:hidden}
.po-name > span, .po-name small{white-space:nowrap; text-overflow:ellipsis}
.po-name small{overflow:hidden; font-size:11px; font-weight:500; color:var(--ink-3)}
.po-wins{font-family:"Archivo",sans-serif; font-variation-settings:"wdth" 112; font-weight:900; font-size:22px; text-align:right; color:var(--ink-3)}
.po-team.win .po-wins{color:var(--accent-ink)}
.po-team.win .po-seed{background:var(--accent); color:var(--on-accent); box-shadow:none}
.po-team.out{opacity:.5}
.po-team.tbd .po-name{font-weight:500; color:var(--ink-3)}
.po-games{display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:8px 12px; border-top:1px solid var(--line); background:color-mix(in srgb, var(--ground) 55%, transparent)}
.po-g{padding:2px 8px; border-radius:999px; box-shadow:inset 0 0 0 1px var(--line-2); font-size:11.5px; color:var(--ink-3)}
.po-g.done{color:var(--ink-2)}
.po-g b{font-family:"IBM Plex Mono",monospace; color:var(--ink)}
.po-games .linkbtn{margin-left:auto}
.po-cap{display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; padding:10px 12px; border-top:1px solid var(--line)}
.po-cap > span{margin-right:auto; font-size:12px; font-weight:600; color:var(--ink-2)}
.po-cap input{width:56px; padding:6px; border:1px solid var(--line); border-radius:7px; background:var(--surface); color:var(--ink); font-family:"IBM Plex Mono",monospace; font-size:14px; text-align:center}
.po-cap input:focus{border-color:var(--accent); outline:none}
.po-cap i{font-style:normal; color:var(--ink-3)}
.po-cap .btn{padding:6px 12px; font-size:12.5px}
.po-byenote{margin:0; padding:10px 12px; font-size:12px; color:var(--ink-3)}

.po-seeds{list-style:none; margin:0; padding:4px 0}
.po-seeds li{display:grid; grid-template-columns:26px 30px minmax(0,1fr) auto; align-items:center; gap:10px; padding:8px 18px; border-bottom:1px solid var(--line); font-size:14px}
.po-seeds li:last-child{border-bottom:0}
.po-seeds .crest{width:30px; height:30px; font-size:10px}
.po-sname{overflow:hidden; padding:0; border:0; background:none; color:var(--ink); font-weight:600; text-align:left; text-overflow:ellipsis; white-space:nowrap}
.po-seeds.outside li{opacity:.7}
.po-seeds .gb{font-size:12px; color:var(--ink-3)}
.po-cut{margin:0; padding:8px 18px; font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-ink); background:var(--accent-tint)}
.po-rule{justify-content:space-between; border-top:1px solid var(--line)}
.po-rule-acts{display:flex; flex-wrap:wrap; gap:8px}
.po-rule .btn, .po-rule-acts .btn{display:inline-flex; align-items:center; gap:8px}
.archlist .aw small{font-size:11px; color:var(--ink-3)}

/* ---------- tabla de bateo ordenable ---------- */
.sorthint{margin:0; padding:10px 16px 0; font-size:12px; color:var(--ink-3)}
.sortbtn{display:inline-flex; align-items:center; gap:4px; padding:0; border:0; background:none; color:inherit; font:inherit; letter-spacing:inherit; text-transform:inherit; cursor:pointer}
.sortbtn:hover{color:var(--ink)}
.sortbtn i{font-size:10px}
.box.stats th[aria-sort]{color:var(--accent-ink)}
.box.stats td.sorted{background:color-mix(in srgb, var(--accent-tint) 60%, transparent); font-weight:600}

/* ---------- calendario: el equipo lleva a su página ---------- */
button.gteam{margin:0; padding:0; border:0; background:none; color:inherit; font:inherit; text-align:inherit; cursor:pointer}
.game button.gteam:hover .nm{text-decoration:underline}
.game button.gteam:hover .crest{transform:scale(1.05)}
.game .gteam .crest{transition:transform .15s ease}

/* ---------- juegos de playoffs ---------- */
.potag{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px; background:var(--accent); color:var(--on-accent); font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap}
.potag i{font-size:9px}
.po-gamelist{list-style:none; margin:0; padding:8px 12px 10px; display:flex; flex-direction:column; gap:7px; border-top:1px solid var(--line); background:color-mix(in srgb, var(--ground) 55%, transparent)}
.po-gl{display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; font-size:12.5px; color:var(--ink-2)}
.po-gn{display:inline-grid; place-items:center; min-width:28px; height:22px; padding:0 6px; border-radius:6px; background:var(--raised); box-shadow:inset 0 0 0 1px var(--line-2); font-size:11px; font-weight:800; color:var(--ink-2)}
.po-gl.done .po-gn{background:var(--accent); color:var(--on-accent); box-shadow:none}
.po-gl b{font-family:"Archivo",sans-serif; font-variation-settings:"wdth" 112; font-weight:900; font-size:15px; color:var(--ink)}
.po-gl small{font-size:11px; color:var(--warn-ink)}
.po-gl.todo{color:var(--ink-3)}
.po-gl > .gact, .po-gl > .linkbtn{margin-left:auto}
.po-gl > .gact + .linkbtn{margin-left:0}
.po-sub{margin:0; padding:8px 18px; font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-ink); background:var(--accent-tint)}
.schedlist .potag{margin-left:auto}
.schedlist .potag + .catbadge{margin-left:0}

/* ---------- nueva temporada: columnas y cambio de categoría ---------- */
.sdrow.sdhead{padding-top:7px; padding-bottom:7px; background:transparent; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.sdtag.move{background:var(--warn-tint); color:var(--warn-ink); border:1px solid color-mix(in srgb, var(--warn) 45%, transparent)}
.sdtag.move i{font-size:8.5px; margin-right:2px}
@media (max-width:1100px){ .sdrow.sdhead{display:none} }

/* ---------- perfil del equipo: temporada anterior ---------- */
.tpast{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)) auto; align-items:stretch}
.tpast > div{display:flex; flex-direction:column; gap:5px; padding:16px 18px; border-right:1px solid var(--line)}
.tpast > div:last-child{border-right:0}
.tpast .k{font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.tpast .v{font-family:"Archivo",sans-serif; font-variation-settings:"wdth" 112; font-weight:900; font-size:23px; line-height:1.1; text-transform:uppercase}
.tpast .d{font-size:12.5px; color:var(--ink-2)}
.tpast .go{justify-content:center}
.tpast .go .btn{display:inline-flex; align-items:center; gap:8px; white-space:nowrap}
.pfin{align-self:flex-start; display:inline-flex; align-items:center; gap:7px; padding:5px 11px; border-radius:999px; font-size:12px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; white-space:nowrap}
.pfin.champ{background:#F5C94A; color:#1A1400}
.pfin.sub{background:var(--accent); color:var(--on-accent)}
.pfin.elim{background:var(--accent-tint); color:var(--accent-ink)}
.pfin.out, .pfin.open, .pfin.none{background:var(--ground); color:var(--ink-2); box-shadow:inset 0 0 0 1px var(--line-2)}
.tpast-note{margin:0; padding:16px 18px; font-size:13.5px; color:var(--ink-2)}
.tpast-list{list-style:none; margin:0; padding:0; border-top:1px solid var(--line)}
.tpast-list li{display:grid; grid-template-columns:140px 120px minmax(0,1fr) auto auto; align-items:center; gap:8px 16px; padding:10px 18px; border-bottom:1px solid var(--line); font-size:13.5px}
.tpast-list li:last-child{border-bottom:0}
@media (max-width:900px){
  .tpast{grid-template-columns:minmax(0,1fr)}
  .tpast > div{border-right:0; border-bottom:1px solid var(--line)}
  .tpast-list li{grid-template-columns:minmax(0,1fr) auto}
}

/* ---------- líderes: bateo y pitcheo ---------- */
.lead{box-shadow:var(--shadow); border-radius:14px}
.lead li.none{justify-content:center; padding:18px 14px; color:var(--ink-3); font-size:12.5px; text-align:center}
.lead li .who small{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.leadgrid + .section-label{margin-top:14px}

/* ---------- capturar: se jugó, forfit o no se jugó ---------- */
.cap-st-row{padding-top:0}
.capstatus{display:flex; align-items:flex-start; gap:14px; padding:18px}
.capstatus > i{flex:none; margin-top:2px; font-size:26px; color:var(--accent-ink)}
.capstatus p{margin:0; font-size:14px; line-height:1.55; color:var(--ink-2)}
.capstatus b{color:var(--ink)}
</style>

/* Totales por jugador de los box scores capturados de una categoría: bateo y pitcheo. */
function boxTotals(catId){
  const bat = new Map(), pit = new Map();
  for (const g of calGames()){
    if (g.c !== catId || g.st !== "F") continue;
    const box = boxOf(g);
    if (!box) continue;
    for (const side of ["a", "b"]){
      const team = g[side];
      for (const s of (box.sides && box.sides[side]) || []) for (const e of s.entries){
        const name = normName(e.player);
        if (!name) continue;
        const k = name + "|" + team;
        const r = bat.get(k) || { n: name, t: team, games: new Set(), VB: 0, H: 0, HR: 0, CP: 0 };
        r.games.add(g.id);
        for (const f of ["VB", "H", "HR", "CP"]) r[f] += +e[f] || 0;
        bat.set(k, r);
      }
      for (const p of (box.pitch && box.pitch[side]) || []){
        const name = normName(p.player);
        if (!name) continue;
        const k = name + "|" + team;
        const r = pit.get(k) || { n: name, t: team, outs: 0, CL: 0, K: 0, G: 0, P: 0, S: 0 };
        r.outs += outsOf(p.EL) || 0;
        r.CL += +p.CL || 0;
        r.K += +p.K || 0;
        if (p.dec === "G" || p.dec === "P" || p.dec === "S") r[p.dec]++;
        pit.set(k, r);
      }
    }
  }
  return { bat: [...bat.values()].map(({ games, ...r }) => ({ ...r, JJ: games.size })), pit: [...pit.values()] };
}

/* Jugadores de una categoría con sus totales: los de ejemplo (demo, temporada 19, Novatos) más los capturados. */
function leaderPools(catId){
  const sample = appMode === "demo" && !seasonsCreated && !viewingSeason && catId === mainCat().id;
  const bat = new Map(), pit = new Map();
  if (sample){
    for (const p of CAIMANES_ROSTER) bat.set(p.name + "|" + STATS_TEAM, { n: p.name, t: STATS_TEAM, JJ: p.JJ, VB: p.VB, H: p.H, HR: p.HR, CP: p.CP });
    for (const p of ERA_LEADERS) pit.set(p.n + "|" + p.t, { ...p });
  }
  const box = boxTotals(catId);
  for (const r of box.bat){
    const k = r.n + "|" + r.t, cur = bat.get(k);
    if (cur) for (const f of ["JJ", "VB", "H", "HR", "CP"]) cur[f] += r[f];
    else bat.set(k, { ...r });
  }
  for (const r of box.pit){
    const k = r.n + "|" + r.t, cur = pit.get(k);
    if (cur) for (const f of ["outs", "CL", "K", "G", "P", "S"]) cur[f] = (cur[f] || 0) + r[f];
    else pit.set(k, { ...r });
  }
  return { sample, bat: [...bat.values()], pit: [...pit.values()], rivals: sample ? RIVAL_LEADERS : { avg: [], CP: [], HR: [] } };
}

/* Los 5 primeros de una estadística. Efectividad de menor a mayor; lo demás de mayor a menor. */
function leaderList(pools, key){
  const MIN_OUTS = 9;   // efectividad: mínimo 3 entradas lanzadas
  const era = r => r.CL * INNINGS * 3 / r.outs;
  const defs = {
    avg: { rows: pools.bat.filter(p => p.VB > 0 && p.VB >= p.JJ * 2.1).map(p => ({ ...p, v: p.H / p.VB, extra: `${p.H} de ${p.VB}` })).concat(pools.rivals.avg), txt: v => fmtPct(v) },
    CP:  { rows: pools.bat.filter(p => p.CP > 0).map(p => ({ ...p, v: p.CP })).concat(pools.rivals.CP), txt: v => String(v) },
    HR:  { rows: pools.bat.filter(p => p.HR > 0).map(p => ({ ...p, v: p.HR })).concat(pools.rivals.HR), txt: v => String(v) },
    EFE: { rows: pools.pit.filter(p => p.outs >= MIN_OUTS).map(p => ({ ...p, v: era(p), extra: `${fmtEL(p.outs)} EL` })), txt: v => v.toFixed(2), asc: true },
    G:   { rows: pools.pit.filter(p => p.G > 0).map(p => ({ ...p, v: p.G, extra: `${p.G}-${p.P}` })), txt: v => String(v) },
    K:   { rows: pools.pit.filter(p => p.K > 0).map(p => ({ ...p, v: p.K, extra: `${fmtEL(p.outs)} EL` })), txt: v => String(v) },
    EL:  { rows: pools.pit.filter(p => p.outs > 0).map(p => ({ ...p, v: p.outs })), txt: v => fmtEL(v) },
  }[key];
  return defs.rows
    .sort((a, b) => (defs.asc ? a.v - b.v : b.v - a.v) || a.n.localeCompare(b.n))
    .slice(0, 5)
    .map(r => ({ ...r, txt: defs.txt(r.v) }));
}

/* tono de escudo derivado del nombre, estable entre renders.
   Solo el matiz; la saturación y la luminosidad las pone el tema. */
function crestHue(name){
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  return h;
}
function initials(name){
  const skip = new Set(["de","del","la","los","las"]);
  const w = name.split(" ").filter(x => !skip.has(x.toLowerCase()));
  return (w.length > 1 ? w[0][0] + w[1][0] : w[0].slice(0, 2)).toUpperCase();
}
/* Si el equipo ya subió su escudo se usa; si no, escudo genérico con iniciales. */
const SHIELD = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.2 20.8 3.9V11.3C20.8 16.9 17.1 20.6 12 22.8 6.9 20.6 3.2 16.9 3.2 11.3V3.9Z"/></svg>';
const crest = n => TEAM_LOGOS[n]
  ? `<span class="crest crest-img"><img src="${TEAM_LOGOS[n]}" alt=""></span>`
  : `<span class="crest" style="--h:${crestHue(n)}" aria-hidden="true">${SHIELD}<b>${initials(n)}</b></span>`;
const pct = t => t.JJ ? ((t.JG + t.JE * 0.5) / t.JJ) : 0;
const fmtPct = v => v.toFixed(3).replace(/^0/, "");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

const categoryOf = team => Object.keys(TEAMS).find(c => TEAMS[c].includes(team));

/* La tabla sale de los juegos: finales y forfits, más lo que se capture. */
function tableFor(catId){
  const rows = Object.fromEntries((TEAMS[catId] || []).map(team =>
    [team, { team, JJ:0, JG:0, JE:0, JP:0, CF:0, CC:0 }]));
  for (const g of calGames()){
    if (g.c !== catId || !isPlayed(g) || g.po) continue;
    const ws = winnerSide(g);
    for (const side of ["a", "b"]){
      const r = rows[g[side]];
      if (!r) continue;
      const other = side === "a" ? "b" : "a";
      r.JJ++;
      if (!ws) r.JE++; else if (ws === side) r.JG++; else r.JP++;
      r.CF += g[side + "s"] ?? 0;
      r.CC += g[other + "s"] ?? 0;
    }
  }
  return Object.values(rows);
}

/* Criterio de desempate fijo: más ganados → menos perdidos → mejor diferencia → más carreras */
function ordered(catId = currentCat){
  const list = tableFor(catId);
  if (sortKey === "default"){
    list.sort((a,b) =>
      b.JG - a.JG ||
      a.JP - b.JP ||
      (b.CF - b.CC) - (a.CF - a.CC) ||
      b.CF - a.CF);
  } else {
    const val = { dif: t => t.CF - t.CC, cf: t => t.CF, cc: t => -t.CC }[sortKey] || (t => t.JG);
    list.sort((a,b) => val(b) - val(a));
  }
  return list;
}

/* Con la temporada regular de SEASON.games juegos: quién ya aseguró lugar en playoffs y quién
   ya no alcanza. Cuenta conservadora por juegos ganados: un empate en ganados no se da por resuelto. */
function playoffStatus(catId){
  const P = playoffsFor(catId);
  const rows = tableFor(catId);
  const out = {};
  if (!P || P >= rows.length) return out;
  const maxWins = r => r.JG + Math.max(0, SEASON.games - r.JJ);
  for (const r of rows){
    const others = rows.filter(o => o !== r);
    if (others.filter(o => o.JG > maxWins(r)).length >= P) out[r.team] = "out";
    else if (others.filter(o => maxWins(o) >= r.JG).length < P) out[r.team] = "in";
  }
  return out;
}

function adminTodo(){
  if (isVisitor() || !Object.values(TEAMS).flat().length) return "";

  const due = calGames().filter(g => g.st === "P" && g.d <= TODAY).sort((x, y) => (x.d + x.h).localeCompare(y.d + y.h));
  const left = CATEGORIES.reduce((n, c) => {

/* ---------------- estadísticas de bateo ordenables ---------------- */
let statSort = { key: "AVG", dir: -1 };  // columna y sentido de la tabla de bateo

function batStatsTable(team, teamJJ){
  const val = (p, k) => k === "AVG" ? (p.VB ? p.H / p.VB : 0) : k === "name" ? p.name : p[k];
  const rows = [...CAIMANES_ROSTER].sort((a, b) => {
    const x = val(a, statSort.key), y = val(b, statSort.key);
    const c = typeof x === "string" ? x.localeCompare(y) : x - y;
    return c * statSort.dir || a.name.localeCompare(b.name);
  });
  const cols = [["name", "Jugador"], ...BAT_COLS, ["AVG", "AVG"]];
  const th = ([k, label]) => {
    const on = statSort.key === k;
    return `<th class="${k === "name" ? "l" : ""}"${on ? ` aria-sort="${statSort.dir < 0 ? "descending" : "ascending"}"` : ""}>
      <button type="button" class="sortbtn" data-statsort="${k}" title="Ordenar por ${esc(label)}">${esc(label)}${on ? `<i class="fa-solid fa-caret-${statSort.dir < 0 ? "down" : "up"}" aria-hidden="true"></i>` : ""}</button></th>`;
  };
  const cell = (k, content, cls = "num") => `<td class="${cls}${statSort.key === k ? " sorted" : ""}">${content}</td>`;
  const sum = k => CAIMANES_ROSTER.reduce((a, p) => a + p[k], 0);
  return `<p class="sorthint">Toca una columna para ordenar por esa estadística; otra vez para invertir el orden.</p>
    <div class="tablewrap"><table class="box stats">
      <thead><tr>${cols.map(th).join("")}</tr></thead>
      <tbody>${rows.map(p => `<tr>
        ${cell("name", `${esc(p.name)}${p.name === MANAGERS[team] ? `<span class="mgrtag">Manager</span>` : ""}`, "l")}
        ${BAT_COLS.map(c => cell(c[0], p[c[0]])).join("")}
        ${cell("AVG", fmtPct(p.VB ? p.H / p.VB : 0), "avg")}
      </tr>`).join("")}</tbody>
      <tfoot><tr>
        <td class="l">Totales del equipo</td>
        ${BAT_COLS.map(c => `<td class="num">${c[0] === "JJ" ? teamJJ : sum(c[0])}</td>`).join("")}
        <td class="num">${fmtPct(sum("H") / sum("VB"))}</td>
      </tr></tfoot>
    </table></div>`;
}

/* ---------------- perfil: temporadas anteriores ---------------- */
/* Temporadas archivadas anteriores a la que se está viendo, de la más reciente a la más vieja. */
function seasonsBefore(){
  if (!viewingSeason) return SEASON_ARCHIVE;
  const i = SEASON_ARCHIVE.findIndex(s => s.season === viewingSeason);
  return i < 0 ? [] : SEASON_ARCHIVE.slice(i + 1);
}

/* Hasta dónde llegó un equipo en los playoffs de una temporada archivada. */
function playoffFinish(team, s, cat){
  const po = s.po;
  if (!po || !po.closed || !po.cats[cat]) return { cls: "none", txt: "Sin playoffs", detail: "Esa temporada no tuvo playoffs publicados" };
  const seeds = po.cats[cat].seeds;
  const seed = seeds.find(x => x.team === team);
  if (!seed) return { cls: "out", txt: "No clasificó", detail: `Clasificaban los ${seeds.length} primeros` };
  const br = buildBracket(cat, seeds, { ...po.results, ...derivedResults(cat, s.games || []) });
  if (br.champion && br.champion.team === team) return { cls: "champ", txt: "Campeón", detail: `Sembrado ${seed.seed} de ${seeds.length}` };
  for (const rd of br.rounds){
    const sr = rd.series.find(x => !x.placeholder && (x.hi.team === team || x.lo.team === team));
    if (!sr) continue;
    if (!sr.winner) return { cls: "open", txt: `Llegó a ${rd.name.toLowerCase()}`, detail: "La serie no se terminó de jugar" };
    if (sr.winner.team !== team){
      const mine = sr.hi.team === team ? sr.wins.hi : sr.wins.lo, theirs = sr.hi.team === team ? sr.wins.lo : sr.wins.hi;
      return rd.name === "Final"
        ? { cls: "sub", txt: "Subcampeón", detail: `Perdió la final ${mine}–${theirs} ante ${sr.winner.team}` }
        : { cls: "elim", txt: `Eliminado en ${rd.name.toLowerCase()}`, detail: `Cayó ${mine}–${theirs} ante ${sr.winner.team} · sembrado ${seed.seed}` };
    }
  }
  return { cls: "open", txt: "Clasificó", detail: `Sembrado ${seed.seed} de ${seeds.length}` };
}

/* Lo que hizo un equipo en una temporada archivada, o null si no jugó. */
function teamSeasonSummary(team, s){
  const info = s.teamInfo[team];
  if (!info) return null;
  const rows = s.categories[info.cat] || [];
  const row = rows.find(r => r.team === team);
  return {
    s, cat: info.cat,
    place: row ? `${row.place}º de ${rows.length}` : info.baja ? "Se dio de baja" : "—",
    rec: row ? `${row.JG}-${row.JP}${row.JE ? `-${row.JE}` : ""}` : "",
    fin: info.baja ? { cls: "none", txt: "Se dio de baja", detail: "" } : playoffFinish(team, s, info.cat),
  };
}

  const past = seasonsBefore();

  const FIN_ICON = { champ: "fa-trophy", sub: "fa-medal", elim: "fa-flag", out: "fa-circle-minus", open: "fa-sitemap", none: "fa-minus" };
  const fin = f => `<span class="pfin ${f.cls}"><i class="fa-solid ${FIN_ICON[f.cls]}" aria-hidden="true"></i>${esc(f.txt)}</span>`;
  const older = sums.filter(x => x.s !== prev);
  return `<section class="panel">
    <div class="panel-h">

/* Resultado de un juego visto desde un equipo: G/P/E con marcador, o su estado. */
function resultFor(team, g){
  const me = g.a === team ? "a" : "b", them = me === "a" ? "b" : "a";
  if (g.st === "NJ") return `<span class="gres nj">No se jugó</span>`;
  if (!isPlayed(g)) return `<span class="gres prog">${g.d === TODAY ? "Hoy" : g.d < TODAY ? "Sin resultado" : "Programado"}</span>`;
  const ws = winnerSide(g);
  const k = !ws ? "e" : ws === me ? "g" : "p";
  return `<span class="gres ${k}">${k.toUpperCase()}</span>${g.as == null ? "" : `<b class="num">${g[me + "s"]}–${g[them + "s"]}</b>`}${g.st === "FF" ? `<small>forfit</small>` : ""}`;
}

function teamGameRows(team, games){
  return `<ul class="gamelist">${games.map(g => {
    const them = g.a === team ? g.b : g.a;
    return `<li>
      <span class="gl-when"><b>${DIAS[parseD(g.d).getUTCDay()].slice(0, 3)} ${fmtDay(g.d)}</b><small>${g.po ? `${esc(g.po.round)} · J${g.po.n}` : `Semana ${g.w}`} · ${g.h}</small></span>
      <span class="gl-opp"><small>vs</small>${crest(them)}<span>${esc(them)}</span></span>
      <span class="gl-res">${resultFor(team, g)}</span>
      <button type="button" class="gact" data-viewgame="${g.id}"><i class="fa-solid fa-circle-info" aria-hidden="true"></i>Ver juego</button>
    </li>`;
  }).join("")}</ul>`;
}

function teamGamesPanel(team){
  const games = calGames().filter(g => g.a === team || g.b === team).sort((x, y) => (x.d + x.h).localeCompare(y.d + y.h));
  const played = games.filter(isPlayed);
  const last = played.slice(-5).map(g => { const ws = winnerSide(g); return !ws ? "e" : ws === (g.a === team ? "a" : "b") ? "g" : "p"; });
  const upcoming = games.filter(g => g.st === "P" && g.d >= TODAY).length;
  return `<section class="panel" id="team-games">
    <div class="panel-h">
      <h2 class="display">Juegos de la temporada ${esc(LEAGUE.season)}</h2>

    </div>
    ${games.length ? (games.some(g => g.po)
        ? `${teamGameRows(team, games.filter(g => !g.po))}<p class="po-sub">Playoffs</p>${teamGameRows(team, games.filter(g => g.po))}`

      : `<div class="empty"><strong>Sin juegos todavía</strong><span>Cuando se programe su primer juego, aparece aquí.</span></div>`}

}

    <section class="gp-hero">

/* ---------------- calendario ---------------- */
let calWeek = null;              // null = la semana en curso
let calCat = "todas";            // categoría del calendario, o todas
let openGame = null;             // juego con la hoja de anotación desplegada

const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const DIAS  = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const DAY_MS = 864e5;
const parseD = s => new Date(s + "T12:00:00Z");
const fmtDay = s => { const d = parseD(s); return `${d.getUTCDate()} ${MESES[d.getUTCMonth()]}`; };
const weekOf = s => Math.floor((parseD(s) - parseD(WEEK1)) / (7 * DAY_MS)) + 1;
let TODAY_WEEK = weekOf(TODAY);
const isPlayed = g => g.st === "F" || g.st === "FF";
const listJoin = xs => xs.length > 1 ? `${xs.slice(0, -1).join(", ")} y ${xs[xs.length - 1]}` : (xs[0] || "");
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const fieldOf = g => (CATEGORIES.find(c => c.id === g.c) || {}).field || "";

function weekRange(w){
  const a = new Date(parseD(WEEK1).getTime() + (w - 1) * 7 * DAY_MS);
  const b = new Date(a.getTime() + 6 * DAY_MS);
  return a.getUTCMonth() === b.getUTCMonth()
    ? `${a.getUTCDate()}–${b.getUTCDate()} ${MESES[b.getUTCMonth()]}`
    : `${a.getUTCDate()} ${MESES[a.getUTCMonth()]} – ${b.getUTCDate()} ${MESES[b.getUTCMonth()]}`;
}

/* Días, horarios y campo de cada categoría, como los fijó la liga. */
function catSchedule(c){
  const parts = [];
  if (c.days) parts.push(c.days);
  if (c.times) parts.push(listJoin(c.times));
  parts.push(c.field + (c.shares ? `, compartido con ${catName(c.shares)}` : ""));
  return parts.join(" · ");
}

/* Qué categorías usa cada campo, para la vista de todas. */
function fieldLine(){
  const byField = {};
  for (const c of CATEGORIES){
    (byField[c.field] = byField[c.field] || []).push(c.days === "Sábados y domingos" ? `${c.name} (fines de semana)` : c.name);
  }
  return Object.entries(byField).map(([f, names]) => `${f}: ${listJoin(names)}`).join(" · ");
}

/* Opciones de Capturar según la categoría: sus horarios y sus equipos. */
function hourOptions(catId){
  const c = CATEGORIES.find(x => x.id === catId) || mainCat();
  return (c.times || ["19:00", "21:00"]).map((h, i) => `<option${i === 0 ? " selected" : ""}>${h}</option>`).join("");
}
function teamOptions(catId, selected){
  return (TEAMS[catId] || []).map(team => `<option${team === selected ? " selected" : ""}>${esc(team)}</option>`).join("");
}

/* El calendario más el juego que se capture en la demo. Si coincide con uno
   programado para hoy, lo reemplaza; si no, se agrega como juego nuevo. */
/* El calendario más lo que se programe en la demo; el juego capturado pasa a Final y las
   correcciones del administrador se aplican encima (la última de cada juego manda). */
function calGames(){
  let games = scheduled.length ? CAL.concat(scheduled) : CAL;
  if (captured) games = games.map(g => g.id === captured.id ? { ...g, st: "F", as: captured.as, bs: captured.bs, fresh: true } : g);
  if (!corrections.length) return games;
  const latest = {};
  for (const c of corrections) latest[c.id] = c;
  return games.map(g => {
    const c = latest[g.id];
    if (!c) return g;
    const { as, bs, ff, why, ...rest } = g;
    const out = { ...rest, st: c.after.st, fixed: c };
    if (c.after.as != null){ out.as = c.after.as; out.bs = c.after.bs; }
    if (c.after.ff) out.ff = c.after.ff;
    if (c.after.why) out.why = c.after.why;
    return out;
  });
}

function winnerSide(g){
  if (g.st === "FF") return g.ff === "a" ? "b" : "a";
  if (g.as == null) return g.win || null;
  return g.as > g.bs ? "a" : g.bs > g.as ? "b" : null;
}

const nextGames = () => calGames()
  .filter(g => g.st === "P" && g.d >= TODAY)
  .sort((x, y) => (x.d + x.h + fieldOf(x)).localeCompare(y.d + y.h + fieldOf(y)))
  .slice(0, 4);

function gameSide(g, side, ws){
  const cls = ws ? (ws === side ? " win" : " lose") : "";
  return `<button type="button" class="gteam ${side}${cls}" data-team="${esc(g[side])}" title="Ver a ${esc(g[side])}">${crest(g[side])}<span class="nm">${esc(g[side])}</span></button>`;
}

function gameRow(g, showCat){
  const played = isPlayed(g);
  const ws = played ? winnerSide(g) : null;

  let score;
  if (played && g.as != null){
    score = `<span class="gscore"><span class="${ws === "b" ? "lose" : ""}">${g.as}</span><span class="dash">–</span><span class="${ws === "a" ? "lose" : ""}">${g.bs}</span></span>`;
  } else {
    score = `<span class="gscore none">${played || g.st === "NJ" ? "—" : "vs"}</span>`;
  }

  const canEdit = !isLocked() && !isVisitor();
  const sheetBtn = "";   // la hoja de anotación vive en la página del juego
  const acts = [];
  if (isPlayed(g) || g.st === "NJ" || g.d < TODAY)
    acts.push(`<button class="gact" data-viewgame="${g.id}"><i class="fa-solid fa-circle-info" aria-hidden="true"></i>Ver juego</button>`);
  let st;
  if (g.fresh && g.st === "F"){
    st = `<span class="stp hoy">Recién capturado</span>${sheetBtn}`;
  } else if (g.st === "F"){
    st = `<span class="stp">Final</span>${g.as == null ? `<small>Marcador sin capturar</small>` : ""}${sheetBtn}${
      g.baja ? `<small>${esc(g[g.baja])} se dio de baja · el resultado se conserva</small>` : ""}${
      g.rep ? `<a href="${esc(g.rep)}" target="_blank" rel="noopener">Ver repetición ↗</a>` : ""}`;
  } else if (g.st === "FF"){
    st = `<span class="stp ff">Forfit</span><small>${esc(g[g.ff])} no se presentó</small>`;
  } else if (g.st === "NJ"){
    st = `<span class="stp nj">No se jugó</span><small>${esc(g.why)} · por reprogramar</small>`;
  } else if (g.d <= TODAY){
    st = g.d === TODAY ? `<span class="stp hoy">Hoy</span>` : `<span class="stp pend">Sin resultado</span>`;
    if (canEdit) acts.push(`<button class="gact primary" data-capture="${g.id}">Capturar resultado</button>`);
  } else {
    st = `<span class="stp prog">Programado</span>`;
  }
  if (g.fixed && g.fixed.reason) st += `<small class="fixednote">Corregido: ${esc(g.fixed.reason)}</small>`;
  if (canEdit && (isPlayed(g) || g.st === "NJ")) acts.push(`<button class="gact" data-fixgame="${g.id}">Corregir</button>`);
  if (acts.length) st += `<span class="gacts">${acts.join("")}</span>`;
  const badge = showCat ? `<span class="catbadge">${esc(catName(g.c))}</span>` : "";

  return `<div class="game${g.st === "NJ" ? " nj" : ""}">
      <span class="ghr">${g.h}</span>
      ${gameSide(g, "a", ws)}${score}${gameSide(g, "b", ws)}
      <span class="gst">${g.po ? `<span class="potag"><i class="fa-solid fa-trophy" aria-hidden="true"></i>${esc(g.po.round)} · J${g.po.n}</span>` : ""}${badge}${st}</span>
    </div>${openGame === g.id ? scoreSheet(g) : ""}`;
}

/* Hoja de anotación de un juego con box score (capturado o corregido): marcador por entradas
   si cuadra con el resultado, orden al bat con cambios y reingresos, y pitcheo. */
function battingSheet(team, slots){
  if (!slots || !slots.length) return `<p class="capnote">${esc(team)}: sin orden al bat, solo marcador.</p>`;
  const sum = k => slots.reduce((t, s) => t + s.entries.reduce((u, e) => u + (+e[k] || 0), 0), 0);
  return `<div class="tablewrap"><table class="box">
      <thead><tr><th class="l">Bateo · ${esc(team)}</th><th>Pos</th>${STAT_KEYS.map(s => `<th>${STAT_LABEL[s] || s}</th>`).join("")}<th>AVG</th></tr></thead>
      <tbody>${slots.map((s, i) => s.entries.map((e, k) => `<tr${k ? ' class="subrow"' : ""}>
        <td class="l">${k ? `<span class="subtag">${e.kind === "reingreso" ? "↩ reingresa" : "↳ entra"} ${e.inn}ª</span> ` : `<span class="ord num">${i + 1}</span> `}${esc(e.player)}${e.flag === "indebida" ? ` <span class="regtag bad">Alineación indebida</span>` : ""}</td>
        <td style="color:var(--ink-3)">${e.pos}</td>
        ${STAT_KEYS.map(k2 => `<td class="num">${+e[k2] || 0}</td>`).join("")}
        <td class="avg">${e.VB ? fmtPct(e.H / e.VB) : ".000"}</td>
      </tr>`).join("")).join("")}</tbody>
      <tfoot><tr><td class="l">Totales</td><td></td>${STAT_KEYS.map(k => `<td class="num">${sum(k)}</td>`).join("")}
        <td class="num">${sum("VB") ? fmtPct(sum("H") / sum("VB")) : ".000"}</td></tr></tfoot>
    </table></div>`;
}
function boxTables(g, box){
  const total = arr => arr.reduce((t, v) => t + (+v || 0), 0);
  const inn = box.innings;
  const line = inn && total(inn.a) === g.as && total(inn.h) === g.bs ? `<div class="tablewrap"><table class="line">
      <thead><tr><th class="l">Equipo</th>${inn.a.map((_, i) => `<th class="num">${i + 1}</th>`).join("")}<th class="num tot">C</th></tr></thead>
      <tbody>
        <tr><td class="l">${esc(g.a)}</td>${inn.a.map(v => `<td class="num">${+v || 0}</td>`).join("")}<td class="num tot">${total(inn.a)}</td></tr>
        <tr><td class="l">${esc(g.b)}</td>${inn.h.map(v => `<td class="num">${+v || 0}</td>`).join("")}<td class="num tot">${total(inn.h)}</td></tr>
      </tbody>
    </table></div>` : "";
  const pitch = box.pitch || { a: [], b: [] };
  return `${line}${battingSheet(g.a, box.sides.a)}${pitchSheet(g.a, pitch.a)}${battingSheet(g.b, box.sides.b)}${pitchSheet(g.b, pitch.b)}`;
}
function scoreSheet(g){
  const box = boxOf(g);

function teamDues(team){

/* ---------------- corregir resultados ---------------- */
let capMode = "nuevo";           // Capturar: "nuevo" (juegos programados) o "corregir" (ya capturados)
let corrections = [];            // historial: { id, w, cat, a, b, before, after, reason, at }
let fixForm = null;              // corrección en curso

/* Box score que se está editando: el de la corrección en curso o el de la captura. */
function bx(){ return (screen === "capturar" && capMode === "corregir" && fixForm && fixForm.box) || capState; }

/* Box score vigente de un juego: la última corrección que lo trae, o la captura de la sesión. */
function boxOf(g){
  if (!g) return null;
  for (let i = corrections.length - 1; i >= 0; i--) if (corrections[i].id === g.id && corrections[i].box) return corrections[i].box;
  if (SEASON_BOXES[g.id]) return SEASON_BOXES[g.id];
  if (captured && captured.id === g.id && captured.sides) return { sides: captured.sides, pitch: captured.pitch || { a: [], b: [] }, innings: captured.innings };
  return null;
}
const cloneBox = x => JSON.parse(JSON.stringify(x));
function boxChanged(g, box){
  const cur = boxOf(g);
  if (!cur) return true;
  const pick = b => JSON.stringify({ sides: b.sides, pitch: b.pitch || { a: [], b: [] } }, (k, v) => k === "typed" || k === "flag" ? undefined : v);
  return pick(cur) !== pick(box);
}
/* Orden al bat en blanco con el roster, para capturar el box score de un juego que solo tenía marcador. */
function blankLineup(team){
  const names = rosterOf(team);
  return names.length ? GENERIC_POS.map(pos => ({ entries: [newEntry("", pos)] })) : [];
}
/* El marcador de la corrección manda sobre las carreras con que se revisa el box score. */
function syncFixBox(f){
  if (!f || !f.box) return;
  f.box.a = [Number.isInteger(f.as) ? f.as : 0];
  f.box.h = [Number.isInteger(f.bs) ? f.bs : 0];
}
/* Al guardar un box score: nombres limpios, registro de jugadores nuevos y alineación indebida. */
function finalizeBox(S){
  const improper = [], registered = [];
  for (const side of ["a", "b"]){
    const team = side === "a" ? S.away : S.home;
    const slots = S.sides[side] || [];
    const pitchers = (S.pitch && S.pitch[side]) || [];
    const reg = lineupRegistration(team, slots, pitchers);
    pitchers.forEach(p => {
      delete p.flag;
      delete p.typed;
      const r = regOf(reg, p.player);
      p.player = r ? r.name : normName(p.player);
      if (r && r.st === "indebida") p.flag = "indebida";
      const o = outsOf(p.EL);
      if (!Number.isNaN(o)) p.EL = fmtEL(o);
    });
    slots.forEach(s => s.entries.forEach(e => {
      delete e.flag;
      delete e.typed;
      const r = regOf(reg, e.player);
      e.player = r ? r.name : normName(e.player);
      if (r && r.st === "indebida") e.flag = "indebida";
    }));
    const added = [...reg.values()].filter(r => r.st === "nuevo").map(r => r.name);
    if (added.length) ROSTERS[team] = rosterOf(team).concat(added);
    registered.push(...added);
    improper.push(...[...reg.values()].filter(r => r.st === "indebida").map(r => `${r.name} (${team})`));
  }
  return { registered, improper };
}
const boxToast = r => `${r.registered.length ? ` · ${plural(r.registered.length, "jugador registrado", "jugadores registrados")}` : ""}${
  r.improper.length ? ` · alineación indebida: ${r.improper.join(", ")}` : ""}`;

const WHY_NJ = ["Lluvia", "Falla de luz en el campo", "Suspendido por la liga", "Otro motivo"];
const correctable = week => calGames()
  .filter(g => g.w === week && g.d <= TODAY && (isPlayed(g) || g.st === "NJ"))
  .sort((x, y) => (x.d + x.h + fieldOf(x)).localeCompare(y.d + y.h + fieldOf(y)));
const fixGame = () => (fixForm && calGames().find(g => g.id === fixForm.gameId)) || null;
const snapshot = g => ({ st: g.st, as: g.as ?? null, bs: g.bs ?? null, ff: g.ff || null, why: g.why || null });
const sameResult = (x, y) => ["st", "as", "bs", "ff", "why"].every(k => (x[k] ?? null) === (y[k] ?? null));

function afterOf(f){
  if (f.st === "FF") return { st: "FF", as: f.ff === "a" ? 0 : 7, bs: f.ff === "a" ? 7 : 0, ff: f.ff, why: null };
  if (f.st === "NJ") return { st: "NJ", as: null, bs: null, ff: null, why: f.why };
  return { st: "F", as: f.as, bs: f.bs, ff: null, why: null };
}
const fixFormFor = g => g
  ? { week: g.w, gameId: g.id, st: g.st, as: g.as ?? 0, bs: g.bs ?? 0, ff: g.ff || "b", why: g.why || WHY_NJ[0], reason: "" }
  : null;
function defaultFixForm(){
  for (let w = TODAY_WEEK; w >= 1; w--){
    const gs = correctable(w);
    if (gs.length) return fixFormFor(gs[gs.length - 1]);
  }
  return { week: TODAY_WEEK, gameId: null, st: "F", as: 0, bs: 0, ff: "b", why: WHY_NJ[0], reason: "" };
}

function describeResult(s, a, b){
  if (s.st === "FF") return `forfit de ${s.ff === "a" ? a : b} (${s.as}–${s.bs})`;
  if (s.st === "NJ") return `no se jugó (${s.why})`;
  return `${s.as}–${s.bs}`;
}
const winnerOf = (s, a, b) => s.st === "NJ" ? null : s.as > s.bs ? a : s.bs > s.as ? b : null;
const rankTable = catId => tableFor(catId)
  .sort((x, y) => y.JG - x.JG || x.JP - y.JP || (y.CF - y.CC) - (x.CF - x.CC) || y.CF - x.CF);

function fixChecks(g, f){
  const errors = [], warnings = [];
  const after = afterOf(f), before = snapshot(g);
  syncFixBox(f);
  const boxEdit = f.st === "F" && !!f.box;
  if (sameResult(after, before) && !(boxEdit && boxChanged(g, f.box)))
    errors.push(boxEdit ? "No hay cambios: el resultado y el box score son iguales a lo capturado." : "El resultado nuevo es igual al que ya está capturado.");
  if (f.st === "F" && [f.as, f.bs].some(v => !Number.isInteger(v) || v < 0 || v > 99)) errors.push("Las carreras deben ser números enteros entre 0 y 99.");
  if ((f.reason || "").trim().length < 3) errors.push("Escribe el motivo de la corrección.");
  if (boxEdit){
    const n = captureErrors().length;
    if (n) errors.push(`El box score tiene ${plural(n, "error", "errores")}: revísalo en su panel.`);
  }
  if (f.st === "F" && Number.isInteger(f.as) && f.as === f.bs) warnings.push("Queda empatado: cuenta como juego empatado en la tabla.");
  const wasWinner = winnerOf(before, g.a, g.b), nowWinner = winnerOf(after, g.a, g.b);
  if (wasWinner && nowWinner && wasWinner !== nowWinner) warnings.push(`Cambia el ganador: antes ganaba ${wasWinner}, ahora gana ${nowWinner}.`);
  if (after.st === "NJ" && before.st !== "NJ") warnings.push("El juego sale de la tabla y queda por reprogramar.");
  if (before.st === "NJ" && after.st !== "NJ") warnings.push("El juego entra a la tabla con este resultado.");
  if (f.box && f.st !== "F") warnings.push("El box score solo se guarda en juegos con estado Final.");
  return { errors, warnings };
}

/* Cómo quedarían los dos equipos en la tabla con la corrección, sin guardarla. */
function fixPreview(g, after){
  const before = rankTable(g.c);
  corrections.push({ id: g.id, after });
  const later = rankTable(g.c);
  corrections.pop();
  const rec = r => `${r.JG}-${r.JP}${r.JE ? `-${r.JE}` : ""}`;
  return [g.a, g.b].map(team => {
    const b = before.find(r => r.team === team), a = later.find(r => r.team === team);
    return { team, rec: [rec(b), rec(a)], pos: [before.indexOf(b) + 1, later.indexOf(a) + 1], cf: [b.CF, a.CF], cc: [b.CC, a.CC] };
  });
}

/* La parte que se actualiza mientras se escribe, sin redibujar los campos. */
function fixLive(){
  const g = fixGame();
  if (!g) return "";
  const check = fixChecks(g, fixForm);
  const after = afterOf(fixForm);
  const preview = sameResult(after, snapshot(g)) || (fixForm.st === "F" && [fixForm.as, fixForm.bs].some(v => !Number.isInteger(v))) ? [] : fixPreview(g, after);
  const arrow = (x, y) => String(x) === String(y) ? `<span>${x}</span>` : `<span class="from">${x}</span> → <b>${y}</b>`;
  return `
    <ul class="checks" aria-live="polite">
      ${check.errors.map(e => `<li class="err">${esc(e)}</li>`).join("")}
      ${check.warnings.map(w => `<li class="warn">${esc(w)}</li>`).join("")}
      ${!check.errors.length && !check.warnings.length ? `<li class="ok">Listo para guardar.</li>` : ""}
    </ul>
    ${preview.length ? `<div class="fixpreview">
      <p>Así queda la tabla de ${esc(catName(g.c))}</p>
      <ul>${preview.map(p => `<li>${crest(p.team)}<b class="t">${esc(p.team)}</b>
        <span>Récord ${arrow(p.rec[0], p.rec[1])}</span>
        <span>Lugar ${arrow(p.pos[0] + "º", p.pos[1] + "º")}</span>
        <span>CF ${arrow(p.cf[0], p.cf[1])} · CC ${arrow(p.cc[0], p.cc[1])}</span>
      </li>`).join("")}</ul>
    </div>` : ""}
    <div class="savebar">
      <span class="hint">${check.errors.length ? "Corrige lo marcado para poder guardar." : "El resultado anterior queda en el historial."}</span>
      <button class="btn primary" id="fix-save"${check.errors.length ? " disabled" : ""}>Guardar corrección</button>
    </div>`;
}
const refreshFix = () => {
  const box = document.getElementById("fix-live");
  if (box) box.innerHTML = fixLive();
  const g = fixGame();
  if (!g) return;
  const check = fixChecks(g, fixForm);
  const st = document.getElementById("fb-status"), sc = document.getElementById("fb-score"), btn = document.querySelector("[data-fixsave]");
  if (st) st.innerHTML = fixStatusHtml(check);
  if (sc) sc.textContent = fixScore();
  if (btn) btn.disabled = check.errors.length > 0;
};

/* ---------------- programar juegos ---------------- */
const WEIGHTS = { nuevo: 40, revancha: -30, pendiente: 5, atraso: 10, descanso: 1, descansoMax: 10, parejo: 20, suspendido: 60 };
const dateInWeek = (w, dow) => new Date(parseD(WEEK1).getTime() + ((w - 1) * 7 + dow) * DAY_MS).toISOString().slice(0, 10);
const isWeekendDate = d => { const dow = parseD(d).getUTCDay(); return dow === 0 || dow === 6; };

/* Juegos y semanas que el administrador crea en la demo; entran al calendario. */
let scheduled = [];
let schedSeq = 0;
let createdWeeks = 0;            // semanas abiertas a mano después de la última del rol
let showSugg = false;            // las sugerencias van ocultas hasta que se piden

/* El calendario llega hasta la última semana creada o con juegos. */
const calWeeks = () => Math.max(WEEKS + createdWeeks, ...calGames().map(g => g.w));

/* Días de la semana en que juega la categoría y primer horario libre de su campo. */
const weekDays = (cat, w) => (cat.days === "Sábados y domingos" ? [5, 6] : [0, 1, 2, 3, 4]).map(off => dateInWeek(w, off));
const busySlots = (cat, w) => new Set(calGames()
  .filter(g => g.w === w && fieldOf(g) === cat.field && g.st !== "NJ").map(g => g.d + "|" + g.h));
function firstFree(cat, w){
  const times = cat.times || ["19:00", "21:00"];
  const busy = busySlots(cat, w);
  const days = weekDays(cat, w).filter(d => d >= TODAY);
  for (const d of days) for (const h of times) if (!busy.has(d + "|" + h)) return { d, h };
  return { d: days[0] || weekDays(cat, w)[0], h: times[0] };
}
const freeCount = (cat, w) => {
  const busy = busySlots(cat, w);
  return weekDays(cat, w).filter(d => d >= TODAY)
    .reduce((n, d) => n + (cat.times || ["19:00", "21:00"]).filter(h => !busy.has(d + "|" + h)).length, 0);
};

const defaultSchedForm = () => {
  const cat = mainCat(), w = calWeeks();
  return { cat: cat.id, w, a: "", b: "", ...firstFree(cat, w) };
};
let schedForm = defaultSchedForm();

/* Lo que impide programar (errores) y lo que conviene saber (avisos). */
function schedCheck(f){
  if (f.po) return playoffSchedCheck(f);
  const cat = CATEGORIES.find(c => c.id === f.cat) || mainCat();
  const teams = TEAMS[cat.id] || [];
  const errors = [], warnings = [];
  if (!teams.length) errors.push(`${cat.name} todavía no tiene equipos inscritos.`);
  else if (!f.a || !f.b) errors.push("Elige los dos equipos.");
  else if (f.a === f.b) errors.push("Un equipo no puede jugar contra sí mismo.");

  if (!freeCount(cat, f.w)){
    errors.push(`La semana ${f.w} ya no tiene horarios libres en el ${cat.field.toLowerCase()}. Crea la semana ${calWeeks() + 1} para seguir programando.`);
    return { errors, warnings };
  }
  if (f.d < TODAY) errors.push("Ese día ya pasó.");
  if (cat.times && !cat.times.includes(f.h)) errors.push(`${cat.name} solo juega a las ${listJoin(cat.times)}.`);

  const games = calGames().filter(g => g.st !== "NJ");
  const clash = games.find(g => g.d === f.d && g.h === f.h && fieldOf(g) === cat.field);
  if (clash) errors.push(`El ${cat.field.toLowerCase()} ya tiene ${clash.a} vs ${clash.b} (${catName(clash.c)}) a esa hora.`);

  for (const t of [f.a, f.b].filter(Boolean)){
    const load = games.filter(g => !g.po && (g.a === t || g.b === t));
    if (load.length >= SEASON.games) errors.push(`${t} ya tiene sus ${SEASON.games} juegos de temporada regular (${plural(load.filter(isPlayed).length, "jugado", "jugados")}, ${plural(load.filter(g => g.st === "P").length, "programado", "programados")}).`);
    else if (load.length === SEASON.games - 1) warnings.push(`Con este juego ${t} completa sus ${SEASON.games} juegos de temporada regular.`);
    const same = games.find(g => g.d === f.d && (g.a === t || g.b === t));
    if (same) errors.push(`${t} ya juega ese día a las ${same.h}.`);
    const n = games.filter(g => g.w === f.w && (g.a === t || g.b === t)).length;
    if (n >= 2) warnings.push(`${t} ya tiene ${n} juegos esa semana.`);
    if (blockedByDues(t)) warnings.push(`${t} lleva ${plural(teamDues(t).owed, "semana", "semanas")} sin cubrir su inscripción; la regla sugiere no programarlo.`);
  }
  if (f.a && f.b && f.a !== f.b){
    const met = games.filter(g => (g.a === f.a && g.b === f.b) || (g.a === f.b && g.b === f.a)).map(g => g.d).sort();
    if (met.length) warnings.push(`Revancha: ya se enfrentan el ${listJoin(met.map(fmtDay))}.`);
  }
  return { errors, warnings };
}

/* Horarios del campo en la semana elegida: ocupados y libres. */
function slotGrid(f){
  const cat = CATEGORIES.find(c => c.id === f.cat) || mainCat();
  const times = cat.times || ["19:00", "21:00"];
  const games = calGames().filter(g => g.w === f.w && fieldOf(g) === cat.field && g.st !== "NJ");
  return `
    <div class="slothead">${esc(cat.field)} · semana ${f.w} · ${weekRange(f.w)}</div>
    <div class="slots" style="grid-template-columns:78px repeat(${times.length}, minmax(0,1fr))">
      <span></span>${times.map(h => `<span class="sh num">${h}</span>`).join("")}
      ${weekDays(cat, f.w).map(d => `<span class="sd">${DIAS[parseD(d).getUTCDay()].slice(0, 3)} ${parseD(d).getUTCDate()}</span>` + times.map(h => {
        const g = games.find(x => x.d === d && x.h === h);
        const sel = f.d === d && f.h === h;
        if (g) return `<span class="slot busy${String(g.id || "").startsWith("sch-") ? " mine" : ""}${sel ? " sel" : ""}">
            ${esc(g.a)} <i>vs</i> ${esc(g.b)}<small>${esc(catName(g.c))}</small></span>`;
        const past = d < TODAY;
        return `<button class="slot free${sel ? " sel" : ""}" data-pickslot="${d}|${h}" ${past ? "disabled" : ""}>${sel ? "Elegido" : past ? "Ya pasó" : "Libre"}</button>`;
      }).join("")).join("")}
    </div>`;
}

/* Lo que se sabe de cada equipo de una categoría: juegos (jugados y programados),
   rivales ya enfrentados, último juego y récord. */
function planStats(catId){
  const teams = TEAMS[catId] || [];
  const games = calGames().filter(g => g.c === catId);
  const st = Object.fromEntries(teams.map(t => [t, { games: 0, opp: new Map(), last: null, lastH: null }]));
  for (const g of games){
    if (g.st === "NJ" || g.po) continue;
    for (const [me, other] of [[g.a, g.b], [g.b, g.a]]){
      const s = st[me];
      if (!s) continue;
      s.games++;
      s.opp.set(other, g.d);
      if (!s.last || g.d + g.h > s.last + s.lastH){ s.last = g.d; s.lastH = g.h; }
    }
  }
  const table = Object.fromEntries(tableFor(catId).map(r => [r.team, r]));
  const avg = teams.length ? teams.reduce((t, x) => t + st[x].games, 0) / teams.length : 0;
  return { teams, st, table, avg, suspended: games.filter(g => g.st === "NJ") };
}

function pairScore(catId, S, a, b, week){
  const A = S.st[a], reasons = [];
  let score = 0;
  const met = A.opp.get(b);
  if (S.suspended.some(g => (g.a === a && g.b === b) || (g.a === b && g.b === a))){
    score += WEIGHTS.suspendido; reasons.push({ t: "Juego suspendido por reprogramar" });
  }
  if (met){ score += WEIGHTS.revancha; reasons.push({ t: `Revancha: ya jugaron el ${fmtDay(met)}`, neg: true }); }
  else { score += WEIGHTS.nuevo; reasons.push({ t: "Nunca se han enfrentado" }); }

  const pending = t => (S.teams.length - 1) - S.st[t].opp.size;
  score += WEIGHTS.pendiente * (pending(a) + pending(b));
  reasons.push({ t: `Rivales pendientes: ${pending(a)} y ${pending(b)}` });

  const behind = t => Math.max(0, S.avg - S.st[t].games);
  score += WEIGHTS.atraso * (behind(a) + behind(b));
  for (const t of [a, b]) if (behind(t) >= 0.5)
    reasons.push({ t: `${t} va atrasado: ${S.st[t].games} juegos, el promedio es ${S.avg.toFixed(1)}` });

  const monday = dateInWeek(week, 0);
  const rest = t => S.st[t].last ? Math.max(0, Math.round((parseD(monday) - parseD(S.st[t].last)) / DAY_MS)) : 14;
  score += WEIGHTS.descanso * (Math.min(rest(a), WEIGHTS.descansoMax) + Math.min(rest(b), WEIGHTS.descansoMax));
  const rested = rest(a) >= rest(b) ? a : b;
  if (rest(rested) >= 7) reasons.push({ t: `${rested} llega con ${rest(rested)} días sin jugar` });

  const ta = S.table[a], tb = S.table[b];
  if (ta && tb && ta.JJ && tb.JJ){
    const gap = Math.abs(pct(ta) - pct(tb));
    score -= WEIGHTS.parejo * gap;
    reasons.push(gap <= 0.25
      ? { t: `Parejo: ${ta.JG}-${ta.JP} contra ${tb.JG}-${tb.JP}` }
      : { t: `Disparejo: ${ta.JG}-${ta.JP} contra ${tb.JG}-${tb.JP}`, neg: true });
  }
  return { a, b, c: catId, score: Math.round(score), reasons };
}

/* Arma la semana elegida por campo, respetando lo que ya está programado en ella: primero
   un juego para cada equipo y luego segundos juegos, nadie dos veces la misma noche,
   alternando el horario de su último juego. */
function suggestWeek(week){
  const fields = {};
  for (const c of CATEGORIES.filter(c => c.active && c.days !== "Sábados y domingos"))
    (fields[c.field] = fields[c.field] || []).push(c.id);

  return Object.entries(fields).map(([field, cats]) => {
    const pool = [], excluded = [], stats = {}, eligible = [];
    for (const catId of cats){
      const S = stats[catId] = planStats(catId);
      const ok = S.teams.filter(t => !blockedByDues(t) && S.st[t].games < SEASON.games);
      eligible.push(...ok);
      excluded.push(...S.teams.filter(blockedByDues).map(team => ({ team, owed: teamDues(team).owed })));
      for (let i = 0; i < ok.length; i++) for (let j = i + 1; j < ok.length; j++) pool.push(pairScore(catId, S, ok[i], ok[j], week));
    }
    pool.sort((x, y) => y.score - x.score);

    const slots = [];
    for (let dow = 0; dow < 5; dow++) for (const h of ["19:00", "21:00"]){
      const d = dateInWeek(week, dow);
      if (d >= TODAY) slots.push({ d, h });
    }
    const existing = calGames().filter(g => g.w === week && fieldOf(g) === field && g.st !== "NJ" && !isWeekendDate(g.d));
    const taken = new Set(existing.map(g => g.d + g.h)), night = new Set(), count = {}, used = new Set(), picked = [];
    const CAP = slots.filter(sl => !taken.has(sl.d + sl.h)).length;
    const extra = {};
    for (const g of existing){
      for (const t of [g.a, g.b]){ count[t] = (count[t] || 0) + 1; night.add(t + g.d); }
      used.add(g.a + "|" + g.b); used.add(g.b + "|" + g.a);
    }
    for (const limit of [1, 2]){
      for (const p of pool){
        if (picked.length >= CAP) break;
        if (used.has(p.a + "|" + p.b) || (count[p.a] || 0) >= limit || (count[p.b] || 0) >= limit) continue;
        const full = t => stats[p.c].st[t].games + (extra[t] || 0) >= SEASON.games;
        if (full(p.a) || full(p.b)) continue;
        picked.push(p); used.add(p.a + "|" + p.b); used.add(p.b + "|" + p.a);
        count[p.a] = (count[p.a] || 0) + 1; count[p.b] = (count[p.b] || 0) + 1;
        extra[p.a] = (extra[p.a] || 0) + 1; extra[p.b] = (extra[p.b] || 0) + 1;
      }
    }

    const alternates = (p, sl) => [p.a, p.b].filter(t => { const last = stats[p.c].st[t].lastH; return last && last !== sl.h; }).length;
    const assign = i => {
      if (i === picked.length) return true;
      const p = picked[i];
      const opts = slots
        .filter(sl => !taken.has(sl.d + sl.h) && !night.has(p.a + sl.d) && !night.has(p.b + sl.d))
        .sort((x, y) => alternates(p, y) - alternates(p, x) || (x.d + x.h).localeCompare(y.d + y.h));
      for (const sl of opts){
        taken.add(sl.d + sl.h); night.add(p.a + sl.d); night.add(p.b + sl.d);
        p.d = sl.d; p.h = sl.h;
        if (assign(i + 1)) return true;
        taken.delete(sl.d + sl.h); night.delete(p.a + sl.d); night.delete(p.b + sl.d);
      }
      return false;
    };
    while (picked.length && !assign(0)) picked.pop();

    return {
      field, cats, excluded, cap: CAP,
      games: picked.slice().sort((x, y) => (x.d + x.h).localeCompare(y.d + y.h)),
      idle: eligible.filter(t => !count[t]),
    };
  });
}

/* Eliminar un juego programado lo quita del calendario; los juegos con resultado no se eliminan. */
function unscheduleGame(id){
  const g = calGames().find(x => x.id === id && x.st === "P");
  if (!g) return;
  scheduled = scheduled.filter(x => x.id !== id);
  const i = CAL.findIndex(x => x.id === id);
  if (i >= 0) CAL.splice(i, 1);
  if (capState.gameId === id) setCaptureGame(null);
  if (openGame === id) openGame = null;
  render();
  toast(`Juego eliminado: ${g.a} vs ${g.b} · semana ${g.w}`);
}

function seasonCard(c){
  const teams = TEAMS[c.id] || [];
  const P = SEASON.playoffs[c.id] || 0;
  const max = teams.length >= 2 ? teams.length : 16;
  const G = SEASON.games;
  const S = planStats(c.id);
  const table = Object.fromEntries(tableFor(c.id).map(r => [r.team, r]));
  const games = calGames().filter(g => g.c === c.id && g.st !== "NJ" && !g.po);
  const played = games.filter(isPlayed).length, programmed = games.filter(g => g.st === "P").length;
  const need = teams.length * G / 2;
  const left = need - played - programmed;
  const rows = teams.map(t => {
    const jj = (table[t] || {}).JJ || 0, all = S.st[t].games, prog = all - jj, faltan = G - all;
    const st = faltan > 0 ? { cls: "", txt: `Faltan ${faltan} por programar` } : faltan === 0 ? { cls: "done", txt: "Completo" } : { cls: "over", txt: `Pasa por ${-faltan}` };
    return `<li>
      <span class="t">${crest(t)}<span>${esc(t)}</span></span>
      <span class="gcbar" title="${jj} jugados y ${prog} programados de ${G}"><i class="pl" style="width:${Math.min(100, jj / G * 100)}%"></i><i class="pr" style="width:${Math.max(0, Math.min(100 - jj / G * 100, prog / G * 100))}%"></i></span>
      <span class="num">${all} de ${G}</span>
      <span class="gcst ${st.cls}">${st.txt}</span>
    </li>`;
  }).join("");
  return `<section class="panel seasoncard">
    <div class="panel-h"><h2 class="display">${esc(c.name)}</h2><span class="meta">${teams.length ? plural(teams.length, "equipo", "equipos") : "Sin equipos"} · ${esc(c.field)}</span></div>
    <div class="rulebody">
      <span>Pasan a playoffs los</span>
      <span class="stepper">
        <button data-playoffs="${c.id}|-1" aria-label="Un equipo menos a playoffs en ${esc(c.name)}" ${P <= 2 ? "disabled" : ""}>−</button>
        <output class="num" aria-live="polite">${P}</output>
        <button data-playoffs="${c.id}|1" aria-label="Un equipo más a playoffs en ${esc(c.name)}" ${P >= max ? "disabled" : ""}>+</button>
      </span>
      <span>primeros${teams.length ? ` de ${teams.length}` : ""} de la tabla.</span>
    </div>
    ${teams.length ? `
    <div class="ruleresult">Temporada regular: <b>${played}</b> juegos jugados y <b>${programmed}</b> programados de <b>${need}</b>. ${
      left > 0 ? `Faltan ${plural(left, "juego", "juegos")} por programar.` : left === 0 ? "Ya están todos programados." : `Hay ${plural(-left, "juego", "juegos")} de más.`}</div>
    <ul class="gamecount">${rows}</ul>` : `<p class="capnote seasonempty">Cuando se inscriban equipos, aquí se ve cuántos juegos lleva cada uno.</p>`}
  </section>`;
}
